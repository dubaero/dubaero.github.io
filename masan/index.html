/* v10: 10년 뒤 내 명함 뽑기 · AI 거짓말 탐정 · 보완 문장 변신 (상단 브랜드 영역은 v9 그대로) */
:root{--gm-ink:#1e3630;--gm-paper:#fffaf0;--gm-coral:#e8765c;--gm-coral-soft:#ffe6df;--gm-lemon:#f7d56a;--gm-lemon-soft:#fff3c9;--gm-mint:#dcefe4;--gm-sky:#dceaf7;--gm-rain:#e6e8ef;--gm-muted:#5f6f67;--gm-display:'Jua','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
.nav{grid-template-columns:repeat(8,minmax(0,1fr))}
.nav button.nav-card{background:var(--gm-lemon-soft);border-color:#e3c45c;color:#5b4710}
.nav button.nav-card.active{background:var(--gm-lemon);border-color:var(--gm-ink);color:var(--gm-ink)}
.feature-card.fc-card{background:var(--gm-lemon-soft)!important;border:2px solid var(--gm-ink)!important;box-shadow:4px 4px 0 var(--gm-ink)!important}
.feature-card.fc-card strong{font-family:var(--gm-display);font-weight:400;font-size:19px}
.gm{background:var(--gm-paper);border:2px solid var(--gm-ink)!important;box-shadow:6px 6px 0 var(--gm-ink)!important}
.gm-eyebrow{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;color:#8a3c26;background:var(--gm-coral-soft);border-radius:30px;padding:4px 11px}
.gm-title{font-family:var(--gm-display);font-weight:400;font-size:clamp(24px,3vw,34px);line-height:1.25;margin:10px 0 4px;letter-spacing:-.5px;text-wrap:balance}
.gm h3{font-family:var(--gm-display);font-weight:400;font-size:20px;margin:0 0 8px}
.gm h3 small{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:12px;color:var(--gm-muted);font-weight:600;margin-left:6px}
.gm-steps{display:flex;gap:6px;list-style:none;padding:0;margin:18px 0 20px;flex-wrap:wrap}
.gm-steps li{flex:1;min-width:92px;display:flex;align-items:center;gap:7px;font-weight:800;color:#8a978f;font-size:13px;padding:8px 10px;border:2px dashed #c9d4cd;border-radius:12px;background:#fff}
.gm-steps li span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eef2ef;font-size:12px;flex-shrink:0}
.gm-steps li.now{border:2px solid var(--gm-ink);background:var(--gm-lemon);color:var(--gm-ink)}
.gm-steps li.now span{background:#fff}
.gm-steps li.done{border-style:solid;border-color:#86b39b;color:#2f6b56;background:#eef6f0}
.gm-steps li.done span{background:#2f6b56;color:#fff}
.gm-navrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:2px dashed #d9cdb0}
.gm-go{background:var(--gm-coral)!important;border:2px solid var(--gm-ink)!important;color:#fff!important;box-shadow:3px 3px 0 var(--gm-ink);font-size:15px}
.gm-go:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--gm-ink)}
.gm-go:disabled{opacity:.45;cursor:not-allowed;transform:none}
/* 라운드 0: 사원증 */

const interviewBase=[['자기소개','자신에 대해 30초 정도 소개해 주시겠어요?'],['지원동기','이 직무에 지원하려는 이유는 무엇인가요?'],['경험','직접 해본 일 가운데 이 업무에 도움이 될 경험을 말씀해 주세요.'],['업무 방식','처음 맡는 업무를 배워야 할 때 어떻게 하시겠어요?'],['협업','동료와 의견이 다를 때 어떻게 이야기하시겠어요?'],['보완','업무에서 어렵게 느끼는 부분과 보완 중인 방법을 알려주세요.'],['공백기','최근 준비한 일이나 다시 일하기 위해 노력한 점이 있나요?']];
function avatarSvg(i=0){let tones=['#d9a987','#a97a61','#c89a78'];let shirts=['#6b8d78','#8d789d','#b5806f'];return `<svg viewBox="0 0 74 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="한국인 성인 탐험 캐릭터"><path d="M9 77C12 55 24 51 37 51S62 55 65 77" fill="${shirts[i]}"/><ellipse cx="37" cy="30" rx="23" ry="26" fill="#3a302d"/><ellipse cx="37" cy="34" rx="18" ry="21" fill="${tones[i]}"/><path d="M19 29Q17 7 37 8Q58 8 55 30Q48 18 39 20Q27 23 19 29" fill="#302827"/><circle cx="30" cy="34" r="1.6" fill="#34302f"/><circle cx="44" cy="34" r="1.6" fill="#34302f"/><path d="M32 44Q37 48 42 44" fill="none" stroke="#8b554d" stroke-width="1.6" stroke-linecap="round"/></svg>`}
function showToast(txt){let d=document.createElement('div');d.className='toast';d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),2900)}
function nav(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function bindText(id,field){let el=document.getElementById(id);if(el){el.value=state[field]||'';el.addEventListener('input',ev=>{state[field]=ev.target.value;if(field==='cover'||field==='name'||field==='contact'||field==='history')updatePreview()})}}
function render(){stopVoiceInput();document.getElementById('nav').innerHTML=pages.map(([p,label],i)=>`<button class="${p==='card'?'nav-card ':''}${p===state.page?'active':''}" onclick="nav('${p}')">${String(i+1).padStart(2,'0')}<br>${label}</button>`).join('');document.getElementById('app').innerHTML=views[state.page]();init[state.page]?.()}
function section(title,subtitle,badge=''){return `<div class="section-title"><div><h2>${title}</h2><p>${subtitle}</p></div>${badge?`<span class="tag">${badge}</span>`:''}</div>`}
const views={
home:()=>`<section class="panel">${section('오늘의 탐험 안내','다섯 가지 활동을 연결하면 나의 취업 준비 자료가 완성됩니다.','3시간 실습')}<div class="grid">${[['나를 이해하기','좋아하는 활동과 일하는 방식, 관계의 선호를 살펴봅니다.','self'],['강점과 경험 정리','실제로 한 일에서 강점과 보완할 점을 찾습니다.','strength'],['10년 뒤 직업 도감','늘어날·새로 뜨는·바뀌는·대체 중인 직업 100장을 보고 나와 닮은 직업을 찾아요.','card'],['직업 탐색하기','직업이 하는 일과 준비 조건을 비교합니다.','jobs'],['입사지원서 작성','원본 증명사진으로 실제 서식을 완성합니다.','resume'],['면접 연습','예상 질문에 답하고 기준별 피드백을 받습니다.','interview']].map(([a,b,p])=>`<div class="tile"><div class="accent"></div><h3>${a}</h3><p>${b}</p><button class="btn light small" onclick="nav('${p}')">시작하기 →</button></div>`).join('')}</div></section><section class="panel">${section('사진과 탐험 캐릭터','앞 강사님이 준비한 사진을 등록하되, 지원서에는 반드시 원본을 사용합니다.')}<div class="two"><div><label class="field"><span>증명사진 파일 선택 (선택 사항)</span><input type="file" id="photo" accept="image/png,image/jpeg"></label><p class="muted">사진은 이 브라우저의 작업 중 메모리에만 둡니다. 외부 AI로 전송하거나 얼굴을 자동 변환하지 않습니다.</p><div id="photoPreview"></div></div><div><p style="margin-top:0;font-weight:800">탐험 안내 캐릭터 선택 (기본 일러스트 · 사진 자동 변환 아님)</p><div class="row">${[0,1,2].map(i=>`<button class="character ${state.avatar===i?'on':''}" onclick="state.avatar=${i};render()"><span class="avatar">${avatarSvg(i)}</span><span class="character-name">${['서연','지윤','민서'][i]}</span></button>`).join('')}</div><p class="muted">한국인 성인 인물로 디자인한 기본 일러스트입니다. 본인의 얼굴사진을 변환하는 AI 기능은 포함되지 않습니다.</p></div></div></section>`,
self:()=>`<section class="panel">${section('나를 이해하기','색상 탭을 눌러 질문을 바꾸고 하나씩 답해보세요.','교육용 자기탐색')}<div class="banner">정식 심리검사가 아닌 자기이해 활동입니다. 결과만으로 성격·적성을 판정하지 않습니다.</div><div class="qtabs">${qs.map((q,i)=>`<button class="qtab ${state.selfTab===i?'active':''}" data-selftab="${i}"><small>${state.questions[q.id]?'✓ 완료':'질문 '+(i+1)}</small>${['흥미','업무방식','관계','어려울 때','근무조건'][i]}</button>`).join('')}</div><div class="question-focus"><div class="eyebrow">질문 ${state.selfTab+1} / ${qs.length}</div><h3>${qs[state.selfTab].title}</h3><div class="choice-grid">${qs[state.selfTab].options.map(o=>`<button class="choice ${state.questions[qs[state.selfTab].id]===o?'on':''}" data-q="${qs[state.selfTab].id}" data-val="${E(o)}">${o}</button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn outline" data-selfprev ${state.selfTab===0?'disabled':''}>이전 질문</button><button class="btn light" data-selfnext ${state.selfTab===qs.length-1?'disabled':''}>다음 질문</button><button class="btn" onclick="nav('strength')">강점 찾기로 이동 →</button></div></div></section><section class="panel">${section('나의 관계 사용설명서','내 답을 바탕으로 성격 유형 해설처럼 풀어 본 설명서예요. 재미로 읽어 보세요.')}<div id="selfResult">${selfResult()}</div></section>`,
strength:()=>`<section class="panel">${section('강점과 경험을 발견하기','선택한 강점이 실제 행동으로 드러난 경험을 적는 것이 중요합니다.','서류 작성 연결')}<h3>내가 잘한다고 느끼거나 잘할 수 있을 것 같은 활동을 골라보세요.</h3><div class="choice-grid">${strengths.map(s=>`<button class="choice ${state.strengths.includes(s)?'on':''}" data-strength="${E(s)}">${s}</button>`).join('')}</div><p class="muted">여러 개 선택할 수 있습니다. 선택은 역량 증명이 아니며, 아래 실제 경험과 연결해 확인합니다.</p><h3>보완하고 싶은 부분도 선택할 수 있어요.</h3><div class="choice-grid">${improvements.map(s=>`<button class="choice ${state.improvements.includes(s)?'on':''}" data-improve="${E(s)}">${s}</button>`).join('')}</div><div class="result" id="improvementOutput">${improvementText()}</div><h3>내가 실제로 해본 일 세 가지</h3><p class="muted">직장·아르바이트·자원봉사·모임·일상 중 자신이 편한 경험을 적어주세요. 이름·주민번호·개인 사정은 입력하지 않습니다.</p>${[0,1,2].map(i=>`<label class="field"><span>경험 ${i+1} · 내가 실제로 한 행동</span><textarea id="exp${i}" placeholder="예: 매장에서 상품 수량을 확인하고 부족한 물건을 채웠습니다.">${E(state.experiences[i])}</textarea></label>`).join('')}<button class="btn" onclick="nav('card')">10년 뒤 직업 도감 보러 가기 →</button></section>`,
jobs:()=>`<section class="panel">${section('직업세계 탐색','직업을 단정적으로 추천하기보다, 내가 관심을 가질 만한 후보와 확인사항을 살펴봅니다.','공식 자료 확인')}<div class="banner">직종 후보는 NCS 대분류를 참고해 묶은 교육용 예시이며, 모든 직업의 정확한 NCS 세분류 코드와 1:1 매칭한 목록은 아닙니다. 창업은 직업이 아닌 진로 방식으로 별도 묶었습니다. 이 카드는 교육용 직무 소개입니다. 실시간 채용공고나 최신 지역 구인통계를 표시하지 않습니다. 실제 자격·모집·급여·마감은 공식 채용공고에서 반드시 다시 확인하세요.</div><div class="row"><input class="search" style="flex:1;min-width:210px" id="jobsearch" placeholder="직업명, 업무, 분야 검색" value=""><button class="btn light" onclick="window.open('https://www.work24.go.kr/','_blank','noopener')">고용24 채용정보 ↗</button></div><div class="selected-preferences"><b>나의 희망직종 (최대 3개)</b><p class="muted">직업 카드에서 ‘희망직종 추가’를 선택하세요. 지원서용 직무는 아래에서 별도로 정할 수 있습니다.</p><div id="preferredJobChips"></div></div><div id="job-theme" class="job-theme-banner" aria-live="polite"></div><div id="jobResults" class="jobgrid"></div><div class="result"><b>내가 선택한 지원 직무:</b> <span id="selectedjob">${E(state.job)}</span><div class="muted">직업 카드를 선택한 뒤, 실제 공고 원문을 보고 지원 자격과 업무 내용을 비교하세요.</div></div><div id="careerIntro"></div><div class="two"><label class="field"><span>채용공고에서 확인한 주요 업무·필수 조건 (개인정보 제외)</span><textarea id="jobpost" placeholder="예: 문서 정리, 기본 컴퓨터 활용, 주 5일 근무">${E(state.jobpost)}</textarea></label><div class="result"><h3>새롭게 변화하는 직업 탐색</h3><p class="muted">AI·디지털 기술로 업무가 변화하는 직업이 있습니다. '없어질 직업'이라고 단정하지 않고, 실제 업무가 어떻게 변하는지 공식 자료를 확인합니다.</p><a href="https://www.keis.or.kr/" target="_blank" rel="noopener">한국고용정보원 자료 확인 ↗</a><br><a href="https://www.work24.go.kr/" target="_blank" rel="noopener">고용24에서 직업·채용 정보 찾기 ↗</a></div></div><button class="btn" onclick="nav('resume')">입사지원서 작성하기 →</button></section>`,
resume:()=>`<section class="panel">${traitUI()}${section('나의 입사지원서 공작소','선택한 경험을 바탕으로 문장을 직접 완성하고, 워드파일로 내려받습니다.','편집 가능한 DOCX')}<div class="banner">실제 제출 전에는 기업 지정 서식을 우선하세요. 사진은 필요한 경우에만 사용합니다. 마음·관계 탐색 답변은 지원서에 자동으로 들어가지 않습니다.</div><div class="two"><div><label class="field"><span>성명</span><input id="name" placeholder="본인 이름"></label><label class="field"><span>연락처</span><input id="contact" placeholder="본인 연락처"></label><label class="field"><span>이메일</span><input id="email" placeholder="본인 이메일"></label><label class="field"><span>지원 직무</span><select id="jobSelect">${jobs.map(j=>`<option ${j.name===state.job?'selected':''}>${E(j.name)}</option>`).join('')}</select></label><label class="field"><span>실제 경력·활동 사항 (선택)</span><textarea id="history" placeholder="기관명·기간·업무는 본인이 확인한 사실만 작성"></textarea></label><label class="field"><span>교육 및 자격사항 (선택)</span><textarea id="education" placeholder="교육 이수 등 실제로 확인 가능한 정보"></textarea></label><label class="field"><span>자격증 (선택)</span><textarea id="cert" placeholder="실제로 취득한 자격만"></textarea></label><label class="field"><span>지원동기와 업무 연결 (선택)</span><textarea id="motivation" placeholder="어떤 이유로 관심이 생겼으며 실제로 기여할 수 있는 점은?"></textarea></label></div><div><div class="result"><b>자기소개서 문장 만드는 법</b><p class="muted">① 실제 상황 → ② 내가 한 행동 → ③ 확인 가능한 결과 → ④ 지원 업무와 연결</p><button class="btn light small" id="makeCover">선택한 경험으로 문장 틀 만들기</button><p class="notice">AI가 사실을 확인하거나 실제로 없던 경력·성과를 생성하지 않습니다. 직접 검수해 주세요.</p></div><label class="field"><span>자기소개서 문항 / 핵심 소개글 (직접 수정)</span><textarea id="cover" style="min-height:190px" placeholder="자신의 실제 경험을 작성해 주세요."></textarea></label><div class="row"><button class="btn" id="downloadDocx">워드(.docx) 다운로드</button><button class="btn outline" onclick="nav('interview')">면접 연습 →</button></div><p class="muted">내려받은 파일은 Microsoft Word 또는 DOCX 호환 편집기에서 열고 수정할 수 있습니다.</p></div></div></section><section class="panel">${section('입사지원서 미리보기','실제 지원할 때 필요한 항목만 남기고 수정하세요.')}<div id="resumePreview"></div></section>`,
interview:()=>`<section class="panel">${section('나의 면접연습실','지원 직무에 맞춰 질문을 한 번에 하나씩 연습합니다.','모의면접')}<div class="banner">정해진 질문과 체크 기준을 사용하는 교육용 연습입니다. 이 버전에는 자유 대화형 AI 면접관이나 음성 평가 기능은 없습니다.</div><div class="itabs">${interviewBase.map((q,i)=>`<button class="itab ${i===state.interviewIdx?'active':''}" data-itab="${i}"><small>질문 ${i+1} ${state.interview[i]?.answer?'✓':''}</small>${E(q[0])}</button>`).join('')}</div><div class="result"><span class="eyebrow">INTERVIEW ${state.interviewIdx+1} / ${interviewBase.length}</span><h3>${interviewBase[state.interviewIdx][1]}</h3><p class="muted">지원 직무: ${E(state.job)} · ${interviewBase[state.interviewIdx][0]}</p></div><div class="voice-tools"><button type="button" class="btn voice-start" id="voiceStart" aria-label="마이크로 면접 답변 시작">🎙 마이크로 답변하기</button><button type="button" class="btn outline" id="voiceStop" disabled>■ 말하기 중지</button><span class="voice-status" id="voiceStatus" aria-live="polite">마이크 버튼을 누르고 한국어로 답변해 보세요.</span></div><p class="muted">음성 인식은 브라우저 지원 및 마이크 권한이 필요합니다. 음성 데이터가 브라우저 제공사의 인식 서비스로 처리될 수 있으므로 개인정보는 말하지 마세요. 지원되지 않으면 아래 칸에 직접 입력할 수 있습니다.</p><label class="field"><span>나의 답변</span><textarea id="interviewAnswer" style="min-height:130px" placeholder="직접 해본 일을 바탕으로 답변을 입력하세요.">${E(state.interview[state.interviewIdx]?.answer||'')}</textarea></label><div class="row"><button class="btn" id="feedbackBtn">답변 점검하기</button><button class="btn outline" id="prevQ" ${state.interviewIdx===0?'disabled':''}>이전 질문</button><button class="btn outline" id="nextQ" ${state.interviewIdx===interviewBase.length-1?'disabled':''}>다음 질문</button></div><div id="feedbackArea" class="result">답변을 입력하면 질문 관련성, 구체적 사례, 확인할 사실, 수정 방법에 대한 점검 질문이 나타납니다.</div><label class="field"><span>수정해서 다시 답하기</span><textarea id="interviewRevised" placeholder="피드백을 참고해 다시 써보세요.">${E(state.interview[state.interviewIdx]?.revised||'')}</textarea></label><button class="btn light" onclick="nav('notes')">나의 면접 기록 확인하기 →</button></section>`,
notes:()=>`<section class="panel">${section('나의 직업 여권','탐험 과정에서 발견한 내용을 확인합니다.','나의 기록')}<div class="two"><div class="result"><h3>나의 선호와 관계 방식</h3>${selfResult()}</div><div class="result"><h3>나의 강점과 보완점</h3><p>${state.strengths.length?state.strengths.map(E).join(' · '):'아직 선택하지 않았습니다.'}</p><p class="muted">${state.improvements.map(a=>E(a)+' → '+E(guide[a])).join('<br>')}</p></div></div><div class="result"><h3>직업 탐색</h3><p>희망직종 3개 이내: <b>${state.preferredJobs.map(E).join(" · ")}</b></p><p>이번 지원서 직무: <b>${E(state.job)}</b></p><p class="muted">${E(state.jobpost||'공고 근거는 아직 입력되지 않았습니다.')}</p></div><div class="result"><h3>내가 직접 해본 경험</h3>${state.experiences.filter(Boolean).map((t,i)=>`<p>${i+1}. ${E(t)}</p>`).join('')||'<p class="muted">아직 작성된 경험이 없습니다.</p>'}</div><div class="result"><h3>면접 연습 기록</h3>${state.interview.map((a,i)=>a?.answer?`<p><b>${E(interviewBase[i][1])}</b><br>${E(a.answer)}${a.revised?`<br><em>수정: ${E(a.revised)}</em>`:''}</p>`:'').join('')||'<p class="muted">아직 답변이 없습니다.</p>'}</div><div class="row"><button class="btn" onclick="downloadNotes()">개인 학습노트(.txt) 저장</button><button class="btn outline" onclick="nav('resume')">입사지원서 수정하기</button><button class="btn outline" onclick="clearAll()">내 입력정보 지우기</button></div></section>`};
function selfResult(){return qs.map(q=>state.questions[q.id]?`<p><b>${E(q.title)}</b><br>${E(state.questions[q.id])}</p>`:'').join('')||'<p class="muted">나를 이해하기에서 질문을 선택하면 결과가 표시됩니다.</p>'}
function improvementText(){return state.improvements.map(k=>`<p><b>${E(k)}</b><br>${E(guide[k])}</p>`).join('')||'보완하고 싶은 부분을 선택하면 실천 방법이 표시됩니다.'}
function careerColor(t){return ({office:'#31765f',promotion:'#8662a8',cooking:'#d1773e',startup:'#c26d63',care:'#7771aa',digital:'#436ca1',industry:'#587785'}[t]||'#397964')}
function togglePreferred(name){let arr=state.preferredJobs;if(arr.includes(name)){if(arr.length===1){showToast('희망직종을 최소 1개 선택해 주세요.');return}state.preferredJobs=arr.filter(v=>v!==name);if(state.job===name)state.job=state.preferredJobs[0]}else{if(arr.length>=3){showToast('희망직종은 최대 3개까지 선택할 수 있습니다.');return}state.preferredJobs=[...arr,name]}jobCards($('#jobsearch')?.value||'')}
function setPrimaryJob(name){if(!state.preferredJobs.includes(name)){if(state.preferredJobs.length>=3){showToast('희망직종은 최대 3개입니다. 기존 직종을 제외한 후 지정해 주세요.');return}state.preferredJobs=[...state.preferredJobs,name]}state.job=name;jobCards($('#jobsearch')?.value||'')}
function jobCards(term=''){let sorted=[...jobs].sort((a,b)=>b.keywords.filter(k=>state.strengths.includes(k)).length-a.keywords.filter(k=>state.strengths.includes(k)).length);let found=sorted.filter(j=>(j.name+' '+j.group+' '+j.desc).includes(term));const selected=jobs.find(j=>j.name===state.job)||jobs[0];const th=themes[selected.theme]||['#eef5ef','#356754'];const banner=$('#job-theme');if(banner){banner.style.setProperty('--job-accent',th[1]);banner.style.setProperty('--job-tint',th[0]);banner.innerHTML='<strong>'+E(selected.group)+' · '+E(selected.name)+'</strong><br><span style="font-size:13px">'+E(selected.desc)+' · 실제 공고·자격조건을 확인해 주세요.</span>';}const pc=$('#preferredJobChips');if(pc)pc.innerHTML=state.preferredJobs.map(n=>`<span class="preference-pill">${E(n)} <button onclick="togglePreferred('${n}')" title="희망직종 제외">×</button></span>`).join('')+`<span class="muted">${state.preferredJobs.length}/3개 선택 · 지원서 직무: ${E(state.job)}</span>`;

function traitParagraphs(){
 const good=[...state.traitGood,state.traitCustomGood.trim()].filter(Boolean);
 const skill=[...state.traitSkills||[],state.traitCustomSkill.trim()].filter(Boolean);
 const likes=[...state.traitLikes,state.traitCustomLike.trim()].filter(Boolean);
 const weak=[...state.traitImprove,state.traitCustomWeak.trim()].filter(Boolean);
 const real=state.traitReal.trim(),task=careerTask(),job=state.job;
 const a=good.length?`저의 강점으로는 ${good.join(', ')} 등이 있습니다.`:'[나의 강점을 선택하거나 직접 입력]';
 const h=skill.length?` 제가 실제로 해볼 수 있다고 생각하는 일은 ${skill.join(', ')}입니다. 이 중 실제 수행한 일만 확인하여 기재하겠습니다.`:'';
 const l=likes.length?` 저는 ${likes.join(', ')}에 관심이 있으며, 그 관심을 직무 준비에 연결하고 싶습니다.`:'';
 const b=real?` 구체적인 경험으로는 ${real} 이러한 경험을 바탕으로 ${job} 직무의 ${task}에 기여할 방법을 생각해 보겠습니다.`:` [나의 실제 경험과 행동을 추가하세요.] ${job} 직무의 ${task}과 연결할 수 있는지 채용공고와 비교해 보겠습니다.`;
 const c=weak.length?`제가 보완하려는 부분은 ${weak.join(', ')}입니다. 이를 개선하기 위해 [실제로 수행한 연습·개선 행동을 적으세요].`:'[보완할 점을 선택하거나 직접 입력]';
 return {good:[a,h,l,b].filter(Boolean).join(' '),improve:c};
}

function bindTraits(){

 select('data-trait-good',traitStrengthExamples,'traitGood',3,'강점');select('data-trait-skill',traitSkillExamples,'traitSkills',3,'잘하는 일');select('data-trait-like',traitLikeExamples,'traitLikes',3,'좋아하는 활동');select('data-trait-weak',traitImproveExamples,'traitImprove',2,'보완점');
 for(const key of ['traitReal','traitCustomGood','traitCustomSkill','traitCustomLike','traitCustomWeak']){let el=document.getElementById(key);if(el)el.addEventListener('input',e=>{state[key]=e.target.value;updateTraitOutput()})}
 document.getElementById('resetTrait')?.addEventListener('click',()=>{for(let k of ['traitGood','traitSkills','traitLikes','traitImprove'])state[k]=[];for(let k of ['traitReal','traitCustomGood','traitCustomSkill','traitCustomLike','traitCustomWeak'])state[k]='';render()});

}

   setStatus(messages[ev.error]||'음성 인식 오류가 발생했습니다. 글로 답변하거나 다시 시도해 주세요.',true);endUI();if(voiceRecognizer===rec)voiceRecognizer=null;
  };

   if(voiceRecognizer===rec)voiceRecognizer=null;

DD('간호조무사','긴장한 환자에게\n제일 먼저 웃어 주는 사람','간호조무사는 진료를 돕고 환자를 안내하며 혈압·체온을 재고 기록해요. 보건업 일자리가 늘어날 전망이라 병원·요양시설·보건소 등 일할 곳이 다양해요.','주사만 놓는 사람?','진료 준비부터 환자 안내, 기록, 감염 관리까지 병원이 매끄럽게 돌아가게 하는 손발이에요.','동네 의원, 병원, 요양병원, 보건소, 요양시설','주간 근무 의원부터 교대 근무 병원까지 다양해요','간호조무사 국가자격: 지정 교육기관 이론·실습 과정을 마치고 국가시험에 합격해야 해요 (교육 기간은 기관에 확인)','가족 병원 동행 경험을 떠올려 보고, 보건소·요양시설 자원봉사로 의료 현장 분위기를 미리 느껴 보세요','고용24, 지역 의원 구인 게시판, 간호조무사 협회 구인란을 살펴요',[['🩺','동네 어디에나 있는 일터','의원·병원·요양시설·보건소까지, 집 가까운 곳에서 일할 기회가 많아요.'],['😊','환자의 불안을 덜어 주는 보람','"따끔해요~" 한마디로 긴장을 풀어 주는 순간, 고맙다는 말을 자주 들어요.'],['📈','10년 뒤 더 필요한 일','보건업 일자리가 늘어날 전망이고, 자격으로 경력이 쭉 이어져요.']]);
DD('사회복지사','도움이 필요한 이웃과\n세상을 이어 주는 사람','사회복지사는 도움이 필요한 이웃을 찾아 상담하고 복지 서비스와 연결해요. 고령화·돌봄 수요로 사회복지업 일자리가 늘어날 전망이에요.','봉사하는 착한 사람?','법과 제도를 알고 상담·기록·연계를 하는 전문 직업이에요.','종합사회복지관, 노인·장애인 복지관, 지역아동센터, 가족센터, 행정복지센터','주간 근무가 많고, 시설에 따라 교대 근무도 있어요','사회복지사 자격: 학점은행제·사이버대 등에서 관련 과목과 현장실습을 이수해 취득해요 (1급은 국가시험)','동네 복지관 프로그램 자원봉사로 현장을 경험하고, 주변 복지 제도를 하나씩 정리해 보세요','고용24, 한국사회복지사협회 구인 게시판, 지역 복지관 홈페이지를 확인해요',[['🤝','사람을 잇는 보람','혼자 힘들던 이웃이 서비스를 만나 웃게 되는 순간을 함께해요.'],['🏢','일할 곳이 다양해요','복지관·센터·기관·행정복지센터까지 분야를 골라 갈 수 있어요.'],['📈','10년 뒤 더 필요한 일','고령화와 돌봄 수요로 사회복지 일자리가 늘어날 전망이에요.']]);
DD('장애인 활동지원사','혼자서도 할 수 있도록\n곁에서 함께 걷는 사람','장애인 활동지원사는 이용자의 외출·식사·학업·직장 생활을 옆에서 도와 자립을 응원해요. 대신 해 주기보다 스스로 할 수 있게 돕는 게 핵심이에요.','대신 다 해 주는 사람?','이용자가 원하는 생활을 스스로 해낼 수 있게 옆에서 돕는 파트너예요.','장애인 활동지원기관에 소속되어 이용자 집·학교·직장 등에서 활동','시간제 근무가 많고, 이용자와 시간을 맞춰 일해요','활동지원사 교육기관에서 정해진 교육(이론·실습)을 이수하면 활동할 수 있어요 (교육 시간은 기관에 확인)','장애인 복지관 자원봉사로 이동 보조·소통 방법을 먼저 배워 보세요','지역 장애인 활동지원기관 모집 공고와 고용24를 확인해요',[['🌈','자립을 응원하는 일','이용자가 "오늘은 혼자 해냈어요!" 할 때 함께 웃게 돼요.'],['⏰','시간을 나눠 일하기 좋아요','시간제 근무가 많아 생활에 맞춰 조절하기 쉬워요.'],['🎓','교육으로 시작할 수 있어요','정해진 교육을 마치면 바로 활동을 시작할 수 있어요.']]);
DD('방과후 돌봄교사','오후 3시,\n아이들의 두 번째 집','방과후 돌봄교사는 학교가 끝난 아이들의 숙제·놀이·간식을 챙기고 안전하게 보호자에게 인계해요. 돌봄 정책은 넓어지지만 지역마다 상황이 달라요.','아이들이랑 놀아 주기만 하면 되는 일?','안전 관리, 숙제 지도, 놀이 기획, 보호자 소통까지 챙기는 돌봄 전문가예요.','초등학교 돌봄교실, 지역아동센터, 다함께돌봄센터','오후 시간대 근무가 많아요','기관마다 보육교사·교원·사회복지사 등 자격을 요구하는 경우가 많아요. 공고의 자격 조건을 꼭 확인해요','도서관·지역아동센터 봉사로 아이들과 활동해 보고, 놀이 수업 아이디어를 모아 보세요','고용24, 교육청·학교 홈페이지 채용 게시판, 지역아동센터 공고를 확인해요',[['🎒','오후 시간 근무','오전은 내 시간으로 쓰고 오후에 일하는 곳이 많아요.'],['🧒','육아 경험이 힘이 돼요','아이를 키워 본 경험이 그대로 강점이 돼요.'],['🎨','놀이로 가르치는 즐거움','종이접기·보드게임·코딩 놀이로 아이들과 함께 커요.']]);
DD('산후관리사','엄마와 아기의\n첫 한 달 지킴이','산후관리사는 출산 가정에 방문해 산모 회복과 신생아 목욕·수유를 돕고 집안일을 챙겨요. 정부 지원 사업과 연결되어 일하는 경우가 많아요.','집안일 도우미?','신생아 돌봄과 산모 회복을 돕는 전문 돌봄 인력이에요.','산모·신생아 건강관리 제공기관에 소속되어 출산 가정 방문','출산 일정에 따라 2~4주 단위로 일해요','제공기관의 산모·신생아 건강관리사 교육을 이수해요 (교육 시간·비용은 기관에 확인)','내 육아 경험을 정리하고, 신생아 위생·목욕 교육 영상을 보며 기본을 익혀 보세요','지역 산모·신생아 건강관리 제공기관 모집 공고와 고용24를 확인해요',[['👶','아기를 사랑하는 마음이 곧 실력','육아 경험이 가장 큰 무기가 돼요.'],['🏠','가정 방문형 일','가까운 동네 가정에서 일할 수 있어요.'],['🙏','고마움을 가장 많이 듣는 일','"선생님 덕분에 버텼어요"라는 인사를 자주 받아요.']]);
DD('실버 운동지도사','어르신 근육을 지키는\n신나는 구령','실버 운동지도사는 복지관·경로당에서 어르신 맞춤 체조와 근력 운동을 지도하고 낙상을 예방해요. 공식 자격으로는 노인스포츠지도사가 있어요.','노래에 맞춰 체조만 하는 사람?','어르신 몸 상태를 살펴 안전하게 근력·균형 운동을 설계하는 건강 지킴이예요.','노인복지관, 경로당, 주간보호센터, 생활체육 프로그램','시간제 수업이 많아요','노인스포츠지도사(국가자격) 등 관련 자격이 있으면 유리해요. 공고의 자격 조건을 확인해요','동네 걷기 모임이나 경로당 체조 봉사로 어르신 눈높이 수업을 연습해 보세요','고용24, 지자체 생활체육 강사 모집, 복지관 강사 공고를 확인해요',[['💪','내 건강도 함께 챙겨요','가르치다 보면 나도 매일 운동하게 돼요.'],['🎵','분위기 메이커가 빛나요','흥이 많은 성격이 곧 수업의 힘이에요.'],['👵','고령화로 커지는 분야','어르신 건강 프로그램 수요가 늘고 있어요.']]);
DD('치매예방 인지활동 강사','놀이로 지키는\n어르신의 기억력','치매예방 인지활동 강사는 퍼즐·회상·미술·노래 활동으로 어르신의 기억력과 인지 기능을 즐겁게 자극해요.','어르신이랑 놀아 드리는 사람?','인지 자극 목표에 맞게 활동을 설계하고 변화를 기록하는 강사예요.','치매안심센터, 노인복지관, 주간보호센터, 요양원','시간제 수업이 많아요','민간자격 과정이 많아요. 기관이 인정하는 자격인지 공고에서 확인해요','부모님과 옛날 사진 보며 이야기하기, 숫자 화투 놀이처럼 집에서 먼저 해 보세요','치매안심센터·복지관 강사 모집 공고, 고용24를 확인해요',[['🧩','놀이가 곧 수업','살림·육아 때 하던 놀이 아이디어가 교구가 돼요.'],['😄','웃음이 많은 교실','"이거 기억나!" 하는 순간 교실 전체가 웃어요.'],['👵','고령화로 수요 증가','치매 예방 프로그램을 운영하는 기관이 늘고 있어요.']]);
DD('의료 코디네이터','병원에서 길 잃지 않게\n안내하는 내비게이션','의료 코디네이터는 진료 예약·상담·수납·검사 안내를 맡아 환자가 헤매지 않게 처음부터 끝까지 도와요.','접수만 하는 사람?','환자 동선 전체를 챙기고, 진료 일정·비용·주의사항을 쉽게 설명하는 안내 전문가예요.','병원·치과·피부과·검진센터·한의원','주간 근무가 많고 토요일 근무가 있는 곳도 있어요','필수 자격보다 서비스·의료 용어 교육 이수가 도움이 돼요. 민간자격도 있으니 공고를 확인해요','병원에서 불편했던 점을 메모하고, 기초 의료 용어를 하루 5개씩 익혀 보세요','고용24, 병원 채용 게시판, 의료 전문 구인 사이트를 확인해요',[['🧭','서비스 경력이 그대로 살아나요','매장·상담 경험이 큰 강점이 돼요.'],['🏥','병원 규모별로 일자리가 다양','동네 의원부터 큰 병원까지 선택지가 넓어요.'],['💬','설명 잘하는 사람이 빛나요','복잡한 안내를 쉽게 풀어 주는 능력이 핵심이에요.']]);
DD('반려동물 돌봄 전문가','댕냥이들의\n든든한 이모·고모','반려동물 돌봄 전문가는 보호자 대신 산책·밥·놀이를 챙기고 사진과 함께 돌봄 일지를 보내요. 반려 가구가 늘며 커지는 분야예요.','강아지랑 놀기만 하면 되는 일?','동물 행동을 이해하고 안전 사고를 예방하며 보호자와 신뢰를 쌓는 서비스예요.','펫시터 플랫폼, 반려동물 호텔·유치원, 개인 돌봄 서비스','원하는 시간대를 골라 일하는 경우가 많아요','반려동물관리사 등 민간·국가 자격이 있어요. 플랫폼마다 요구 조건이 다르니 확인해요','지인 반려동물 산책 돕기, 유기동물 보호소 봉사로 경험을 쌓아 보세요','펫시터 플랫폼 등록, 반려동물 유치원·호텔 채용 공고를 확인해요',[['🐶','좋아하는 일이 직업','동물을 사랑하는 마음이 곧 실력이에요.'],['🕒','시간을 골라 일해요','플랫폼에서 원하는 시간에 예약을 받을 수 있어요.'],['📸','사진 일지로 신뢰 쌓기','돌봄 사진과 기록이 단골을 만들어요.']]);
/* 음식·농업 */
DD('단체급식 조리사','수백 명의 한 끼를\n책임지는 큰 손','단체급식 조리사는 학교·요양원·회사 식당에서 식단표에 맞춰 대량 조리를 하고 위생 기준을 지켜 배식해요.','요리만 잘하면 되는 일?','대량 조리, 위생·알레르기 관리, 정해진 시간 배식까지 챙기는 급식 전문가예요.','학교 급식실, 요양원, 병원, 기업·공공기관 구내식당','주간 근무가 많고 주말이 쉬운 곳이 많아요','한식조리기능사 등 조리 자격이 있으면 유리하고, 학교 급식은 기관별 채용 조건을 확인해요','집에서 10인분 이상 요리할 때 순서와 시간을 기록해 보고, 위생교육을 들어 보세요','고용24, 교육청 교육공무직 채용, 급식 위탁업체 공고를 확인해요',[['🍚','주간 근무·주말 휴무','저녁·주말이 비는 곳이 많아 생활 리듬이 안정적이에요.'],['👩‍🍳','살림 요리 실력이 그대로','가족 식사를 챙기던 손맛이 경력이 돼요.'],['🏫','꾸준한 수요','학교·요양원·회사 급식은 늘 필요해요.']]);
DD('식품 위생관리자','음식 안전을 지키는\n공장 속 위생 탐정','식품 위생관리자는 식품 공장·급식소의 온도·청결·원료를 점검하고 기록해 안전한 음식을 지켜요.','청소 검사만 하는 사람?','위생 기준(HACCP)에 맞춰 공정을 점검하고 문제를 미리 막는 품질 지킴이예요.','식품 제조 공장, 급식업체, 프랜차이즈 센트럴키친','주간 근무 위주, 생산 일정에 따라 달라요','HACCP 교육 이수가 기본이고, 식품 관련 자격이 있으면 유리해요','집 냉장고 온도·유통기한 점검표를 1주일 써 보며 기록 습관을 들여 보세요','고용24, 식품기업 채용 사이트에서 "품질관리·위생"으로 검색해요',[['📋','기록 좋아하는 사람이 빛나요','체크리스트를 꼼꼼히 채우는 습관이 곧 실력이에요.'],['🏭','식품 업계 어디서나 필요','식품 가공 일자리가 늘어나는 흐름이에요.'],['🎓','교육으로 전문성이 쌓여요','위생 교육과 자격으로 경력을 키울 수 있어요.']]);
DD('밀키트·도시락 개발자','냉장고 속 셰프,\n15분 완성 레시피 장인','밀키트·도시락 개발자는 집에서 쉽게 만드는 메뉴를 만들고 레시피와 원가를 표준화해 상품으로 만들어요.','요리만 하는 사람?','맛, 조리 시간, 원가, 포장, 표시 기준까지 설계하는 상품 기획자예요.','밀키트·도시락 업체, 식품 제조사, 반찬 브랜드, 창업','회사 소속 또는 창업·소규모 운영','조리 자격과 식품 표시 기준 교육이 도움이 돼요. 창업 시 식품 제조 영업 신고가 필요해요','우리 집 인기 메뉴 3개를 재료·g·시간까지 적어 표준 레시피로 만들어 보세요','식품 회사 "상품기획·메뉴개발" 공고, 지역 창업 지원 사업을 확인해요',[['🥘','살림 요리가 상품이 돼요','"이거 진짜 맛있다"는 메뉴가 판매 상품이 될 수 있어요.'],['🛒','온라인 판매로 확장','택배·배달 간편식 시장이 커지고 있어요.'],['🧮','숫자 감각이 무기','g·원가·시간을 맞추는 꼼꼼함이 빛나요.']]);
DD('디저트 공방 창업가','동네의 달콤함을 책임지는\n작은 가게 사장님','디저트 공방 창업가는 수제 디저트를 만들어 온라인·예약 주문으로 팔고 원데이 클래스도 열어요.','가게만 열면 손님이 오는 일?','제조·사진·홍보·원가·예약 관리까지 혼자 해내는 작은 브랜드예요.','내 공방, 공유 주방, 온라인 스토어','예약 주문 중심이면 시간 조절이 가능해요','제과·제빵기능사 자격이 있으면 좋고, 창업 시 영업 신고·위생교육이 필요해요','지인 주문 10건을 받아 보고, 사진 찍기·원가 계산 연습을 해 보세요','소상공인 창업 지원, 공유 주방 입점, 스마트스토어 개설을 알아봐요',[['🧁','내 이름의 브랜드','좋아하는 디저트로 나만의 가게를 만들어요.'],['📸','사진 잘 찍는 분이 유리','예쁜 사진 한 장이 주문으로 이어져요.'],['👩‍🏫','클래스로 수입 다양화','원데이 클래스로 가르치는 일도 할 수 있어요.']]);
DD('건강 반찬가게 창업가','우리 동네\n엄마 손맛 반찬가게','건강 반찬가게 창업가는 저염·건강 반찬을 만들어 매장·배달앱·정기 구독으로 판매해요.','반찬만 잘 만들면 되는 일?','메뉴 회전, 재고, 배달 수수료, 단골 관리까지 하는 동네 사장님이에요.','동네 반찬가게, 배달 전문점, 공유 주방','새벽 준비와 오후 판매가 많아요','위생교육과 영업 신고가 필요하고, 조리 자격이 있으면 신뢰를 얻어요','요일별 반찬 메뉴표를 만들어 지인에게 한 달 판매해 보세요','소상공인 창업 교육, 배달앱 입점, 지역 상권 정보를 확인해요',[['🥬','살림 경력이 그대로 강점','매일 하던 반찬 솜씨가 사업이 돼요.'],['🔁','단골이 생기면 꾸준해요','매주 사는 손님이 생기면 매출이 안정돼요.'],['📦','구독 판매로 확장','정기 배송으로 미리 주문을 받을 수 있어요.']]);
DD('푸드 스타일리스트','음식에 옷을 입혀\n사진 한 장으로 침샘 자극','푸드 스타일리스트는 메뉴판·광고·SNS에 쓸 음식을 예쁘게 담고 꾸며 사진·영상으로 촬영해요.','예쁘게 담기만 하는 사람?','그릇·색·조명·구도까지 기획해 음식이 가장 맛있어 보이게 만드는 연출가예요.','식품 회사, 광고·촬영 스튜디오, 프리랜서, 식당 메뉴 촬영','프로젝트 단위 프리랜서가 많아요','필수 자격보다 포트폴리오가 중요해요. 관련 교육 과정이 있어요','집밥을 매일 한 장씩 스타일링해 사진으로 기록해 포트폴리오를 만들어 보세요','식품·외식 브랜드 공고, 스튜디오 어시스턴트 모집, SNS 포트폴리오로 직접 제안해요',[['🍽️','살림 감각이 작품','그릇 고르고 담는 감각이 실력이 돼요.'],['📱','휴대폰으로 시작','스마트폰 사진만으로도 포트폴리오를 만들 수 있어요.'],['🧑‍🎨','프리랜서로 자유롭게','프로젝트를 골라 일할 수 있어요.']]);
DD('로컬푸드 가공 창업가','우리 동네 농산물에\n이름을 붙이는 사람','로컬푸드 가공 창업가는 지역 농산물로 잼·장아찌·청을 만들어 포장하고 직거래 장터와 온라인에서 팔아요.','시골 장사?','농가와 손잡고 상품 이름·포장·판매까지 만드는 지역 브랜드 기획자예요.','농가 협업, 공유 가공센터, 로컬푸드 직매장, 온라인 스토어','계절과 수확 시기에 따라 바빠지는 때가 달라요','식품 제조 허가·위생교육이 필요해요. 지역 농업기술센터 가공 교육을 활용해요','동네 직매장을 둘러보고 잘 팔리는 상품 이름·포장을 조사해 보세요','지역 농업기술센터 창업 교육, 로컬푸드 직매장 입점, 6차 산업 지원 사업을 알아봐요',[['🌾','지역 지원 사업이 많아요','농산물 가공 창업을 돕는 교육·지원이 있어요.'],['🫙','작게 시작할 수 있어요','공유 가공센터로 설비 부담을 줄여요.'],['🏷️','이야기가 곧 브랜드','"우리 동네 매실"이라는 이야기가 상품의 힘이에요.']]);
DD('스마트팜 운영자','휴대폰으로 상추 안부를\n묻는 농부','스마트팜 운영자는 온도·습도·빛을 센서와 앱으로 조절해 실내에서 채소를 기르고 출하해요. 농업은 크게 늘어날 일자리로 꼽혀요.','흙 묻히는 농사?','데이터를 보며 작물 환경을 조절하는 첨단 농업이에요.','스마트팜 농장, 도시형 수직농장, 귀농 창업','작물 관리 일정에 따라 매일 확인이 필요해요','농업기술센터·스마트팜 혁신밸리 교육 과정을 활용해요 (과정·대상은 기관에 확인)','베란다 수경재배 키트로 작물 기록을 30일 해 보세요','스마트팜 기업 채용, 청년·귀농 창업 지원, 농업 교육기관 공지를 확인해요',[['🌱','날씨 걱정이 적은 농사','실내에서 일정하게 키울 수 있어요.'],['📲','앱으로 관리','휴대폰으로 상태를 확인하고 조절해요.'],['📈','농업 일자리 증가 흐름','세계적으로 농업 일자리가 크게 늘어날 직군으로 꼽혀요.']]);
/* 디지털·AI */
DD('숏폼 콘텐츠 크리에이터','15초 안에\n마음을 훔치는 이야기꾼','숏폼 크리에이터는 가게·기관·내 이야기를 15~60초 영상과 카드뉴스로 기획하고 만들어요.','춤추는 영상 찍는 사람?','기획·촬영·편집·자막·업로드 분석까지 하는 콘텐츠 제작자예요.','개인 채널, 소상공인·기관 홍보 대행, 마케팅 회사','재택·프리랜서가 많아요','필수 자격은 없어요. 영상 편집·저작권 교육을 들으면 좋아요','우리 동네 가게 하나를 15초 영상으로 소개해 SNS에 올려 보세요','지역 소상공인 홍보 대행 제안, 마케팅 회사 "콘텐츠 제작" 공고를 확인해요',[['📱','휴대폰 하나로 시작','장비 없이 오늘 바로 시작할 수 있어요.'],['🏠','집에서도 일해요','재택 프리랜서로 일하기 좋아요.'],['🤖','AI가 든든한 조수','자막·이미지·대본을 AI와 함께 만들어요.']]);
DD('라이브커머스 셀러','화면 너머로\n물건 매력을 전하는 쇼호스트','라이브커머스 셀러는 휴대폰 생방송으로 상품을 소개하고 실시간 질문에 답하며 주문을 받아요.','말만 잘하면 되는 일?','상품 공부, 방송 대본, 실시간 소통, 주문·후기 관리까지 하는 판매 전문가예요.','라이브커머스 플랫폼, 브랜드·소상공인 방송 대행, 개인 판매','방송 일정에 맞춰 일해요','필수 자격은 없어요. 쇼호스트·라이브커머스 교육 과정이 있어요','집에 있는 물건 하나로 3분 소개 영상을 찍어 말하기 연습을 해 보세요','플랫폼 셀러 등록, 브랜드 라이브 진행자 모집, 지역 소상공인 지원 사업을 확인해요',[['🎤','말솜씨가 곧 경쟁력','장점을 쉽게 설명하는 능력이 매출이 돼요.'],['🏪','매장 없이 판매','휴대폰 하나로 가게를 열 수 있어요.'],['📈','온라인 판매 확대','온라인화로 판매 방식이 빠르게 바뀌고 있어요.']]);
DD('온라인 쇼핑몰 운영자','택배 테이프 소리가\nBGM인 랜선 사장님','온라인 쇼핑몰 운영자는 상품 등록·주문·배송·고객 문의·정산까지 온라인 가게를 운영해요.','사진 올리면 끝?','상세페이지, 광고, 재고, 고객 응대, 정산까지 챙기는 1인 사업가예요.','스마트스토어 등 오픈마켓, 자사몰, 쇼핑몰 회사 운영팀','재택 운영이 가능하고 주문량에 따라 바빠요','필수 자격은 없어요. 플랫폼 무료 판매자 교육을 활용해요','집에 있는 물건으로 상세페이지 한 장을 AI와 함께 만들어 보세요','오픈마켓 판매자 교육, 쇼핑몰 "MD·운영" 공고, 소상공인 온라인 진출 지원을 확인해요',[['🏠','집에서 시작','작은 상품 하나로 가게를 열 수 있어요.'],['🤖','AI로 빠르게','상세페이지 문구·이미지를 AI로 빠르게 만들어요.'],['📈','온라인 판매 확대','온라인화로 계속 커지는 시장이에요.']]);
DD('SNS 마케터','동네 가게에\n단골을 만들어 주는 사람','SNS 마케터는 가게·기관의 계정을 운영하고 글·사진·이벤트로 손님을 모아요.','사진만 올리는 사람?','누구에게 무엇을 언제 보여 줄지 기획하고 반응을 분석하는 마케터예요.','소상공인·기관 계정 운영, 마케팅 대행사, 사내 홍보팀','재택·프리랜서 가능','필수 자격은 없어요. SNS 마케팅·디자인 도구 교육이 도움이 돼요','내 계정 하나를 정해 2주 동안 매일 게시물을 올리고 반응을 기록해 보세요','마케팅 대행사·기관 홍보 공고, 동네 가게에 직접 운영 제안해요',[['💬','트렌드 감각이 무기','요즘 뜨는 걸 잘 아는 분이 유리해요.'],['🏠','재택 프리랜서','여러 가게 계정을 맡아 일할 수 있어요.'],['🧪','실험하는 재미','어떤 글이 반응이 좋은지 매번 확인하는 재미가 있어요.']]);
DD('AI 활용 사무원','AI 비서를 거느린\n사무실의 팀장님','AI 활용 사무원은 AI로 문서 초안을 만들고 숫자와 사실을 확인해 보고서·안내문을 완성해요. 단순 입력은 줄고, 확인·정리하는 사무로 바뀌는 중이에요.','AI가 다 해 주니 쉬운 일?','AI 초안을 사람이 검토하고 책임지는 일이라 꼼꼼함이 더 중요해졌어요.','회사·기관 사무직 어디나 (공고에서는 "사무원·사무보조"로 검색)','주간 사무 근무','컴퓨터활용능력·ITQ 등 자격이 도움이 되고, AI 활용 교육을 함께 들으면 좋아요','이 앱 입사지원서 단계에서 AI 거짓말 탐정을 해 보고, 6하원칙 지시문으로 공문 초안을 만들어 보세요','고용24에서 "사무원·사무보조·행정"으로 검색해요',[['🤖','AI로 일이 빨라져요','초안은 AI가, 확인은 내가. 업무 시간이 확 줄어요.'],['🏢','어디에나 필요한 일','모든 회사와 기관에 사무가 있어요.'],['🔍','꼼꼼함이 경쟁력','AI 실수를 잡는 사람이 더 귀해져요.']]);
DD('AI 프롬프트 디자이너','AI에게 일 잘 시키는\n지시의 달인','프롬프트 디자이너는 업무에 맞는 AI 지시문을 만들고 결과를 시험해 템플릿으로 정리해요. 공고에서는 "프롬프트 엔지니어"로도 불려요.','AI한테 말 거는 게 직업?','원하는 결과가 나올 때까지 지시를 설계·실험·정리하는 AI 활용 전문가예요.','AI 서비스 회사, 기업 디지털 전환팀, 교육·콘텐츠 회사, 프리랜서','재택·프로젝트 단위가 많아요','필수 자격은 없어요. 생성형 AI 교육과 결과물 포트폴리오가 중요해요','내 업무 하나를 정해 지시문 3가지를 비교해 보고, 가장 좋은 것을 템플릿으로 저장해 보세요','고용24·채용 사이트에서 "프롬프트·AI 활용"으로 검색해요',[['🪄','코딩 없이 시작','말을 정확하게 정리하는 능력이 핵심이에요.'],['🌐','모든 업종에서 필요','AI를 쓰는 곳이면 어디든 필요해져요.'],['🚀','가장 빠르게 크는 분야','AI 관련 직무가 가장 빠르게 늘어날 것으로 꼽혀요.']]);
DD('데이터 라벨러','고양이 사진에 이름표 붙여\nAI를 가르치는 선생님','데이터 라벨러는 사진·글·음성에 이름표를 붙여 AI가 배울 자료를 만들어요.','단순 클릭 알바?','정해진 기준을 정확히 지켜 AI의 품질을 좌우하는 데이터 작업자예요.','데이터 가공 회사, 크라우드소싱 플랫폼, 공공 데이터 사업','재택 작업이 많아요','필수 자격은 없어요. 데이터 라벨링 교육 과정이 있어요','크라우드소싱 플랫폼에서 연습 작업을 해 보고 기준서 읽는 연습을 해 보세요','데이터 라벨링 플랫폼 가입, 공공 데이터 사업 참여자 모집을 확인해요',[['🏠','재택으로 가능','집에서 시간을 나눠 일할 수 있어요.'],['🧘','차분한 집중형','조용히 집중하는 걸 좋아하는 분께 맞아요.'],['🤖','AI를 키우는 일','내가 붙인 이름표로 AI가 똑똑해져요.']]);
DD('디지털 튜터','키오스크 앞에서\n"여기를 톡!" 알려 주는 사람','디지털 튜터는 어르신·주민에게 키오스크·스마트폰·AI 앱 쓰는 법을 쉬운 말로 알려 드려요.','기계 잘 다루는 사람?','어려운 기술을 상대 눈높이로 풀어 주는 디지털 선생님이에요.','주민센터, 복지관, 도서관, 디지털 배움터 사업','시간제 수업이 많아요','필수 자격보다 디지털 활용 능력과 강의 경험이 중요해요. 지자체 강사 양성 과정이 있어요','가족에게 키오스크 주문을 처음부터 끝까지 알려 드리며 설명 연습을 해 보세요','지자체 디지털 배움터 강사 모집, 복지관·도서관 강사 공고를 확인해요',[['📱','설명 잘하는 분이 빛나요','같은 질문에도 웃으며 답하는 친절함이 실력이에요.'],['🏫','수업 기회가 많아요','주민센터·복지관·도서관에서 수업이 열려요.'],['📚','가르치며 계속 배워요','새 앱을 알려 주다 보면 나도 최신 기술에 강해져요.']]);
DD('UX 테스터','"이거 불편해요"를\n가장 잘 찾는 사람','UX 테스터는 앱·웹사이트를 직접 써 보며 불편한 점을 찾아 기록하고 개선점을 제안해요.','앱 써 보기만 하는 일?','사용자 입장에서 문제를 찾아 근거와 함께 보고하는 품질 전문가예요.','IT 회사, 사용성 테스트 플랫폼, 공공기관 웹 접근성 점검','프로젝트 단위·재택 테스트가 많아요','필수 자격은 없어요. 사용성·웹 접근성 교육이 도움이 돼요','자주 쓰는 앱 하나의 불편한 점 5가지를 화면 캡처와 함께 정리해 보세요','사용성 테스트 플랫폼 가입, IT 회사 "QA·테스터" 공고를 확인해요',[['🧐','사용자 눈높이가 전문성','처음 쓰는 사람의 눈이 가장 정확해요.'],['🏠','재택 테스트도 있어요','집에서 참여하는 테스트가 많아요.'],['🚀','성장하는 분야','UI·UX 직무가 빠르게 늘어날 것으로 꼽혀요.']]);
DD('정보보안 관리 보조','회사 정보를 지키는\n든든한 문지기','정보보안 관리 보조는 개인정보 처리 기록을 점검하고 비밀번호·접근 권한·보안 교육을 챙겨요.','컴퓨터 천재만 하는 일?','규칙을 지키게 하고 작은 이상을 놓치지 않는 관리 업무가 많아요.','회사·기관 정보보안팀, 개인정보 보호 담당 부서','주간 근무','개인정보 보호 교육, 정보보안 관련 자격(입문)이 도움이 돼요','우리 집 비밀번호·계정 정리표를 만들고, 피싱 문자 구별 퀴즈를 풀어 보세요','고용24에서 "개인정보·정보보안 담당"으로 검색해요',[['🛡️','모든 기관에 필요','개인정보를 다루는 곳이면 어디든 필요해요.'],['🔎','꼼꼼한 분이 빛나요','작은 이상을 먼저 알아채는 눈이 실력이에요.'],['🚀','빠르게 크는 분야','보안 관리 직무가 빠르게 늘어날 것으로 꼽혀요.']]);
DD('데이터 분석 보조','숫자 속에 숨은\n이야기를 찾는 사람','데이터 분석 보조는 엑셀·구글시트로 자료를 정리하고 그래프를 만들어 무엇이 달라졌는지 보고해요.','계산기 두드리는 사람?','숫자를 보고 "그래서 무엇을 하면 좋을지"까지 말해 주는 분석가예요.','회사 기획·마케팅팀, 공공기관, 연구소 (공고에서는 "데이터 분석·사무")','주간 사무 근무','컴퓨터활용능력, 데이터 분석 입문 교육이 도움이 돼요','가계부를 구글시트로 만들고 월별 그래프를 그려 보세요','고용24에서 "데이터 분석·통계 보조"로 검색해요',[['📊','어디서나 필요','모든 분야가 데이터로 결정해요.'],['🤖','AI 덕분에 배우기 쉬워요','분석 도구에 말로 물어볼 수 있어요.'],['🚀','빠르게 크는 직무','데이터 분석가가 빠르게 늘어날 것으로 꼽혀요.']]);
DD('노코드 웹 제작자','코딩 없이 블록 쌓듯\n홈페이지를 뚝딱','노코드 웹 제작자는 끌어다 놓는 도구로 가게·기관 홈페이지와 신청 페이지를 만들어요.','개발자만 하는 일?','디자인 감각과 차근차근 따라 하는 꼼꼼함만 있으면 할 수 있어요.','프리랜서, 소상공인 홈페이지 제작, 기관 홍보팀','프로젝트 단위·재택','필수 자격은 없어요. 노코드 도구 무료 강의를 활용해요','내 이름으로 자기소개 한 페이지를 노코드 도구로 만들어 보세요','소상공인 홈페이지 제작 제안, 프리랜서 플랫폼에 포트폴리오 등록',[['🧱','코딩 없이 시작','끌어다 놓기만으로 사이트를 만들어요.'],['🏪','작은 가게 일감','동네 가게 홈페이지 수요가 있어요.'],['🤖','AI와 함께','문구·이미지를 AI로 빠르게 채워요.']]);
DD('AI 이미지 디자이너','말로 그림을 그리는\n새로운 디자이너','AI 이미지 디자이너는 AI 도구로 홍보물·상품 이미지·캐릭터를 만들고 저작권과 품질을 확인해요.','버튼만 누르면 되는 일?','원하는 장면을 말로 정확히 지시하고, 결과를 고르고 다듬는 연출가예요.','홍보·출판·쇼핑몰, 마케팅 대행, 프리랜서','프로젝트 단위·재택','필수 자격은 없어요. 이미지 생성 AI·디자인 도구·저작권 교육이 중요해요','한 주제로 AI 이미지 10장을 만들어 비교하고, 가장 좋은 지시문을 기록해 보세요','디자인·마케팅 공고, 프리랜서 플랫폼, 카드뉴스 제작 의뢰를 확인해요',[['🎨','그림 실력보다 표현력','장면을 말로 잘 설명하는 능력이 핵심이에요.'],['🖼️','쓰임이 많아요','홍보물·상품·책 삽화까지 쓰여요.'],['⚡','빠르게 결과물','아이디어를 바로 그림으로 볼 수 있어요.']]);
DD('1인 출판 작가','내 경험을\n한 권의 책으로','1인 출판 작가는 살림·육아·일 경험을 글로 정리해 전자책·종이책으로 내고 온라인에서 판매해요.','유명 작가만 책을 내나요?','누구나 자기 경험으로 책을 기획하고 출간할 수 있어요.','전자책 플랫폼, 소량 인쇄 출판, 개인 블로그·강의 연계','재택·자유 일정','필수 자격은 없어요. 전자책 제작·저작권 교육이 도움이 돼요','블로그에 내 노하우 10편을 연재해 목차를 만들어 보세요','전자책 플랫폼 작가 등록, 지역 출판 지원 사업을 확인해요',[['📖','내 경험이 상품','살림 노하우도 책이 돼요.'],['🎤','강의로 이어져요','책이 강의·상담 기회를 만들어요.'],['🤖','AI로 다듬기','문장 다듬기와 표지 초안을 AI와 함께 해요.']]);
DD('디지털 장의사','인터넷 속 흔적을\n깨끗하게 정리하는 사람','디지털 장의사는 의뢰인이 원하는 온라인 게시물·계정·기록을 찾아 정리하고 삭제를 도와요.','이름이 무서운 일?','개인정보와 명예를 지키도록 온라인 기록을 정리하는 서비스예요.','온라인 평판 관리 업체, 개인정보 보호 서비스','재택 가능','필수 자격보다 개인정보 보호법·삭제 요청 절차 이해가 중요해요','내 이름으로 검색해 보고 오래된 계정·게시물 정리 목록을 만들어 보세요','온라인 평판 관리 업체 채용 공고를 확인해요',[['🧹','깨끗하게 정리하는 보람','곤란한 기록이 사라질 때 의뢰인이 안심해요.'],['🏠','재택으로 가능','온라인으로 처리하는 일이 많아요.'],['🔐','개인정보 보호 수요','온라인 기록 관리 수요가 커지고 있어요.']]);

/* 생활·환경 */
DD('정리수납 전문가','옷장 문 열면 웃음 나게\n바꾸는 공간 마법사','정리수납 전문가는 집·사무실의 짐을 분류하고 수납을 바꿔 사는 사람에게 맞는 공간을 만들어요.','청소해 주는 사람?','생활 습관에 맞게 공간을 설계하고 유지 방법까지 알려 주는 컨설턴트예요.','정리수납 업체, 이사·인테리어 연계, 1인 창업','방문 일정 단위로 일해요','정리수납 관련 민간자격 과정이 있어요. 업체마다 요구가 달라요','우리 집 옷장 한 칸을 정리하고 전후 사진을 찍어 포트폴리오를 시작해 보세요','정리수납 업체 모집 공고, 이사 업체 협업, 지역 커뮤니티 홍보를 활용해요',[['🧺','살림 노하우가 전문성','정리 잘하던 습관이 그대로 실력이에요.'],['📸','전후 사진이 성과','바뀐 공간이 눈에 보여 보람이 커요.'],['🏠','1인 가구·이사 수요','생활 서비스 수요가 커지고 있어요.']]);
DD('업사이클 공방 창업가','버려진 것에게\n두 번째 인생을','업사이클 공방 창업가는 헌 옷·폐자재를 새 소품으로 만들어 팔고 환경 체험 수업을 열어요.','재활용 공예?','환경 가치에 디자인을 더해 상품과 교육으로 만드는 브랜드예요.','내 공방, 마을 공방, 환경 교육 프로그램, 온라인 스토어','작품 제작과 수업 일정에 맞춰 일해요','필수 자격은 없어요. 공예·환경교육 과정이 도움이 돼요','안 입는 청바지로 파우치 하나를 만들어 SNS에 올려 보세요','지역 사회적경제·환경 창업 지원, 플리마켓, 학교 체험 수업 제안을 활용해요',[['♻️','환경을 지키는 일','만들수록 지구가 가벼워져요.'],['👩‍🏫','체험 수업으로 확장','학교·도서관 환경 수업 기회가 있어요.'],['🌱','녹색 전환 흐름','환경 관련 기술이 중요해지는 시대예요.']]);
DD('물류센터 관리자','택배 상자들의\n길을 정해 주는 사람','물류센터 관리자는 입고·출고 일정을 짜고 재고를 시스템으로 관리하며 작업 안전을 챙겨요.','상자 나르는 일?','재고 데이터와 사람·장비를 함께 관리하는 운영 매니저예요.','물류센터, 택배사 허브, 쇼핑몰 풀필먼트 센터','시즌에 따라 야간·주말 근무가 있어요','물류관리사 등 자격이 있으면 유리하고, 지게차 등 장비 자격은 업무에 따라 필요해요','엑셀로 우리 집 물건 재고표를 만들어 입출고를 기록해 보세요','고용24에서 "물류관리·재고관리"로 검색해요',[['📦','꾸준한 수요','온라인 쇼핑과 함께 계속 필요해요.'],['📈','관리 경력이 쌓여요','현장을 알면 관리자로 성장할 수 있어요.'],['🧮','숫자 맞추는 뿌듯함','재고가 딱 맞는 날의 쾌감이 있어요.']]);
DD('배송 운영 매니저','동네 배송을\n제시간에 지휘하는 사람','배송 운영 매니저는 배송 경로를 짜고 기사 배정·고객 문의·배송 사고를 관리해요.','택배 기사?','현장 기사들이 잘 움직이도록 계획하고 문제를 해결하는 관리자예요.','택배·배송 대행사, 퀵·배달 플랫폼 운영팀, 물류 회사','명절·행사 시즌엔 바빠요','필수 자격보다 배송 관리 프로그램 활용 능력이 중요해요','동네 지도를 보고 효율적인 장보기 동선을 그려 보세요','고용24에서 "배송 관리·운영 관리"로 검색해요',[['🚚','늘어나는 배송 일자리','배송 일자리가 크게 늘어날 직군으로 꼽혀요.'],['🗺️','지도 보기 좋아하는 분','동선 짜는 재미가 있어요.'],['📞','상황 판단이 빠른 분','돌발 상황을 해결하는 순발력이 실력이에요.']]);
DD('재생에너지 사무원','햇빛과 바람을\n서류로 관리하는 사람','재생에너지 사무원은 태양광·풍력 회사에서 발전 기록, 인허가 서류, 고객 상담을 관리해요.','공학자만 일하는 곳?','사무 능력으로 성장 산업에 들어갈 수 있는 자리예요.','태양광·풍력 회사, 에너지 협동조합, 공공 에너지 기관','주간 사무 근무','필수 자격보다 사무 능력이 중요하고, 에너지 기초 교육이 도움이 돼요','우리 집 전기요금 고지서로 사용량 그래프를 만들어 보세요','고용24에서 "태양광·신재생에너지 사무"로 검색해요',[['☀️','성장 산업','재생에너지 분야가 빠르게 커지고 있어요.'],['📁','사무 경력 그대로','서류·고객 응대 경험을 살릴 수 있어요.'],['🌍','의미 있는 일','깨끗한 에너지를 늘리는 데 함께해요.']]);
DD('환경교육 강사','장바구니 세 개를 챙기는\n지구 지킴이 선생님','환경교육 강사는 학교·도서관·마을에서 분리배출·기후·업사이클 수업을 체험 위주로 진행해요. 공식 자격으로 환경교육사가 있어요.','분리수거 잔소리꾼?','기후와 생활을 연결해 행동을 바꾸게 하는 교육자예요.','학교, 환경교육센터, 도서관, 지자체 환경 프로그램','시간제 수업이 많아요','환경교육사(국가자격) 등 관련 자격이 있으면 유리해요','우리 집 일주일 쓰레기를 기록하고 줄이는 방법 3가지를 찾아보세요','지자체 환경교육센터 강사 모집, 학교 체험 강사 공고를 확인해요',[['🌏','의미 있는 수업','작은 행동 변화가 큰 변화를 만들어요.'],['🏫','지자체 사업이 많아요','환경 교육 프로그램이 꾸준히 열려요.'],['🌱','환경 역량이 중요해지는 시대','환경 관리 역량이 성장 기술로 꼽혀요.']]);
DD('도시농업 관리사','아파트 텃밭에서\n이웃을 키우는 선생님','도시농업 관리사는 도시 텃밭·학교 정원에서 작물 기르기를 가르치고 공동체 텃밭을 운영해요.','농사짓는 사람?','도시 사람들에게 농업과 공동체 활동을 가르치는 교육자이자 운영자예요.','도시농업지원센터, 학교·복지관 텃밭, 공동체 텃밭','계절별 프로그램, 시간제가 많아요','도시농업관리사(국가자격): 지정 교육 이수 등 요건이 있어요 (요건은 기관에 확인)','베란다에서 상추·방울토마토를 키우며 성장 기록을 남겨 보세요','지자체 도시농업지원센터, 학교·복지관 텃밭 강사 모집을 확인해요',[['🥬','식물 키우기가 직업','좋아하는 텃밭이 일이 돼요.'],['👨‍👩‍👧','이웃이 생기는 일','텃밭을 함께 가꾸며 공동체가 생겨요.'],['🧘','치유·교육으로 확장','치유 농업 프로그램으로 넓혀 갈 수 있어요.']]);
/* 상담·교육 */
DD('직업상담사','누군가의 다시 시작을\n함께 찾는 길잡이','직업상담사는 구직자의 경험과 희망을 상담하고 채용 정보·교육·지원 제도를 연결해요.','일자리 소개만 하는 사람?','강점을 찾아 주고 교육·지원 제도·채용까지 이어 주는 상담 전문가예요.','고용센터, 여성새로일하기센터, 대학 일자리센터, 기업 인사팀','주간 근무가 많아요','직업상담사(국가자격) 2급이 많이 요구돼요','주변 지인의 이력서 한 장을 함께 다듬어 보고, 고용24 지원 제도를 정리해 보세요','고용24, 새일센터·일자리센터 채용 공고를 확인해요',[['🧭','내 경험이 상담의 힘','다시 일을 시작해 본 경험이 공감의 힘이 돼요.'],['🏢','일터가 다양','공공기관부터 기업까지 일할 곳이 많아요.'],['🤖','AI로 상담이 빨라져요','정보 검색과 기록을 AI가 돕고 있어요.']]);
DD('AI 활용 강사','"부탁 말고 지시!"\nAI를 일에 쓰게 하는 선생님','AI 활용 강사는 기관·주민·직장인에게 생성형 AI를 일과 생활에 쓰는 법을 쉽게 가르쳐요.','AI 박사만 가르치는 일?','먼저 써 보고 쉽게 알려 주는 사람이면 누구나 도전할 수 있어요.','기관·기업 출강, 평생교육원, 도서관, 온라인 강의','강의 일정 단위·프리랜서','필수 자격보다 강의 경력과 결과물이 중요해요. AI 관련 민간자격·강사 양성 과정이 있어요','오늘 배운 지시법으로 가족에게 10분 미니 강의를 해 보세요','평생교육원·기관 강사 모집, 강사 플랫폼 등록, 블로그로 강의 홍보',[['🎤','배운 만큼 강의가 돼요','내가 써 본 것이 바로 강의 내용이에요.'],['🏫','수요가 늘고 있어요','기관마다 AI 교육 요청이 많아지고 있어요.'],['🚀','가장 빠르게 중요해지는 기술','AI·기술 리터러시가 성장 기술 1순위로 꼽혀요.']]);
DD('고객경험 상담사','챗봇이 못 푼 문제를\n끝까지 해결하는 사람','고객경험 상담사는 챗봇이 넘긴 어려운 문의를 상담하고 고객 불편을 모아 서비스 개선을 제안해요.','전화만 받는 상담원?','고객의 불편을 데이터로 모아 서비스를 바꾸는 해결사예요.','고객센터, 온라인 쇼핑몰, 공공기관 콜센터 (공고에서는 "고객상담원·CS")','교대·재택 상담도 있어요','필수 자격은 없어요. 상담·CS 교육이 도움이 돼요','최근 불편했던 서비스 경험을 "문제-원인-제안"으로 정리해 보세요','고용24에서 "고객상담·CS"로 검색해요',[['🎧','재택 상담 일자리','집에서 일하는 상담 자리도 있어요.'],['🧩','문제 해결의 보람','꼬인 문제가 풀릴 때 고객이 고마워해요.'],['🔁','다른 직무로 이어져요','서비스 기획·품질 관리로 성장할 수 있어요.']]);
DD('평생교육사','동네 배움터를\n기획하는 사람','평생교육사는 주민센터·복지관·도서관에서 성인 교육 프로그램을 기획·운영하고 강사를 연결해요.','강의실 관리하는 사람?','주민이 배우고 싶은 것을 조사해 프로그램을 만드는 교육 기획자예요.','평생학습관, 주민센터, 도서관, 복지관, 대학 평생교육원','주간 근무, 계약직이 많아요','평생교육사(국가자격): 관련 과목 이수로 취득해요','동네 평생학습관 프로그램을 조사해 내가 만들고 싶은 강좌 기획서를 써 보세요','고용24, 지자체·평생학습관 채용 공고를 확인해요',[['📚','배움을 좋아하는 분께 딱','배우며 일하는 환경이에요.'],['🗂️','기획 경험이 쌓여요','프로그램 기획 능력은 어디서나 쓰여요.'],['🏛️','공공기관 일자리','자격으로 공공 분야에 도전할 수 있어요.']]);
DD('그림책 독서지도사','책 한 권으로\n생각을 넓혀 주는 이야기꾼','그림책 독서지도사는 그림책을 함께 읽고 이야기·놀이·글쓰기로 아이와 어르신의 생각을 넓혀요.','책 읽어 주는 사람?','읽기 후 질문·놀이·표현 활동까지 설계하는 독서 교육자예요.','도서관, 학교 방과후, 지역아동센터, 노인복지관','시간제 수업이 많아요','독서지도사 등 민간자격 과정이 있어요. 기관 요구를 확인해요','좋아하는 그림책 1권으로 질문 5개와 놀이 1개를 만들어 보세요','도서관·방과후 강사 모집 공고를 확인해요',[['📖','책을 좋아하는 마음이 실력','좋아하는 책이 곧 수업 재료예요.'],['🧒','육아 경험이 강점','아이와 책 읽던 경험이 큰 도움이 돼요.'],['🎭','목소리 연기의 재미','구연 실력이 수업의 하이라이트예요.']]);
DD('청소년 진로 코치','"넌 이게 잘 어울려!"\n꿈 지도를 그려 주는 사람','청소년 진로 코치는 학교·센터에서 청소년이 흥미와 강점을 찾고 직업을 체험하도록 돕는 수업을 해요.','진학 상담만 하는 사람?','흥미·강점 찾기, 직업 체험, 진로 계획까지 함께하는 코치예요.','학교 진로 수업, 청소년센터, 진로체험지원센터','학기 일정에 맞춘 시간제가 많아요','진로 관련 민간자격·교육 과정이 있어요. 직업상담사 자격도 도움이 돼요','자녀나 조카와 이 앱의 직업 도감을 함께 보며 대화해 보세요','진로체험지원센터·청소년센터 강사 모집을 확인해요',[['🗺️','꿈을 함께 찾는 보람','"선생님 덕분에 하고 싶은 게 생겼어요"를 들어요.'],['👩‍👧','자녀 진로에도 도움','내 아이 진로 대화도 쉬워져요.'],['🎒','학교 수업 기회','자유학기·진로 수업이 꾸준해요.']]);
DD('다문화 가족 코디네이터','두 문화를 잇는\n따뜻한 다리','다문화 가족 코디네이터는 결혼이민·외국인 가족의 한국 생활 적응과 자녀 교육을 돕고 프로그램을 운영해요. 가족센터에서는 통번역지원사·방문교육지도사 등으로 일해요.','통역만 하는 사람?','생활 정보·교육·제도를 연결해 가족이 지역에 뿌리내리도록 돕는 사람이에요.','가족센터, 외국인 주민 지원센터, 학교 다문화 지원','주간 근무·방문 활동','기관마다 자격 요건이 달라요(외국어, 사회복지·교육 관련 자격 등). 공고를 확인해요','쉬운 한국어로 생활 안내문 하나를 다시 써 보세요','가족센터·외국인 지원센터 채용 공고를 확인해요',[['🌏','외국어·이주 경험이 강점','두 문화를 아는 것이 큰 힘이에요.'],['🤗','가족을 돕는 보람','새로운 이웃이 지역에 자리 잡는 걸 함께해요.'],['🏢','기관 일자리','가족센터 등 공공 일자리가 있어요.']]);
DD('노후 설계 상담사','인생 2막을\n함께 그리는 플래너','노후 설계 상담사는 중장년이 연금·건강·일·관계를 함께 계획하도록 상담하고 교육해요.','돈 이야기만 하는 사람?','재무뿐 아니라 일·건강·관계까지 균형 있게 설계를 돕는 상담가예요.','연금·금융 기관 교육, 평생교육, 기업 퇴직 교육, 복지관','교육·상담 일정 단위','기관별 강사 양성 과정·관련 자격이 있어요. 금융·연금 제도 공부가 필요해요','내 노후 준비 체크리스트를 만들어 스스로 점검해 보세요','국민연금공단 등 노후준비 강사 모집, 평생교육 강사 공고를 확인해요',[['🗓️','내 노후 준비에도 도움','가르치며 나도 준비하게 돼요.'],['🎤','강의로 확장','교육 강사로 활동 폭을 넓혀요.'],['👵','고령화로 수요 증가','은퇴 준비 상담 수요가 커지고 있어요.']]);
/* 문화·여가 */
DD('지역 문화관광 해설사','골목마다 숨은 이야기를\n들려주는 사람','문화관광해설사는 지역 문화유산·관광지에서 역사와 이야기를 재미있게 설명하고 탐방을 안내해요.','외워서 말하는 사람?','같은 장소도 듣는 사람에 맞게 이야기를 고르는 스토리텔러예요.','지자체 관광지, 문화유산, 박물관, 축제','주말·시간제 활동이 많아요','지자체 문화관광해설사 양성 과정을 이수하고 선발돼요 (모집 시기는 지자체에 확인)','우리 동네 명소 한 곳을 3분 이야기로 만들어 가족에게 해설해 보세요','지자체 문화관광해설사 모집 공고를 확인해요',[['🏯','지역 사랑이 일이 돼요','내가 사는 곳의 이야기가 직업이 돼요.'],['🚶','걷는 즐거움','하루 종일 앉아 있지 않아요.'],['🗣️','이야기꾼에게 딱','말솜씨와 흥이 큰 힘이에요.']]);
DD('체험 프로그램 기획자','행사는 2시간,\n준비표는 20장인 사람','체험 프로그램 기획자는 축제·원데이 클래스·가족 체험의 일정·강사·준비물·홍보를 기획하고 진행해요.','파티 준비?','목적·예산·안전·홍보까지 계산해 하루를 완성하는 기획자예요.','지자체·문화재단, 복지관, 체험 농장·공방, 행사 대행사','현장 근무와 주말 행사가 있어요','필수 자격은 없어요. 행사 기획·안전 교육이 도움이 돼요','모임 행사 하나를 일정표·준비물표·홍보 카드뉴스로 기획해 보세요','문화재단·복지관·행사 대행사 "기획·운영" 공고를 확인해요',[['🎪','하루를 만드는 쾌감','계획대로 착착 진행될 때 짜릿해요.'],['🧑‍🤝‍🧑','사람 모으는 재미','많은 사람이 웃는 현장을 만들어요.'],['🔁','어디서나 쓰이는 기획력','기획 경험은 다른 분야로도 이어져요.']]);
DD('플랜테리어 전문가','시든 화분도\n살려 내는 초록 디자이너','플랜테리어 전문가는 집·카페·사무실에 어울리는 식물을 골라 배치하고 관리법을 알려 줘요.','꽃집 사장님?','공간과 빛에 맞춰 식물을 설계하고 관리까지 책임지는 공간 디자이너예요.','식물 공방, 인테리어 업체, 관리 구독 서비스, 1인 창업','방문·관리 일정 단위','필수 자격은 없어요. 원예·화훼 관련 자격과 교육이 도움이 돼요','우리 집 빛 방향을 기록하고 맞는 식물 3가지를 골라 배치해 보세요','식물 공방·인테리어 업체 공고, 카페·사무실 관리 제안을 활용해요',[['🪴','취미가 일이 돼요','식물 키우는 기쁨이 곧 직업이에요.'],['🔁','관리 구독 수입','정기 관리로 꾸준한 수입을 만들어요.'],['🏡','공간을 바꾸는 보람','초록이 들어오면 공간 분위기가 달라져요.']]);
DD('공방 클래스 강사','손재주를 나누는\n주말의 선생님','공방 클래스 강사는 뜨개·캔들·도자기 등 원데이 클래스를 열고 온라인 예약과 후기를 관리해요.','취미 생활?','수업 설계·재료 원가·예약·후기 관리까지 하는 작은 교육 사업이에요.','내 공방, 공유 공방, 문화센터, 예약 플랫폼','주말·저녁 수업이 많아요','필수 자격은 없어요. 공예 분야 민간자격이 신뢰를 높여요','지인 3명을 초대해 1시간 체험 수업을 열어 보세요','클래스 예약 플랫폼 등록, 문화센터 강사 모집을 확인해요',[['🧶','손재주가 수업','좋아하는 취미를 가르칠 수 있어요.'],['📅','예약 플랫폼으로 홍보','온라인 예약으로 손님을 모아요.'],['😊','웃음이 남는 일','완성작을 들고 웃는 수강생을 만나요.']]);
/* 사무·관리 */
DD('프로젝트 매니저','모두가 같은 방향으로\n가게 만드는 지휘자','프로젝트 매니저는 사업·행사·제작 일의 일정·사람·예산을 계획하고 진행 상황을 챙겨 제때 끝내요.','회의만 하는 사람?','일정과 사람 사이의 문제를 미리 발견하고 푸는 조율 전문가예요.','기업, 공공 사업단, 교육·행사 기관, IT 회사','주간 근무, 마감 전엔 바빠요','필수 자격보다 경력이 중요해요. 프로젝트 관리 교육·자격이 도움이 돼요','가족 여행이나 모임을 일정표·예산표·역할표로 관리해 보세요','고용24에서 "사업 운영·PM·코디네이터"로 검색해요',[['🗓️','계획표 좋아하는 분께 딱','일정을 짜고 맞추는 재미가 있어요.'],['🤝','조율 능력이 빛나요','모임 총무 경험이 그대로 강점이에요.'],['📈','크게 늘어날 직군','프로젝트 매니저가 크게 늘어날 직군으로 꼽혀요.']]);

DD('통합돌봄 코디네이터','병원·요양·생활을\n한 번에 잇는 돌봄 설계자','2026년 3월부터 「의료·요양 등 지역 돌봄의 통합지원에 관한 법률」이 시행되면서, 지자체가 의료·요양·생활 서비스를 묶어 연결하는 일이 커지고 있어요. 정확한 직무명과 채용 방식은 지자체마다 달라요.','서류만 넘기는 행정직?','한 사람의 생활 전체를 보고 필요한 서비스를 설계하고 연결하는 돌봄 기획자예요.','시군구청, 읍면동 행정복지센터, 보건소, 국민건강보험공단, 복지관','주간 근무 중심이에요. 기관 회의와 가정 방문이 함께 있어요','사회복지사·간호사 등 관련 자격과 경력을 요구하는 경우가 많아요 (지자체 공고 확인, 미확인 부분 있음)','사회복지사 자격 과정을 알아보고, 지역 돌봄 기관 지도를 직접 만들어 보세요','시군구청 채용 공고, 지방자치단체 통합채용, 복지관 홈페이지를 확인해요',[['🧩','새로 커지는 공공 분야','법 시행과 함께 자리가 만들어지는 중이에요.'],['🔗','경험이 이어져요','사회복지·간호·요양 경력이 모두 강점이 돼요.'],['🌱','큰 그림을 그리는 보람','한 사람의 삶이 안정되는 과정을 함께 설계해요.']]);
DD('병원 동행 매니저','진료실 문 앞까지\n함께 걸어가는 사람','병원 동행 매니저는 혼자 병원에 가기 어려운 어르신·장애인과 함께 접수·진료·수납·약 받기·귀가까지 동행하고 보호자에게 진료 내용을 전해요. 일부 지자체는 공공 동행 서비스를 운영해요.','택시 같이 타 주는 사람?','진료 내용을 정확히 듣고 메모해 전달하는, 환자와 가족 사이의 다리예요.','병원 동행 서비스 업체, 지자체 동행 서비스 수행기관, 돌봄 플랫폼','건당·시간 단위 일이 많아요. 오전 진료 시간에 몰려요','필수 국가자격은 없지만 요양보호사·간호조무사 자격이나 돌봄 경력을 우대하는 곳이 많아요 (업체별 확인)','가족 병원 동행 때 진료 메모를 정리해 보고, 지역 병원 위치와 교통편을 익혀 보세요','돌봄 플랫폼, 지자체 동행 서비스 모집 공고, 고용24를 확인해요',[['⏱️','시간을 나눠 일해요','필요한 시간만 일할 수 있어 생활과 맞추기 좋아요.'],['🧓','든든한 보호자 역할','혼자 오기 막막했던 분께 큰 힘이 돼요.'],['🌱','새로 생기는 서비스','1인 가구·고령층 증가로 수요가 커지는 중이에요.']]);
DD('임상심리사','마음의 상태를\n과학적으로 읽어 주는 사람','임상심리사는 심리검사와 면담으로 마음의 어려움을 평가하고 치료 계획을 돕는 전문가예요. 2025~2035 전망에서 직무 확장성이 두드러질 직업으로 언급됐어요.','점쟁이처럼 마음을 맞히는 사람?','검사 도구와 근거로 상태를 평가하고, 치료 방향을 함께 세우는 과학적인 전문가예요.','정신건강의학과, 종합병원, 정신건강복지센터, 상담센터, 학교·기업','주간 근무 중심이에요. 병원은 진료 일정에 맞춰요','임상심리사 국가기술자격(1·2급)은 심리 관련 학위와 수련 경력이 응시 요건이에요 (큐넷에서 요건 확인)','사이버대 상담심리 과정이나 심리검사 입문 강좌로 먼저 맛보기를 해 보세요','고용24, 한국임상심리학회·정신건강복지센터 채용 공고를 확인해요',[['🧠','전문성이 깊어지는 일','경력이 쌓일수록 신뢰받는 전문가가 돼요.'],['💬','마음 건강 수요 증가','상담·치료 분야의 역할이 넓어지고 있어요.'],['📈','10년 뒤 더 필요한 일','직무 확장성이 두드러질 직업으로 꼽혔어요.']]);
DD('언어재활사','말 한마디의 기적을\n함께 만드는 사람','언어재활사는 말이 늦은 아이, 발음이 어려운 아이, 뇌손상 뒤 말이 어려워진 어른의 말하기·듣기·삼키기를 훈련해요. 재활치료 분야 직무 확장 전망이 있어요.','발음 교정 학원 선생님?','평가와 치료 계획을 세워 의사소통 능력을 되찾게 돕는 국가자격 재활 전문가예요.','언어치료센터, 아동발달센터, 재활병원, 복지관, 특수학교','센터는 오후·주말 수업이 많고, 병원은 주간 근무예요','언어재활사 국가자격(1·2급): 언어재활 관련 학과를 졸업하고 국가시험에 합격해야 해요','아이 발달 관련 책을 읽어 보고, 관련 학과 편입·대학원 과정을 알아보세요','고용24, 한국언어재활사협회 구인란, 발달센터 공고를 확인해요',[['👶','아이부터 어르신까지','대상이 넓어 일할 곳이 다양해요.'],['🎉','작은 변화의 큰 감동','첫 단어를 말하는 순간을 함께해요.'],['📈','확장되는 재활 분야','직무 확장성이 커질 분야로 꼽혔어요.']]);
DD('놀이·미술치료사','그림 한 장으로\n마음 문을 여는 사람','놀이·미술치료사는 놀이·그림·만들기로 말로 하기 어려운 마음을 표현하게 돕고 변화를 관찰해요. 예술치료 분야의 직무 확장 전망이 있어요.','아이랑 놀아 주는 선생님?','활동 속 표현을 관찰하고 치료 목표에 맞춰 회기를 설계하는 전문가예요.','아동발달센터, 상담센터, 복지관, 학교, 요양시설','오후·주말 회기가 많고 프리랜서 활동도 있어요','국가자격이 아닌 민간 자격이 많아요. 학회 인증 자격이나 관련 대학원 과정을 확인하고 고르는 게 중요해요','지역 복지관 미술 프로그램 보조로 참여하고, 아이와 한 그림 활동을 기록해 보세요','고용24, 학회 구인 게시판, 발달센터·복지관 공고를 확인해요',[['🎨','좋아하는 것으로 일해요','만들기·그림을 좋아한다면 즐겁게 일할 수 있어요.'],['👩‍👧','육아 경험이 힘','아이 눈높이 이해가 큰 강점이에요.'],['📈','넓어지는 치료 분야','예술치료의 역할이 커질 전망이에요.']]);
DD('아이돌보미','바쁜 부모 대신\n아이 곁을 지키는 사람','아이돌보미는 정부 아이돌봄서비스 등을 통해 가정에 방문해 아이를 돌봐요. 맞벌이 가정 수요는 이어지지만 출생아 수 변화로 지역별 차이가 커요.','그냥 아이 봐 주는 이모?','아이 발달과 안전을 이해하고 정해진 교육을 받은 돌봄 전문 인력이에요.','시군구 아이돌봄 서비스 제공기관(가족센터 등), 민간 돌봄 플랫폼','등·하원, 방과 후, 영아 종일 등 시간대를 골라요','지정 기관의 양성 교육을 이수한 뒤 활동해요. 제도가 바뀔 수 있으니 지역 아이돌봄센터에 확인하세요','지역 가족센터에 문의해 교육 일정을 확인하고, 아동 응급처치 교육을 들어 보세요','지역 가족센터·아이돌봄 제공기관 모집 공고, 돌봄 플랫폼을 확인해요',[['🕒','내 시간에 맞춰요','원하는 시간대와 지역을 골라 활동할 수 있어요.'],['👶','육아 경험이 경력','내 아이를 키운 경험이 그대로 실력이 돼요.'],['🤝','가정의 든든한 지원군','부모가 안심하고 일할 수 있게 도와요.']]);
DD('영양사','한 끼 식단으로\n건강을 설계하는 사람','영양사는 급식 식단을 짜고 영양을 계산하며 식재료·위생·조리 인력을 관리해요. 어르신·환자 맞춤 식단 수요가 커지고 있어요.','급식 메뉴만 정하는 사람?','영양·위생·예산·인력까지 관리하는 급식 운영 책임자예요.','학교, 병원, 요양시설, 어린이집, 회사 구내식당, 급식 업체','급식 시간 중심 주간 근무가 많아요','영양사 면허: 식품영양 관련 학과를 졸업하고 국가시험에 합격해야 해요','학점은행제·편입으로 식품영양 전공 과정을 알아보고, 집 식단표를 영양 기준으로 짜 보세요','고용24, 대한영양사협회 구인란, 교육청 채용 공고를 확인해요',[['🍱','일터가 다양해요','학교부터 병원·요양시설까지 선택지가 넓어요.'],['📋','면허로 오래 일해요','한 번 면허를 따면 경력이 계속 이어져요.'],['🧓','맞춤 식단 수요','어르신·환자 식단 전문성이 더 중요해지고 있어요.']]);
DD('케어푸드 개발자','씹기 쉬운데\n맛까지 좋은 음식을 만드는 사람','케어푸드 개발자는 어르신·환자가 쉽게 씹고 삼킬 수 있으면서 영양과 맛은 지킨 음식을 연구하고 상품으로 만들어요. 식약처는 고령친화우수식품 지정 제도를 운영해요.','죽만 만드는 사람?','부드러운 갈비찜, 영양 젤리처럼 일반 음식의 맛을 살린 새로운 요리를 설계해요.','식품 회사, 급식·도시락 업체, 요양시설 주방, 1인 창업','연구·시험 제작은 주간 근무, 창업은 스스로 시간 관리','필수 자격은 없지만 조리기능사, 식품 관련 자격이 도움이 돼요. 판매하려면 영업 신고와 표시 기준을 지켜야 해요','부모님을 위한 연화식 레시피를 3가지 만들어 보고 평가를 받아 보세요','식품 회사 채용, 고령친화식품 관련 지원사업, 창업 지원 공고를 확인해요',[['🥄','먹는 사람을 배려하는 요리','요리 실력을 돌봄과 연결할 수 있어요.'],['📦','커지는 시장','고령친화식품 시장이 성장하는 중이에요.'],['💡','창업 아이디어','작은 반찬 가게에서 시작할 수도 있어요.']]);
DD('치유농업사','흙과 식물로\n마음을 돌보는 선생님','치유농업사는 텃밭·꽃·수확 같은 농업 활동으로 사람의 몸과 마음 회복을 돕는 프로그램을 기획·운영해요. 농촌진흥청이 관리하는 국가전문자격이에요.','그냥 농사짓는 사람?','참여자에 맞춰 목표를 세우고 농업 활동으로 회복을 돕는 프로그램 전문가예요.','치유농장, 농업기술센터, 복지관, 요양시설, 학교','프로그램 회기 단위로 일하고, 계절에 따라 일정이 달라요','치유농업사 국가전문자격(2급): 양성기관 교육을 이수하고 시험에 합격해야 해요 (농촌진흥청 공고 확인)','베란다·주말농장에서 직접 키워 보고, 지역 농업기술센터 교육을 신청해 보세요','농업기술센터, 치유농장, 복지관 프로그램 강사 모집을 확인해요',[['🌿','자연 속에서 일해요','식물과 함께하며 나도 같이 치유돼요.'],['🎓','국가자격 인정','자격으로 전문성을 인정받아요.'],['🌱','새로 뜨는 분야','농업과 복지를 잇는 새 일자리예요.']]);
DD('바리스타','커피 한 잔으로\n하루를 여는 사람','바리스타는 커피와 음료를 만들고 손님을 맞으며 원두·재고·위생을 관리해요. 무인·로봇 카페가 늘면서 손님 응대와 메뉴 개발 능력이 더 중요해지고 있어요.','커피만 내리는 사람?','맛, 위생, 손님 응대, 매장 운영까지 챙기는 카페의 얼굴이에요.','동네 카페, 프랜차이즈 매장, 베이커리 카페, 기관 카페','오픈·마감 교대, 주말 근무가 많아요','국가자격은 없고 민간 바리스타 자격이 많아요. 실무 경험이 더 중요해요','지역 카페 단기 근무나 바리스타 체험 수업으로 먼저 경험해 보세요','고용24, 알바 앱, 지역 카페 구인 공고를 확인해요',[['☕','배우기 쉬운 시작','짧은 교육으로 일을 시작할 수 있어요.'],['🏪','창업으로 연결','경험이 쌓이면 내 카페를 꿈꿀 수 있어요.'],['🔄','바뀌는 역할','무인화 속에서 응대·메뉴 개발이 경쟁력이에요.']]);
DD('업무 자동화(RPA) 운영자','지루한 반복 업무를\n로봇에게 넘기는 사람','RPA 운영자는 매일 반복되는 엑셀 정리, 메일 발송, 자료 다운로드를 자동화 프로그램으로 만들고 관리해요. RPA 개발자 같은 업무 자동화 직업이 한국직업사전에 새로 등재되고 있어요.','어려운 코딩 개발자?','업무 순서를 정확히 아는 사람이 끌어다 놓기 방식 도구로 자동화를 만드는 일이에요.','기업 경영지원팀, 공공기관, 금융사, 자동화 컨설팅 업체','주간 사무 근무예요. 재택 근무가 가능한 곳도 있어요','필수 자격은 없어요. RPA 도구 업체 인증 과정, 엑셀·컴퓨터활용능력이 도움이 돼요','내가 매일 반복하는 일 하나를 골라 엑셀 매크로나 AI 자동화로 줄여 보세요','고용24, 국민내일배움카드 RPA 과정, 기업 채용 공고를 확인해요',[['🤖','사무 경력이 무기','업무 흐름을 아는 사람이 자동화도 잘해요.'],['⏰','시간을 아껴 주는 보람','팀 전체의 야근을 줄여 줄 수 있어요.'],['✨','새로 뜨는 직업','디지털 전환과 함께 커지는 분야예요.']]);
DD('AI 챗봇 기획자','손님 질문에 척척 답하는\nAI 직원을 키우는 사람','AI 챗봇 기획자는 자주 묻는 질문을 모아 챗봇이 대답할 내용과 대화 흐름을 설계하고, 답이 맞는지 계속 점검해 고쳐요.','AI가 다 알아서 하는 것 아닌가요?','AI가 틀리지 않게 질문과 답을 설계하고 계속 가르치는 사람이 꼭 필요해요.','쇼핑몰, 병원·학원, 공공기관, 고객센터, 챗봇 제작 업체','주간 사무 근무가 많고, 프리랜서 제작도 있어요','필수 자격은 없어요. 노코드 챗봇 도구 활용 능력과 상담·응대 경험이 강점이에요','동네 가게 자주 묻는 질문 20개를 정리해 무료 챗봇 도구로 만들어 보세요','고용24, 원티드 등 채용 플랫폼, 프리랜서 플랫폼을 확인해요',[['💬','상담 경력이 그대로','손님이 무엇을 묻는지 아는 경험이 핵심이에요.'],['🛠️','노코드로 시작','코딩 없이 도구로 만들 수 있어요.'],['✨','새로 뜨는 직업','AI 도입이 늘수록 필요해져요.']]);
DD('영상 편집자','평범한 영상을\n보고 싶은 영상으로 바꾸는 사람','영상 편집자는 촬영한 영상을 자르고 자막·음악·효과를 넣어 완성해요. AI 자동 자막·컷 편집 도구가 나오면서 일하는 방식이 빠르게 바뀌고 있어요.','버튼만 누르면 되는 일?','이야기 흐름과 재미 포인트를 찾아내는 감각이 결과를 결정해요.','영상 제작사, 기업 홍보팀, 유튜버, 교육기관, 프리랜서','재택·프리랜서가 많고, 마감에 맞춰 일해요','필수 자격은 없어요. 포트폴리오가 가장 중요하고, 컴퓨터그래픽 관련 자격은 참고용이에요','가족 행사 영상을 1분짜리로 편집해 보고, 무료 편집 앱 강의를 들어 보세요','프리랜서 플랫폼, 고용24, 크리에이터 커뮤니티 구인란을 확인해요',[['🏠','재택으로 일해요','노트북 하나로 집에서 일할 수 있어요.'],['🎬','작품이 포트폴리오','만든 영상이 그대로 실력 증명이 돼요.'],['🔄','AI와 함께 진화','AI 도구를 잘 쓰면 작업 속도가 두 배가 돼요.']]);
DD('웹툰·이모티콘 작가','일상의 웃긴 순간을\n그림으로 바꾸는 사람','웹툰·이모티콘 작가는 태블릿으로 그림을 그려 웹툰, 인스타툰, 메신저 이모티콘을 만들고 플랫폼에 올려 수익을 내요.','그림 천재만 하는 일?','그림 실력보다 공감되는 이야기와 꾸준함이 더 중요할 때가 많아요.','웹툰·이모티콘 플랫폼, SNS 연재, 기업 홍보툰 외주','완전 재택, 내 시간에 맞춰 작업해요','필수 자격은 없어요. 플랫폼 제안 심사를 통과해야 판매할 수 있어요','오늘 있었던 일을 4컷 만화로 그려 SNS에 일주일 연재해 보세요','이모티콘 제안 플랫폼, 웹툰 공모전, 지역 콘텐츠 지원사업을 확인해요',[['✏️','내 이야기가 콘텐츠','육아·일상 경험이 그대로 소재가 돼요.'],['🏠','집에서 내 속도로','시간과 장소에 얽매이지 않아요.'],['🌱','도전할수록 기회','한 번 통과하면 꾸준한 수익이 될 수 있어요.']]);
DD('AI 콘텐츠 검수자','AI가 만든 글의\n거짓말을 찾아내는 사람','AI 콘텐츠 검수자는 AI가 만든 글·이미지·답변에 틀린 정보, 저작권 문제, 어색한 표현이 없는지 확인하고 고쳐요. 생성형 AI 확산과 함께 생겨나는 일이에요.','AI가 쓴 글을 그냥 읽는 일?','출처를 따지고 사실을 확인하는 꼼꼼함이 핵심인 품질 관리 일이에요.','AI 데이터 업체, 콘텐츠 제작사, 출판·교육 업체, 재택 플랫폼','재택·시간제가 많아요','필수 자격은 없어요. 문해력, 출처 확인 습관, 기본적인 저작권 지식이 중요해요','AI에게 질문하고 답의 출처를 하나씩 확인해 틀린 곳 찾기 연습을 해 보세요','데이터 라벨링 플랫폼, 재택 부업 플랫폼, 콘텐츠 업체 공고를 확인해요',[['🔍','꼼꼼함이 무기','작은 오류를 찾는 눈이 그대로 실력이에요.'],['🏠','재택 가능','시간을 나눠 집에서 일할 수 있어요.'],['✨','AI 시대의 새 직업','AI 결과물이 늘수록 필요해져요.']]);
DD('개인정보 보호 담당자','고객의 소중한 정보를\n지키는 문지기','개인정보 보호 담당자는 회사·기관의 개인정보가 법에 맞게 수집·보관·폐기되는지 점검하고 직원 교육과 동의서 관리를 해요. 정보보안 분야는 성장 전망이 있어요.','컴퓨터 해커 막는 사람?','기술보다 규칙과 서류, 사람 교육이 더 큰 비중을 차지하는 관리 업무예요.','공공기관, 병원, 학교, 기업, 복지기관','주간 사무 근무예요','필수 자격은 없어요. 개인정보관리사 같은 민간 자격, 개인정보보호위원회 교육이 도움이 돼요','우리 기관 서류에서 개인정보가 들어간 곳을 찾아 점검표를 만들어 보세요','고용24, 공공기관 채용, 기업 정보보호팀 공고를 확인해요',[['🔐','어디서나 필요해요','개인정보를 다루는 모든 기관에 꼭 필요한 일이에요.'],['📂','사무 경력과 연결','서류 관리 경험이 바로 쓰여요.'],['📈','커지는 분야','AI 시대에 정보 보호가 더 중요해지고 있어요.']]);
DD('오디오북 낭독가','목소리 하나로\n책 한 권을 들려주는 사람','오디오북 낭독가는 책·동화·교육 자료를 읽어 녹음하고 발음과 감정을 살려 완성해요. 오디오 콘텐츠가 커지는 한편 AI 음성과의 경쟁도 있어요.','성우만 할 수 있는 일?','전문 성우가 아니어도 따뜻한 목소리와 꾸준한 연습으로 도전할 수 있어요.','오디오북 플랫폼, 출판사, 교육 콘텐츠 업체, 도서관 낭독 봉사','건당 녹음, 재택 녹음이 많아요','필수 자격은 없어요. 낭독 교육 과정과 샘플 녹음 파일이 중요해요','그림책 한 권을 녹음해 가족에게 들려주고 피드백을 받아 보세요','오디오북 플랫폼 낭독자 모집, 프리랜서 플랫폼을 확인해요',[['🎙️','목소리가 재능','아이에게 책 읽어 준 경험이 실력이 돼요.'],['🏠','집에서 녹음','녹음 장비만 있으면 재택으로 일해요.'],['🤖','AI와 다른 가치','사람 목소리의 감정이 강점이에요.']]);
DD('온라인 커뮤니티 매니저','온라인 모임을\n따뜻하게 이끄는 반장','온라인 커뮤니티 매니저는 카페·밴드·오픈채팅 모임을 운영하며 공지·이벤트·질문 응대·규칙 관리를 해요. 기업·기관이 고객과 소통하는 채널이 늘고 있어요.','단톡방 관리만 하는 일?','회원이 오래 머물게 콘텐츠를 기획하고 분위기를 만드는 운영 전문가예요.','기업 마케팅팀, 브랜드 커뮤니티, 교육기관, 지역 단체','재택·시간제가 많고, 저녁 시간 응대가 있을 수 있어요','필수 자격은 없어요. 모임 운영 경험과 글쓰기 능력이 중요해요','내가 속한 모임의 공지와 이벤트를 한 달 동안 맡아 보세요','채용 플랫폼, 브랜드 서포터즈 모집, 프리랜서 플랫폼을 확인해요',[['💌','엄마 모임 경험이 힘','모임을 이끌어 본 경험이 그대로 쓰여요.'],['🏠','재택 가능','휴대폰과 노트북으로 일할 수 있어요.'],['✨','새로 뜨는 직무','온라인 소통 채널이 늘고 있어요.']]);
DD('전기차 충전소 운영 관리자','전기차의 주유소를\n지키는 사람','충전소 운영 관리자는 충전기 고장·요금·이용 상황을 확인하고 이용자 문의에 답하며 충전소를 안전하게 관리해요. 전기차 관련 직업이 한국직업사전에 새로 등재되고 있어요.','현장에서 전선만 만지는 사람?','관제 화면으로 상태를 확인하고 이용자를 응대하는 관제·상담 업무도 큰 비중이에요.','충전 사업자, 관제 센터, 아파트 관리 업체, 공공 충전 운영 기관','관제 센터는 교대 근무, 현장 관리는 주간 근무가 많아요','필수 자격은 업무마다 달라요. 전기 관련 자격이 있으면 현장 점검 업무에 유리해요','충전 앱을 깔아 우리 동네 충전소 현황을 살펴보고 이용 불편을 정리해 보세요','고용24, 충전 사업자 채용, 에너지 분야 직업훈련 과정을 확인해요',[['🔋','늘어나는 전기차','충전소가 늘수록 관리 인력도 필요해요.'],['📞','상담 경력 활용','관제·상담 업무로 시작할 수 있어요.'],['✨','새로 뜨는 분야','친환경 교통과 함께 커지는 일이에요.']]);
DD('수소충전원','수소차에 깨끗한 연료를\n안전하게 넣는 사람','수소충전원은 수소충전소에서 수소차에 충전하고 설비 압력과 누출 여부를 점검해요. 한국직업사전에 새로 등재된 직업이에요.','주유소 아르바이트와 같은 일?','고압가스를 다루기 때문에 안전 교육과 점검 절차를 정확히 지키는 전문 업무예요.','수소충전소 운영 업체, 에너지 기업, 버스 차고지 충전소','교대·주말 근무가 있을 수 있어요','한국가스안전공사의 수소 충전 관련 안전 교육 이수가 필요해요 (세부 요건은 공사·운영사 확인)','우리 지역 수소충전소 위치를 찾아보고 안전 교육 일정을 알아보세요','고용24, 에너지 기업·충전소 운영사 채용 공고를 확인해요',[['💧','경쟁이 적은 새 직업','새로 생긴 일이라 진입 기회가 있어요.'],['🛡️','교육으로 시작','정해진 교육을 받고 시작할 수 있어요.'],['🌏','친환경 에너지','탄소중립 흐름과 함께 가는 일이에요.']]);
DD('ESG 담당자','회사의 착한 성적표를\n관리하는 사람','ESG 담당자는 회사가 환경·사회·윤리 면에서 어떻게 하고 있는지 자료를 모아 보고서를 만들고 탄소 줄이기·사회공헌 활동을 기획해요. 환경 전환 관련 일자리는 성장 전망이 있어요.','환경 운동가?','숫자 자료와 기준을 맞춰 보고서를 만드는 기획·관리 업무가 중심이에요.','대기업·중견기업 ESG팀, 공공기관, 컨설팅사, 협력사 관리 부서','주간 사무 근무예요','필수 자격은 없어요. 민간 ESG 자격, 환경 관련 자격, 엑셀 능력이 도움이 돼요','우리 집 한 달 전기·쓰레기 사용량을 기록해 줄이는 계획을 세워 보세요','고용24, 기업 채용 공고, ESG 직업훈련 과정을 확인해요',[['🌿','의미 있는 일','회사를 더 좋은 방향으로 바꾸는 데 기여해요.'],['📊','기획·사무 경력 활용','자료 정리와 기획 능력이 강점이에요.'],['📈','성장하는 분야','환경·에너지 전환과 함께 커지고 있어요.']]);
DD('주택관리사','아파트 단지 살림을\n책임지는 관리소장','주택관리사는 아파트 단지의 시설 점검, 관리비, 주민 민원, 직원 관리를 맡아요. 스마트 아파트 시스템으로 업무 방식이 바뀌고 있어요.','관리실에 앉아 있는 사람?','회계·시설·사람 관리까지 하는 단지의 경영자에 가까워요.','아파트 관리사무소, 주택관리 업체, 오피스텔·주상복합 관리','주간 근무 중심이고, 긴급 상황 대응이 있어요','주택관리사(보) 국가자격 시험에 합격하고, 실무 경력을 쌓아 주택관리사가 돼요 (큐넷 확인)','우리 아파트 관리비 고지서를 항목별로 분석해 보고 시험 과목을 살펴보세요','주택관리사협회 구인란, 관리 업체 채용, 고용24를 확인해요',[['🏢','오래 일할 수 있어요','국가자격으로 중장년에도 도전하는 사람이 많아요.'],['🧾','살림 감각 활용','관리비와 살림을 챙기는 감각이 강점이에요.'],['🔄','스마트하게 변신','관리 앱·시스템으로 일이 바뀌는 중이에요.']]);
DD('방역·위생관리 전문가','보이지 않는 세균과\n싸우는 위생 지킴이','방역·위생관리 전문가는 건물·식당·학교 등에 소독과 해충 방제를 하고 위생 상태를 점검해 기록해요.','약 뿌리고 끝나는 일?','장소에 맞는 약품과 방법을 고르고 안전 수칙을 지키며 기록까지 남기는 전문 업무예요.','방역 업체, 건물 관리 업체, 식품 업체, 공공기관 시설팀','현장 방문 중심이고, 영업시간 외 작업이 있을 수 있어요','소독업 종사자는 관련 법정 교육을 받아야 해요. 방제 관련 자격이 있으면 유리해요 (보건소·업체 확인)','집 위생 점검표를 만들어 보고, 지역 방역 업체 교육 과정을 알아보세요','고용24, 방역 업체 채용, 지역 창업 지원 공고를 확인해요',[['🧴','빨리 시작해요','교육을 받고 비교적 빨리 일을 시작할 수 있어요.'],['🏃','몸을 움직이는 일','앉아만 있는 일이 답답한 분께 맞아요.'],['💼','창업 가능','경험을 쌓아 소규모 업체를 열 수 있어요.']]);
DD('리커머스 검수원','중고 물건에\n새 가치를 매기는 감정사','리커머스 검수원은 중고 의류·가방·전자기기를 받아 상태를 확인하고 등급을 매겨 사진과 설명을 올려요. 중고·리퍼 거래 시장이 커지고 있어요.','중고 물건 분류하는 단순 작업?','정해진 기준으로 품질을 판단하고 판매 정보를 만드는 꼼꼼한 전문 업무예요.','리커머스 플랫폼 물류센터, 중고 매장, 명품 감정 업체','주간 근무 중심, 물류센터는 교대가 있을 수 있어요','필수 자격은 없어요. 상품 지식과 사진 촬영 능력이 도움이 돼요','집에 있는 물건 5개를 등급 매기고 판매 글을 써서 올려 보세요','고용24, 리커머스 플랫폼 채용, 물류센터 공고를 확인해요',[['👜','살림 감각이 무기','물건 보는 눈이 그대로 실력이 돼요.'],['♻️','환경에도 좋은 일','버려질 물건에 새 주인을 찾아 줘요.'],['✨','커지는 시장','중고 거래가 늘면서 생겨난 일자리예요.']]);
DD('인사·노무 사무원','직원들이 안심하고\n일하도록 챙기는 사람','인사·노무 사무원은 채용, 근로계약, 4대 보험, 급여 자료, 근태를 관리해요. 2025~2035 전망에서 노무사 등 노무 전문 분야는 다소 증가로 나왔어요.','서류만 정리하는 사람?','노동법과 규정을 지키면서 직원 고민도 듣는, 회사와 사람 사이의 연결자예요.','중소기업 경영지원팀, 노무법인, 사회복지기관, 공공기관','주간 사무 근무예요','필수 자격은 없어요. 인사·노무 관련 민간 자격, 전산회계, 컴퓨터활용능력이 도움이 돼요','내 근로계약서·급여명세서를 항목별로 이해해 보고 4대 보험 기초 강의를 들어 보세요','고용24, 노무법인 채용, 기업 경영지원 공고를 확인해요',[['🏢','어디에나 있는 일','모든 회사에 인사 업무가 있어요.'],['📚','전문성이 쌓여요','실무를 쌓아 전문 자격으로 이어갈 수 있어요.'],['📈','노무 분야 증가','노무 전문 수요가 다소 늘어날 전망이에요.']]);
DD('심리상담사','마음속 이야기를\n끝까지 들어 주는 사람','심리상담사는 상담센터·학교·기업·복지관에서 고민이 있는 사람과 대화하며 스스로 답을 찾도록 도와요. 마음 건강 분야의 직무 확장 전망이 있어요.','조언해 주는 사람?','답을 정해 주기보다 스스로 찾게 돕는 전문 대화를 해요.','상담센터, 청소년상담복지센터, 학교, 기업 상담실, 복지관','주간·저녁 상담이 있고 프리랜서 활동도 있어요','민간 자격이 많아요. 청소년상담사(국가자격) 등은 학위·경력 요건이 있으니 확인하고 준비하세요','상담심리 입문 강좌를 듣고, 경청 연습을 가족과 해 보세요','고용24, 상담학회 구인란, 청소년상담복지센터 채용을 확인해요',[['💞','삶의 경험이 힘','살아온 경험이 깊은 공감의 바탕이 돼요.'],['🌱','오래 할수록 깊어져요','경력이 쌓일수록 더 신뢰받아요.'],['📈','마음 건강 수요','상담 분야 역할이 넓어지고 있어요.']]);
DD('학습코칭 전문가','공부하는 법을\n알려 주는 코치','학습코칭 전문가는 아이가 어려워하는 부분을 살펴 공부 계획·집중 습관·기록법을 함께 만들어요. 학생 수는 줄지만 맞춤 학습 지원 수요는 이어지고 있어요.','과외 선생님?','과목을 가르치기보다 스스로 공부하는 힘을 키우는 코치예요.','지역아동센터, 방과후 학교, 학습 코칭 센터, 온라인 플랫폼','오후·저녁 수업이 많아요','국가자격은 없고 민간 자격이 많아요. 교육 과정과 실습을 꼼꼼히 비교하세요','우리 아이와 2주간 공부 계획표를 함께 써 보고 변화를 기록해 보세요','지역아동센터·교육청 강사 모집, 학습 플랫폼 공고를 확인해요',[['📒','육아 경험이 힘','아이와 씨름해 본 경험이 실력이 돼요.'],['🏫','일터가 다양해요','센터·학교·온라인까지 선택지가 있어요.'],['🔄','맞춤형으로 변신','AI 학습 도구 지도가 새 역할이 되고 있어요.']]);
DD('한국어 교원','한국말을 처음 배우는 사람의\n첫 선생님','한국어 교원은 외국인 근로자·결혼이민자·유학생에게 한국어와 생활 문화를 가르쳐요. 외국인 주민이 늘면서 수요가 커지고 있어요.','한국 사람이면 누구나 가르칠 수 있다?','문법을 쉽게 설명하는 방법을 배우고 국가자격을 갖춰야 하는 전문 교육이에요.','가족센터, 대학 어학당, 외국인 지원센터, 온라인 플랫폼, 해외 기관','수업 단위 시간제가 많고 온라인 재택 수업도 있어요','한국어교원 국가자격(문화체육관광부): 학위 과정이나 양성 과정 이수 후 한국어교육능력검정시험 합격 등 경로가 있어요','다문화 가족 한국어 봉사에 참여하고, 학점은행제 과정을 알아보세요','가족센터·외국인지원센터 강사 모집, 어학당·온라인 플랫폼 공고를 확인해요',[['🌏','세계와 만나요','다양한 나라 사람을 만나는 즐거움이 있어요.'],['💻','온라인 재택 가능','집에서 해외 학생을 가르칠 수도 있어요.'],['✨','커지는 수요','외국인 주민 증가로 필요해지고 있어요.']]);
DD('중장년 전직지원 컨설턴트','인생 2막의 출발을\n함께 설계하는 길잡이','전직지원 컨설턴트는 퇴직을 앞두거나 새 일을 찾는 중장년의 경력을 정리하고 교육·자격·일자리를 연결해요. 1,000인 이상 기업은 2020년부터 재취업지원서비스 제공이 의무화됐어요.','이력서 고쳐 주는 사람?','지나온 경력에서 강점을 찾고 새로운 길을 함께 설계하는 경력 전문가예요.','중장년내일센터, 전직지원 전문 기업, 대기업 인사팀, 고용센터','주간 근무 중심, 집단 프로그램 진행도 있어요','직업상담사 자격을 우대하는 곳이 많아요. 상담·교육 경력이 중요해요','내 경력을 5년 단위로 정리해 보고, 직업상담사 시험 과목을 살펴보세요','중장년내일센터 채용, 전직지원 기업, 고용24를 확인해요',[['🧭','내 경험이 상담의 힘','경력 전환을 겪어 본 경험이 공감을 만들어요.'],['👥','늘어나는 중장년','퇴직 세대가 늘면서 수요가 커지고 있어요.'],['✨','새로 뜨는 분야','제도와 함께 자리 잡는 전문 직무예요.']]);
DD('맞춤여행 플래너','나만을 위한 여행을\n설계해 주는 사람','맞춤여행 플래너는 손님 취향과 체력에 맞춰 일정·숙소·식당·교통을 짜고 예약을 도와요. AI 검색으로 단순 예약은 줄고 맞춤 기획이 중요해지고 있어요.','패키지 여행 파는 사람?','사람마다 다른 여행을 하나하나 설계하는 기획자예요.','여행사, 맞춤여행 플랫폼, 지역 관광 기업, 프리랜서','재택·프리랜서가 많고 성수기에 바빠요','필수 자격은 없어요. 국내여행안내사 국가자격이 있으면 신뢰를 얻기 좋아요','가족 여행을 AI와 함께 기획해 보고 결과를 블로그에 정리해 보세요','여행 플랫폼 파트너 모집, 지역 관광 기업 채용을 확인해요',[['🗺️','여행 경험이 자산','다녀 본 곳이 모두 노하우가 돼요.'],['🏠','재택 가능','기획과 예약은 집에서 할 수 있어요.'],['🔄','맞춤형으로 진화','AI를 잘 쓰는 플래너가 경쟁력이 있어요.']]);
DD('생활스포츠지도사','동네 운동 교실에\n활력을 불어넣는 사람','생활스포츠지도사는 주민센터·체육관·복지관에서 걷기·요가·생활체조 같은 운동을 가르쳐요. 일자리는 지역과 시설에 따라 차이가 커요.','운동선수 출신만 하는 일?','전문 선수가 아니어도 자격을 갖추고 안전하게 지도하면 돼요.','주민센터, 체육관, 복지관, 공공 체육시설, 노인대학','오전·오후 시간제 수업이 많아요','생활스포츠지도사 국가자격(2급): 필기·실기·구술 시험과 연수를 거쳐요 (국민체육진흥공단 확인)','내가 꾸준히 하는 운동 하나를 정해 친구들과 작은 모임을 이끌어 보세요','지역 체육회·주민센터 강사 모집, 고용24를 확인해요',[['🤸','좋아하는 운동이 일','운동을 즐기는 분께 딱 맞아요.'],['🕘','시간제 수업','하루 몇 시간씩 일할 수 있어요.'],['🧓','어르신 운동 수요','건강 관심이 커지면서 수업이 생겨요.']]);
DD('문화예술교육사','예술로 배움의 즐거움을\n나누는 선생님','문화예술교육사는 도서관·학교·복지관에서 미술·음악·연극·공예 수업을 기획하고 진행해요. 지역 문화재단 사업과 공모에 따라 일감이 달라요.','예술가만 할 수 있다?','예술을 가르치는 기술과 수업 기획력이 더 중요한 교육 전문가예요.','지역 문화재단, 도서관, 학교, 복지관, 문화센터','프로젝트·회기 단위 일이 많아요','문화예술교육사 국가자격(2급): 관련 전공과 지정 과목 이수 등 요건이 있어요 (문화체육관광부·한국문화예술교육진흥원 확인)','동네 도서관 프로그램 보조로 참여하고, 내가 잘하는 예술 활동 하나로 수업안을 만들어 보세요','지역 문화재단 공모, 문화예술교육 강사 모집을 확인해요',[['🎭','재미있게 가르쳐요','좋아하는 예술로 사람들과 만나요.'],['🎓','국가자격 제도','자격으로 전문성을 인정받을 수 있어요.'],['🏛️','지역 사업 기회','문화재단 사업으로 활동 무대가 있어요.']]);
DD('웨딩·이벤트 플래너','인생의 특별한 날을\n완성하는 감독','웨딩·이벤트 플래너는 결혼식·돌잔치·회갑연·작은 행사의 장소·꽃·순서·업체를 정하고 당일 진행을 챙겨요. 작고 맞춤형 행사로 범위가 넓어지고 있어요.','꽃 장식만 하는 사람?','예산, 일정, 업체, 사람을 모두 조율하는 행사 총감독이에요.','웨딩 업체, 이벤트 기획사, 호텔·연회장, 프리랜서','주말 근무가 많고 행사 일정에 맞춰요','필수 자격은 없어요. 행사 진행 경험과 포트폴리오가 중요해요','가족 생일 잔치를 체크리스트로 기획해 보고 사진으로 기록해 보세요','웨딩·이벤트 업체 채용, 프리랜서 플랫폼을 확인해요',[['🎉','특별한 날의 주인공 만들기','행복한 순간을 함께하는 보람이 커요.'],['📸','포트폴리오가 쌓여요','행사 하나하나가 실력 증명이 돼요.'],['🔄','맞춤 행사로 변신','작은 행사 수요가 늘고 있어요.']]);
DD('번역가·통역가','두 언어 사이에\n다리를 놓는 사람','번역가·통역가는 외국어를 우리말로, 우리말을 외국어로 옮겨요. 2025~2035 전망에서 다소 감소(연평균 -1.2%)로 나왔고, AI 번역 확산이 영향을 주고 있어요.','이제 AI가 다 하지 않나요?','단순 번역은 줄지만 AI 번역을 검토하고 다듬는 일, 현장 통역은 여전히 사람이 필요해요.','번역 회사, 기업 해외팀, 공공기관, 프리랜서, 다문화 지원기관','재택·건당 작업이 많고 일감이 불규칙해요','필수 자격은 없어요. 외국어 능력과 전문 분야 지식, 번역 실적이 중요해요','AI 번역 결과를 자연스럽게 고치는 연습을 해 보고, 전문 분야 하나를 정해 보세요','번역 플랫폼, 다문화 지원기관 통번역 모집을 확인해요',[['🔄','AI와 함께 변신','AI 번역 후편집 능력이 새 경쟁력이에요.'],['🏠','재택 가능','집에서 일할 수 있는 대표 직업이에요.'],['⚠️','감소 전망 확인','단순 번역 일감은 줄어들 수 있어 전문 분야가 중요해요.']]);
DD('세무 사무원','세금 신고 시즌의\n숨은 해결사','세무 사무원은 세무사 사무실·회사에서 부가세·종합소득세 신고 자료를 모아 정리하고 고객에게 필요한 서류를 안내해요. 회계사무원은 현 상태 유지, 세무사는 다소 증가 전망이에요.','숫자 입력만 하는 일?','자동화로 입력은 줄고, 자료를 확인하고 고객을 안내하는 일이 중요해지고 있어요.','세무사 사무실, 회계법인, 중소기업 경리팀','주간 사무 근무예요. 1월·5월 등 신고 기간에 바빠요','필수 자격은 없어요. 전산세무·전산회계(국가공인 민간자격)가 취업에 많이 쓰여요','전산회계 2급부터 공부해 보고, 홈택스에서 우리 집 연말정산 자료를 살펴보세요','고용24, 한국세무사회 구인란, 세무사 사무실 공고를 확인해요',[['🧮','자격으로 시작','전산회계 자격으로 진입하기 좋아요.'],['💡','생활에도 도움','세금 지식은 내 살림에도 쓸모 있어요.'],['🔄','확인 업무로 변신','자동화 시대엔 검토 능력이 중요해요.']]);
DD('구매·조달 사무원','회사에 필요한 물건을\n가장 알뜰하게 사는 사람','구매·조달 사무원은 필요한 물품과 서비스의 견적을 비교하고 계약·발주·납품 확인까지 관리해요. 전자조달과 자동 발주로 일하는 방식이 바뀌고 있어요.','물건 주문만 하는 사람?','가격·품질·납기를 따져 회사 돈을 아끼는 협상과 관리 업무예요.','기업 구매팀, 공공기관 계약 부서, 병원·학교 행정실','주간 사무 근무예요','필수 자격은 없어요. 엑셀, 구매 관련 민간 자격, 나라장터 같은 전자조달 이용 경험이 도움이 돼요','생활용품 하나를 정해 3곳 견적 비교표를 엑셀로 만들어 보세요','고용24, 공공기관·기업 채용 공고를 확인해요',[['🛒','장보기 감각 활용','알뜰하게 비교하는 습관이 강점이에요.'],['🏢','일터가 많아요','기업·공공기관·병원 등 다양해요.'],['🔄','전자조달로 변신','시스템을 다룰 줄 알면 경쟁력이 커요.']]);
DD('안내·접수원','건물에 들어온 사람을\n가장 먼저 맞이하는 얼굴','안내·접수원은 병원·회사·기관 입구에서 방문객을 맞아 접수하고 안내해요. 2025~2035 전망에서 다소 감소(연평균 -1.1%)로 나왔고 키오스크·온라인 예약이 늘고 있어요.','앞으로 없어질 일?','줄어드는 중이지만, 키오스크 사용을 돕고 어려운 민원을 안내하는 역할로 바뀌고 있어요.','병원, 기업 로비, 공공기관, 호텔, 문화시설','주간 근무 중심, 병원은 교대가 있을 수 있어요','필수 자격은 없어요. 응대 경험과 디지털 기기 안내 능력이 도움이 돼요','이 경험을 바탕으로 의료 코디네이터, 고객경험 상담사 같은 이웃 직업으로 넓혀 보세요','고용24, 병원·기관 채용 공고를 확인하고 전환 직업도 함께 찾아보세요',[['😊','사람을 만나는 즐거움','밝은 응대 능력은 어디서나 통해요.'],['🔄','디지털 안내로 변신','키오스크 도우미 역할이 새로 생기고 있어요.'],['⚠️','감소 전망 확인','자리가 줄 수 있어 다음 단계 계획이 중요해요.']]);
