.cf-form label b{color:#C0392B;font-weight:500}

<script>
document.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('cf');if(!f)return;var m=document.getElementById('cf-msg'),b=f.querySelector('.cf-send');
f.addEventListener('submit',function(e){e.preventDefault();if(f._honey.value)return;b.disabled=true;m.className='cf-msg';m.textContent='보내는 중입니다…';
var d={};new FormData(f).forEach(function(v,k){if(k!=='_honey')d[k]=v;});d._subject='[홈페이지 강의 문의] '+(d['기관명']||'');d._template='table';d._captcha='false';
fetch('https://formsubmit.co/ajax/dltjwjd59@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(d)})
.then(function(r){return r.json();}).then(function(j){if(j.success==='true'||j.success===true){m.textContent='문의가 접수되었습니다. 확인 후 연락드리겠습니다.';f.reset();}else throw 0;})
.catch(function(){m.className='cf-msg err';m.textContent='전송에 실패했어요. dltjwjd59@gmail.com으로 메일 주시거나 카카오톡으로 문의해 주세요.';})
.finally(function(){b.disabled=false;});});});
</script>

          <div class="cf-row"><label><span>연락처 <b>*</b></span><input name="연락처" type="tel" required placeholder="010-0000-0000"></label><label>이메일<input name="email" type="email" placeholder="답장 받을 메일"></label></div>
          <div class="cf-row"><label>교육 대상 · 인원<input name="교육대상_인원" placeholder="예: 종사자 30명"></label><label>희망 일정 · 시간<input name="희망일정" placeholder="예: 12월 중 3시간"></label></div>
