<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>용인시기흥장애인복지관 AI 업무도우미</title>
<script src="/js/room-gate.js?v=2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--w:#e2865a;--w2:#b45a2c;--wl:#fdf1ea;--wm:#f5d6c3;--g:#2a9d8f;--g2:#1f7268;--gl:#fdf0e6;--gm:#f6d2bb;--ink:#263331;--sub:#66746f;--line:#e4ebe9;--bg:#f7f9f8;--red:#d93a2b;--or:#fff3e6;--orT:#b0601a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;letter-spacing:-.2px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1440px;width:100%;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:0 16px;overflow:hidden}
header{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header{gap:10px}.hbtn{flex:none;white-space:nowrap}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.brand small{font-weight:600;color:var(--sub);font-size:13px;margin-left:4px}
.hbtn{border:0;background:var(--g);border-radius:999px;padding:8px 22px;font-weight:800;font-size:15px;color:#fff;box-shadow:0 2px 6px rgba(42,157,143,.25)}.hbtn:hover{background:var(--g2)}
main{flex:1;min-height:0}
/* home */
.home{height:100%;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hero h1{font-size:22px;letter-spacing:-.8px}
.hero h1 em{font-style:normal;color:var(--g)}
.hero p{font-size:13px;color:var(--sub);letter-spacing:-.4px}
.hero .tip{flex:none;white-space:nowrap;font-size:13px;background:var(--gl);color:var(--g2);border-radius:10px;padding:8px 12px;font-weight:600}
.rows{flex:1;display:grid;grid-template-rows:repeat(5,1fr);gap:10px;min-height:0}
.row{background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:84px minmax(0,1fr);align-items:stretch;overflow:hidden;min-width:0}
.row .lab{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--g2);background:var(--gl);font-size:15px}
.row .tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;padding:8px;min-width:0}
.tile{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;font-size:clamp(14px,1.15vw,17px);letter-spacing:-.5px;color:var(--ink);transition:.15s;text-align:left}
.tile:hover{border-color:var(--g);background:var(--gl)}
.tile .ic{width:32px;height:32px;border-radius:10px;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.tile.app{font-size:15px;justify-content:center}
/* homepage-style home (그룹홈 비서함 틀) */
.hp{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 0 8px;min-height:0}
.hhero{flex:none;background:linear-gradient(90deg,#fdeee2 0%,#fdf6ee 60%,#fbf3ea 100%);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr) 34%;overflow:hidden;color:var(--ink);min-height:150px}
.hhero .tx{padding:18px 24px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.hhero .bdg{font-size:13px;font-weight:800;color:var(--g2);display:flex;align-items:center;gap:6px}
.hhero .kick{font-size:13px;font-weight:700;color:#b0601a}
.hhero h1{font-size:clamp(20px,2vw,28px);letter-spacing:-1px;line-height:1.3;font-weight:800}
.hhero h1 em{font-style:normal;color:var(--g)}
.hhero p.sub{font-size:13.5px;color:var(--sub)}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 12px;max-width:520px;margin-top:6px;color:#8a9692}
.srch input{border:0;outline:0;flex:1;padding:10px 0;font:inherit;font-size:14px;min-width:0;color:var(--ink)}
.hhero .ph{background:url(/img/giheung/hero-sprout.webp) center 45%/cover no-repeat}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.col h3{font-size:16px;font-weight:800;letter-spacing:-.5px;padding-bottom:7px;border-bottom:2px solid var(--w);display:flex;justify-content:space-between;align-items:center}
.col h3 small{font-size:12px;color:var(--sub);font-weight:700}
.ol{list-style:none;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column}
.ol li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700;letter-spacing:-.4px}
.ol li .no{width:20px;color:var(--sub);font-weight:600;font-size:13px;text-align:center}
.ol li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ol li .nm:hover{color:var(--g2);text-decoration:underline}
.ol li .tg{font-size:11.5px;font-weight:800;color:var(--ink);background:var(--wl);border:1px solid var(--wm);border-radius:6px;padding:2px 7px}
.ob{border:0;background:var(--g);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px}
.qg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.q{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 4px;min-height:92px;color:var(--ink)}
.q svg{width:24px;height:24px;color:var(--g)}.q:nth-child(even) svg{color:var(--w)}
.q b{font-size:14px;font-weight:800;letter-spacing:-.5px}
.q span{font-size:11.5px;color:var(--sub);letter-spacing:-.4px;white-space:nowrap}
.q:hover,.q.on{border-color:var(--g);background:var(--gl)}
.aig{margin-top:auto;border:1px solid var(--wm);background:var(--wl);border-radius:10px;padding:8px 10px}
.aig .t{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:6px;display:flex;justify-content:space-between}
.aig .t small{font-weight:600;color:var(--sub)}
.aig .r{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.aig button{border:1px solid var(--wm);background:#fff;border-radius:8px;padding:7px 2px;font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aig button:hover{border-color:var(--g);color:var(--g2)}
.lk{list-style:none;overflow:auto;min-height:0;flex:1}
.lk .sec{font-size:12.5px;font-weight:800;color:var(--sub);margin:6px 0 2px}
.lk .sec:first-child{margin-top:0}
.lk a{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;font-weight:800;letter-spacing:-.4px}
.lk a span{font-size:12px;color:var(--sub);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk a:hover{color:var(--g2)}
.ghelp{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--sub);letter-spacing:-.3px}
.ghelp b{color:var(--w2)}
.gfoot{flex:none;background:#2c3634;color:#dfe7e5;margin:0 -16px;padding:9px 24px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;letter-spacing:-.3px}
.gfoot .r{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.gfoot b{color:#fff}.gfoot a{color:#fff;text-decoration:none;font-weight:700}
.gfoot .cp{border:1px solid #66746f;background:none;color:#fff;border-radius:5px;padding:0 6px;font-size:11.5px}
/* 하나로 입력 */
.ibox{border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}
.ibox:focus-within{border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.ibox textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;font:inherit;font-size:14px;line-height:1.9;padding:8px 12px 4px;min-height:120px;color:var(--ink)}
.ibox .ft{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 12px;font-size:12px;color:#8a9692}
@media (max-width:900px){.hhero{grid-template-columns:1fr}.hhero .ph{display:none}.cols{grid-template-columns:1fr}.gfoot{margin:0}}
/* view */
.view{height:100%;display:grid;grid-template-columns:minmax(300px,32%) minmax(0,1fr);gap:12px;padding-bottom:6px}
.pane{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column}
.pane .hd{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex:none}
.pane .hd h2{font-size:18px;letter-spacing:-.6px}
.back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.pane .bd{padding:4px 16px 14px;overflow:auto;min-height:0;flex:1}
.pane .bd::-webkit-scrollbar{width:6px}.pane .bd::-webkit-scrollbar-thumb{background:#d6ddd9;border-radius:4px}
.gl{font-size:12.5px;font-weight:800;color:var(--w2);margin:8px 0 4px;letter-spacing:-.3px}
.gl:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.chip:hover{border-color:var(--g)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.big{font-size:14.5px;padding:7px 12px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-size:14.5px;font-weight:800;color:var(--sub)}
.tab.on{background:var(--wl);border-color:var(--w);color:var(--w2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 6px}
.fl{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff}
.fl label{font-size:13px;font-weight:700;color:var(--g2);padding:0 0 0 10px;white-space:nowrap}
.fl input,.fl textarea{border:0;outline:0;flex:1;padding:7px 8px;font:inherit;font-size:14px;background:transparent;min-width:0;resize:none}
.fl:focus-within{border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.mic{border:0;background:var(--gl);color:var(--g2);border-radius:6px;margin:3px;padding:4px 8px;font-size:12px;font-weight:700}
.mic.rec{background:var(--red);color:#fff}
.ex{font-size:12px;color:#8a9590;margin:-2px 0 6px 2px;letter-spacing:-.3px}
.steps{display:flex;flex-direction:column;gap:5px}
.st{display:flex;gap:8px;align-items:flex-start;font-size:14px;letter-spacing:-.4px}
.st b.n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{font-size:12.5px;color:var(--orT);background:var(--or);border-radius:8px;padding:6px 10px;margin-top:8px;letter-spacing:-.3px}
.list{font-size:13px;color:var(--sub);padding-left:16px;letter-spacing:-.3px}
/* right */
.bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.bar .t{font-weight:800;font-size:16px;margin-right:auto;letter-spacing:-.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:800;color:var(--ink)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn:hover{border-color:var(--g)}
.out{padding:14px 18px;overflow:auto;flex:1;min-height:0;font-size:15px;line-height:1.75;white-space:pre-wrap;letter-spacing:-.3px}
.out mark,.pbox mark{border-radius:3px;background:#fff3a0;color:var(--ink);font-weight:800;padding:0 1px}
.out .h{font-weight:800;color:var(--w2)}
.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;flex:1;min-height:0}
.box{border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.box .bh{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.box .bh .sp{margin-left:auto}
.box .bb{padding:8px 12px;overflow:auto;white-space:pre-wrap;font-size:13.5px;line-height:1.7;flex:1;min-height:0;letter-spacing:-.3px}
.sm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
table.form{width:100%;border-collapse:collapse;font-size:14px;white-space:normal}
table.form th{background:var(--gl);color:var(--g2);font-weight:800;width:120px;text-align:left;padding:7px 10px;border:1px solid var(--gm);vertical-align:top;letter-spacing:-.4px}
table.form td{padding:7px 10px;border:1px solid var(--gm);vertical-align:top;line-height:1.6}
.ftitle{text-align:center;font-weight:900;font-size:19px;letter-spacing:4px;margin:2px 0 10px}
.cards5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;white-space:normal}
.c5{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;line-height:1.6;letter-spacing:-.3px}
.c5 b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px;letter-spacing:-.5px}
.c5 i{font-style:normal;font-weight:800;color:var(--sub);font-size:12px}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:5px}
.free{background:#e3f3e5;color:#2d6b36}.paid{background:var(--or);color:var(--orT)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;font-weight:800;font-size:14px;letter-spacing:-.4px}
.fc.on{border:2px solid var(--g);background:var(--gl);padding:7px 9px}
.subtabs{display:flex;gap:4px;padding:8px 14px 0;flex:none}
.stab{border:0;border-bottom:3px solid transparent;background:none;padding:6px 12px;font-weight:800;font-size:14.5px;color:var(--sub)}
.stab.on{color:var(--w2);border-color:var(--w)}
.red{color:var(--red);font-weight:900;font-size:19px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;white-space:normal;margin-bottom:12px}
.cmp>div{border:1px solid var(--line);border-radius:12px;padding:12px}
.cmp h4{font-size:16px;margin-bottom:6px}
.cmp ul{padding-left:18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:900px){
 .wrap{height:auto;min-height:100vh}
 .rows{grid-template-rows:none}.row{grid-template-columns:1fr}.row .lab{padding:6px}
 .row .tiles{grid-auto-flow:row;grid-template-columns:1fr 1fr}.tile{padding:14px}
 .view{grid-template-columns:1fr;height:auto}.pane .bd,.out{overflow:visible}
 .grid4{grid-template-columns:1fr;grid-template-rows:none}.box .bb{max-height:300px}
 .cards5{grid-template-columns:1fr 1fr}.hero{flex-direction:column;align-items:flex-start;gap:6px}
 body{font-size:16px}
}
/* ===== 졸라맨 v3: 상황별 동작 ===== */
.jx-fig{flex:none;width:96px;height:104px;overflow:visible}
.jx-fig.big{width:150px;height:162px}
.jx-fig *{stroke:#26332d;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.jx-fig .face *{stroke-width:2.4}
.jx-fig .eye{fill:#26332d;stroke:none}
.jx-fig .hand{fill:#26332d;stroke:none;transform-box:fill-box;transform-origin:center}
.jx-fig .cheek{fill:#f6b4a0;stroke:none;opacity:.85}
.jx-fig .heart{fill:#e8603c;stroke:none;transform-box:fill-box;transform-origin:center;animation:fgFloat 2.2s ease-in-out infinite}
.jx-fig .h2{animation-delay:1.1s}
.jx-fig .spark{stroke:#f3b521;stroke-width:2.8;animation:fgBlink .8s ease-in-out infinite}
.jx-fig .steam{stroke:#9aa7a1;stroke-width:2.4;transform-box:fill-box;transform-origin:bottom;animation:fgSteam 1s ease-out infinite}
.jx-fig .s2{animation-delay:.35s}.jx-fig .s3{animation-delay:.18s}
.jx-fig .lid{fill:#e8603c;stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:fgLid .9s ease-in-out infinite}
.jx-fig .bl{fill:#E0D4C2;stroke:#2f6b56;stroke-width:2.2;transform-box:fill-box;transform-origin:center}
.jx-fig .txt,.jx-fig .note,.jx-fig .zz{fill:#2f6b56;stroke:none;font:800 13px sans-serif}
.jx-fig .zz{fill:#5d6f66}
.jx-fig .drop{fill:#7fb4e0;stroke:none;animation:fgDrop 1.4s ease-in infinite}
.jx-fig .cloud path{fill:#d7dde2;stroke:#8a97a0;stroke-width:2}
.jx-fig .rain path{stroke:#7fb4e0;stroke-width:2.2;animation:fgRain .9s linear infinite}
.jx-fig .cup{fill:#f3c94b;stroke-width:2.2}
.jx-fig .stm path{stroke:#9aa7a1;stroke-width:2;animation:fgSteam 1.4s ease-out infinite}
.jx-fig .win{stroke:#BAB0A1;stroke-width:2.2;fill:#F5F3EF}
.jx-fig .warm path{stroke:#f3b521;stroke-width:2.2;animation:fgBlink 1.6s ease-in-out infinite}
.jx-fig .who{transform-box:view-box;transform-origin:60px 118px}
.jx-fig .hd{transform-box:view-box;transform-origin:60px 39px}
.jx-fig .aL,.jx-fig .aR{transform-box:view-box;transform-origin:60px 46px}
.jx-fig .lL,.jx-fig .lR{transform-box:view-box;transform-origin:60px 84px}
/* 숨 고르기: 4초 들이쉬기(배·팔 올라감) → 4초 멈춤 → 6초 내쉬기(배 줄어듦·입김) = 14초 */
.jx-fig.p-breath .bl{animation:fgBelly 14s ease-in-out infinite}
.jx-fig.p-breath .aL{animation:fgArmL 14s ease-in-out infinite}
.jx-fig.p-breath .aR{animation:fgArmR 14s ease-in-out infinite}
.jx-fig.p-breath .air-in{animation:fgIn 14s linear infinite}
.jx-fig.p-breath .air-out{animation:fgOut 14s linear infinite}
.jx-fig.p-breath .m-c{animation:fgMc 14s linear infinite}
.jx-fig.p-breath .m-o{animation:fgOut 14s linear infinite}
.jx-fig.p-breath.go .bl,.jx-fig.p-breath.go .aL,.jx-fig.p-breath.go .aR,.jx-fig.p-breath.go .air-in,.jx-fig.p-breath.go .air-out,.jx-fig.p-breath.go .m-c,.jx-fig.p-breath.go .m-o{animation-iteration-count:3}
.jx-fig .air-in path{stroke:#2f6b56;stroke-width:2.4}.jx-fig .air-out path,.jx-fig .air-out2 path{stroke:#7fb4e0;stroke-width:2.4}
@keyframes fgBelly{0%{transform:scale(1)}28.6%{transform:scale(2.5)}57%{transform:scale(2.5)}100%{transform:scale(1)}}
@keyframes fgArmL{0%{transform:rotate(0)}28.6%,57%{transform:rotate(32deg)}100%{transform:rotate(0)}}
@keyframes fgArmR{0%{transform:rotate(0)}28.6%,57%{transform:rotate(-32deg)}100%{transform:rotate(0)}}
@keyframes fgIn{0%,26%{opacity:1}29%,100%{opacity:0}}
@keyframes fgOut{0%,56%{opacity:0}58%,98%{opacity:1}100%{opacity:0}}
@keyframes fgMc{0%,56%{opacity:1}58%,98%{opacity:0}100%{opacity:1}}

.aig{--g:#14663F;--b:#1D4FA8;--p:#6B27D9;--o:#B33A0C;--ink:#111111;--mu:#23362C;--ln:#C3BDB3;color:var(--ink);font-size:15.7px;line-height:1.55}

function pjInstr(d){const b=BN(),p=P(),D=PJ[d];
 if(d===2)return `# ${ORG} 홍보물 제작 지침\n## 역할\n너는 ${D.role}다.\n${D.ctx(b,p)}\n## 제작 순서 (반드시 지킴)\n① 홍보물 선택 → ② 기본정보 입력 → ③ 기획안 2가지 → ④ 디자인 스타일 선택(=승인) → ⑤ 제작 및 검수\n이미 받은 정보는 다시 묻지 않는다. 기획안과 스타일 선택 전에는 이미지를 만들지 않는다.\n## ① 홍보물 선택\n선택형으로 묻는다: 1. 카드뉴스 2. 포스터 3. 인포그래픽 4. 쉬운 글 안내문 5. 사진 홍보 이미지 6. 현수막 7. 기타\n## ② 기본정보 입력\n아래 [기본정보 틀]을 채우게 한다. 첫 메시지에 틀이 채워져 있으면 다시 묻지 않는다. 없으면 틀을 보여 주고 멈춘다.\n[기본정보 틀]\n${PR_FORM.join('\n')}\n- 받은 정보는 "프로그램 기본정보" 요약 상자로 보여 주고 바로 ③으로 넘어간다.\n## ③ 기획안 제안\n이미지를 만들지 말고 방향이 서로 다른 기획안 2가지(1안·2안)를 보여 주고 고르게 한다.\n- 기본 설정: 제작물, 목적, 프로그램명, 대상, 추천 장수, 계절, 전체 분위기\n- 이미지별 구성: [역할 / 화면 구성(배경·인물·행동·소품·글자 배치) / 들어갈 문구 / 포인트]\n- 카드뉴스: 표지 → 프로그램 소개 → 핵심 정보 → 신청 방법 → 참여 독려\n- 포스터: 제목 → 대표 이미지 → 행사 정보 → 신청 안내 → 기관 정보 자리\n## ④ 디자인 스타일 선택 (= 승인)\n아래 6가지를 선택형으로 보여 주고, 목적·대상에 맞는 2가지에 "추천"을 표시한다.\n1. 따뜻한 일러스트형 2. 따뜻한 실사형 3. 깔끔한 안내형(큰 글씨·고대비) 4. 동화책 수채화형 5. 입체 캐릭터형 6. 감성 콜라주형\n## ⑤ 제작 및 검수\n- 스타일을 고르면 승인으로 보고, 기획안의 이미지를 한 장씩 따로 만든다. 색감·캐릭터·글자 분위기를 통일한다.\n- 다 만들면 프로그램명·일정·대상·장소·신청 방법·연락처가 기획안과 같은지, 오탈자·글자 잘림이 없는지 검수표로 보여 준다.\n## 지킬 것\n- 날짜·장소·인원·연락처·선착순 여부는 지어내지 말고 [확인 필요]로 둔다.\n- 장애인 이용자를 활동의 주인공으로, 동정·시혜적 표현 금지. 큰 글씨·고대비·쉬운 말.\n- 실제 인물·다른 회사 캐릭터는 그리지 않는다. 게시 동의가 확인된 사진만 쓴다.`;
 return `너는 ${D.role}야.\n${D.ctx(b,p)}\n- [범위] ${DOCS[d]}만 작성한다. 다른 문서 요청은 "해당 업무 프로젝트에서 요청해 주세요"로 안내한다. 우리 기관 서식을 그대로 따르고, 없으면 ${D.base}으로 쓴다.\n- [1단계·첫 답변] 소스의 ${D.cmp}을 서식 항목별로 비교해 표 하나로 요약한다: | 항목 | 잘된 점(유지) | 문제점 | 올해 추가·보완 | 지침상 추가/삭제 | 이유·근거(자료명·쪽) | 작성 가이드 |\n- [2단계·첫 답변] 추가하면 좋은 자료를 표로 제시한다: | 자료 | 필요한 이유 | 없을 때 |\n- [3단계] "추가할 정보·자료가 있나요?" "서식에 맞게 초안을 작성할까요?" 두 가지만 묻고 답을 기다린다.\n- [4단계·확인] 작성 전에 자료로 확인되지 않는 꼭 필요한 예산·수치(목표·인원·금액·기간 등)만 제안값과 함께 한 번에 묻는다. 답을 받으면 더 묻지 않고 초안으로 넘어간다. 꼭 필요하지 않은 칸은 묻지 않고 [확인 필요]로 둔다.\n- [5단계·초안] 서식 항목·순서·표 그대로 작성하고, 항목 끝에 "▶ 반영: 전년도 → 올해"를 단다.\n- [6단계] ${D.rv} 입장에서 핵심 문제점 브리핑 → 승인하면 최종본(▶ 줄 삭제) → 한글(.hwpx) 파일. 실패하면 알리고 워드(.docx)로 만든다.\n- [금지] 자료에 없는 숫자·날짜·실적은 만들지 않고 [확인 필요]로 둔다. 서식에 없는 항목은 만들지 않는다. 개인정보는 가명(이용자A)으로 쓴다.\n- [필수] 근거 문장 끝에 (자료명·쪽), 계산은 계산식 표시, 문체는 개조식 공문체(~함, ~임).\n- ${D.extra.join('\n- ')}`}
function pjFirst(d){const b=BN(),p=P(),D=PJ[d],chk=D.src.filter((s,i)=>S['pjc'+d+'_'+i]).map(s=>s[0]);
 if(d===2)return `너는 ${D.role}야.\n${ORG} ${b}(${p}) 홍보물을 만들 거야.\n이 프로젝트 지침을 반드시 먼저 확인하고, 지침의 순서와 규칙을 그대로 따라 줘.\n지침 순서 (요약): ① 홍보물 선택 → ② 기본정보 → ③ 기획안 2가지 → ④ 스타일 선택 → ⑤ 제작·검수\n소스에 첨부된 참고 자료를 모두 조사해서 활용하고, 부족한 자료나 정보는 나에게 먼저 물어본 뒤 만들어 줘.${chk.length?'\n내가 소스에 넣은 자료: '+chk.join(', '):''}\n[기본정보 틀]\n${PR_FORM.join('\n')}`;
 return `너는 ${D.role}야.\n올해 ${ORG} ${b}(${p}) ${DOCS[d]}를 작성할 거야.\n이 프로젝트 지침을 반드시 먼저 확인하고, 지침의 순서와 규칙을 그대로 따라 줘.\n지침 순서 (요약)\n1. 분석 요약 표: 항목별 잘된 점·문제점·올해 추가·보완·지침상 추가/삭제·이유·근거·작성 가이드\n2. 추가하면 좋은 자료 표\n3. "추가할 자료가 있나요?" "초안을 작성할까요?" 묻고 기다리기 (1~3은 첫 답변에 한 번에)\n4. 꼭 필요한 예산·수치만 제안값과 함께 한 번에 확인\n5. 서식 그대로 초안 (▶ 반영 표시) → 6. ${D.rv} 검토 → 한글(.hwpx) 파일\n비교 대상: ${D.cmp}\n지킬 것: 자료에 없는 숫자는 [확인 필요] · 근거 끝에 (자료명·쪽) · 개조식 공문체 · 이용자는 가명${chk.length?'\n내가 소스에 넣은 자료: '+chk.join(', '):''}`}
function pjHtml(t,d,first){const L=t.split('\n').filter(x=>x.trim()),D=PJ[d];
 const note=(i,l)=>i===0?'<b>역할</b> 누가 쓰느냐에 따라 글 수준이 달라져요. 다른 업무에는 이 부분만 그 업무 전문가로 바꾸세요.':i===1?(first?'<b>첫 대화</b> 지침과 같은 역할을 주고, 지침을 다시 한번 요약해서 확인시켜요. 그래야 순서대로 정확하게 나와요.':'<b>맥락</b> 무슨 사업의 무엇을 만드는지 알려 줘야 엉뚱한 답이 안 나와요. 위에서 사업을 바꾸면 자동으로 바뀌어요.'):'';
 let head=0;if(d===2&&!first){head=L.findIndex(x=>x.startsWith('너는'))}
 return `<div class="ins">${L.map((l,i)=>{const k=d===2&&!first?(i===head?0:i===head+1?1:-1):(i<2?i:-1);const h=k>=0?`<mark class="hl">${esc(l)}</mark>`:esc(l).replace(/^(#+ .*)$/,'<b>$1</b>').replace(/^(- \[[^\]]+\])/,'<b>$1</b>').replace(/\[확인 필요\]/g,'<u>[확인 필요]</u>');return k>=0?`<div class="r"><div>${h}</div><div class="note">${note(k)}</div></div>`:`<div class="r solo"><div>${h}</div></div>`}).join('')}</div>`}

 return view('업무 프로젝트',
 `<div class="ptabs">${DOCS.map((x,i)=>`<button class="pt${d==i?' on':''}" onclick="setS('doc',${i})">${x}</button>`).join('')}</div>${bizPick()}
 <p class="pjw"><b>${DOCS[d]} 프로젝트</b> · 언제 여나요? ${D.when}</p>
 <section class="pjs"><h4><span>1</span>프로젝트 만들기<button class="sm sp" onclick="copyTxt('${DOCS[d]} 프로젝트 - '+BN())">이름 복사</button></h4><div class="pjn">프로젝트 이름: <b>${DOCS[d]} 프로젝트 - ${esc(BN())}</b></div><ol class="pjo"><li>ChatGPT 왼쪽 메뉴 <b>프로젝트 → 새 프로젝트</b></li><li>이름 붙여 넣고 만들기 · 메모리는 <b>프로젝트 전용</b></li><li>오른쪽 <b>② 지침</b>을 프로젝트 <b>지침</b> 칸에 붙여 넣기</li></ol></section>
 <section class="pjs"><h4><span>3</span>소스에 넣으면 좋은 자료 <small>넣은 것에 체크하면 첫 프롬프트에 들어가요</small></h4><table class="pjsrc">${D.src.map((s,i)=>`<tr><td><input type="checkbox" ${S['pjc'+d+'_'+i]?'checked':''} onchange="S['pjc${d}_${i}']=this.checked;save();RIGHT()"></td><td><b>${esc(s[0])}</b>${s[2]?'<em>꼭 넣기</em>':''}<br><span>${esc(s[1])}</span></td></tr>`).join('')}</table><div class="pjno"><b>넣지 마세요</b> ${esc(D.no)}</div><div class="hwpn"><b>한글(HWP) 파일 주의</b> Claude·제미나이는 HWP를 못 읽어요 → <u>PDF로 저장</u>해 넣기 · 서식에 채워 받을 땐 <u>HWPX로 저장</u> (ChatGPT는 HWP도 읽어요)</div></section>`,
 ()=>{const t=S.ps?pjFirst(d):pjInstr(d);CUR=()=>t;return `<div class="ptabs r"><button class="pt${S.ps?'':' on'}" onclick="S.ps=0;save();RIGHT()">② 프로젝트 지침</button><button class="pt${S.ps?' on':''}" onclick="S.ps=1;save();RIGHT()">④ 첫 대화 프롬프트</button></div>`+aiBar(S.ps?'프로젝트 안 새 채팅에 붙여 넣기':'프로젝트 지침 칸에 붙여 넣기 · 노란색이 핵심',()=>t)+`<div class="out" style="white-space:normal">${pjHtml(t,d,S.ps)}${S.ps&&d<2?'<div class="pjafter"><b>AI 첫 답변 모양</b> ① 분석 요약 표 ② 추가하면 좋은 자료 표 ③ "추가할 자료가 있나요?" → "초안을 작성할까요?"<br><b>이후 진행</b> 자료를 더 넣거나 「작성해 줘」 → 꼭 필요한 수치만 확인 → 초안(▶ 반영) → 검토 → 한글 파일. 고칠 곳은 말로 요청하세요.</div>':''}<div class="pjafter"><b>다른 업무에 응용하기</b> 노란색 두 줄(역할·맥락)만 바꾸면 다른 업무 프로젝트가 돼요. 나머지 규칙은 그대로 두세요.</div></div>`})};
const xe = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wRun(text,{bold,size}={}){
  const rpr=`<w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/>${bold?"<w:b/>":""}${size?`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`:""}</w:rPr>`;
  return String(text).split("\n").map((t,i)=>`${i?"<w:r><w:br/></w:r>":""}<w:r>${rpr}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join("");
}
function wP(text,{bold,size,align,indent,spacing,pad}={}){
  return `<w:p><w:pPr>${pad?`<w:spacing w:before="${pad}" w:after="${pad}"/>`:spacing!==undefined?`<w:spacing w:after="${spacing}"/>`:""}${align?`<w:jc w:val="${align}"/>`:""}${indent?`<w:ind w:left="${indent*220}"/>`:""}</w:pPr>${wRun(text,{bold,size})}</w:p>`;
}
function blocksDocx(B){
  return B.map(b=>{
    if(b.t==="title") return wP(b.text,{bold:1,size:34,align:"center",spacing:200});
    if(b.t==="approval") return apprDocx(b.labels);
    if(b.t==="sign") return wP(b.date,{align:"right",spacing:60})+wP(`작성자  ${b.name||"            "}  (서명)`,{align:"right",spacing:0});
    if(b.t==="center") return wP(b.text,{bold:b.bold,size:b.size||22,align:"center"});
    if(b.t==="line") return `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="333333"/></w:pBdr></w:pPr></w:p>`;
    if(b.t==="gap") return `<w:p/>`;
    if(b.t==="p") return wP(b.text,{bold:b.bold,size:22,indent:b.indent});
    if(b.t==="table"){
      const cols=Math.max(...b.rows.map(r=>r.reduce((n,c)=>n+(c.span||1),0)));
      const W=9000, cw=Math.floor(W/cols), WS=b.w&&b.w.length===cols?(()=>{ const t=b.w.reduce((a,x)=>a+x,0); return b.w.map(x=>Math.floor(W*x/t)); })():null;
      const grid=`<w:tblGrid>${(WS||Array(cols).fill(cw)).map(x=>`<w:gridCol w:w="${x}"/>`).join("")}</w:tblGrid>`;
      const bd=`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="6" w:space="0" w:color="555555"/>`).join("")}</w:tblBorders>`;
      return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>${bd}<w:tblLayout w:type="fixed"/></w:tblPr>${grid}${b.rows.map(r=>`<w:tr>${r.map((c,ci)=>`<w:tc><w:tcPr><w:tcW w:w="${WS&&!c.span?WS[ci]:cw*(c.span||1)}" w:type="dxa"/>${c.span?`<w:gridSpan w:val="${c.span}"/>`:""}${c.label?`<w:shd w:val="clear" w:color="auto" w:fill="EEF2EA"/><w:vAlign w:val="center"/>`:""}${c.q?`<w:shd w:val="clear" w:color="auto" w:fill="E6F4EE"/>`:""}${c.opt?`<w:vAlign w:val="center"/>`:""}</w:tcPr>${wP(c.text||"",{bold:c.label||c.q,size:c.q?26:c.opt?22:20,align:(c.label||c.opt)?"center":undefined,spacing:0,pad:c.q?100:c.opt?80:c.tall?110:0})}</w:tc>`).join("")}</w:tr>`).join("")}</w:tbl><w:p/>`;
    }
    return "";
  }).join("");
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zipStore(entries){ /* entries: [[name, Uint8Array|string]] */
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const [name,data0] of entries){
    const data=typeof data0==="string"?enc.encode(data0):data0, nb=enc.encode(name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nb); off+=30+nb.length+data.length;
  }
  const cs=cen.reduce((n,a)=>n+a.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)]);
}

async function saveFile(name,blob,statusEl){
  const say=(m,w)=>{ if(statusEl){ statusEl.textContent=m; statusEl.classList.toggle("warn",!!w);} };
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:name,data:blob}); say("내려받았어요. 다운로드 폴더를 확인해 보세요."); return; }
  }catch(e){ if(e&&e.code==="declined"){ say("저장을 취소했어요."); return; } }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    say("내려받았어요. 다운로드 폴더를 확인해 보세요.");
  }catch(e){ say("이 화면에서는 파일을 내려받을 수 없어요. '전체 복사'로 붙여 넣어 쓰세요.",true); }
}

/* ================= ② 계획·일지 (선택 → 서술형) ================= */
const KIND={
'만들기':{goal:'손으로 직접 만들며 성취감을 느끼고, 서로의 작품을 소개하며 대화와 관계를 넓힌다',items:['재료(색지·풀·가위·꾸미기 재료)','앞치마·물티슈','작품 말릴 자리','사진 찍을 기기'],steps:[['도입',10,'인사를 나누고 오늘 만들 작품을 완성 사진과 그림 카드로 소개한다'],['시범',10,'만드는 순서를 3단계로 나누어 담당자가 천천히 시범을 보이고 참여자가 따라 해 보도록 한다'],['활동',40,'참여자가 색과 재료를 직접 고르고, 손 기능에 따라 담당자·봉사자가 필요한 부분만 도와 각자 작품을 완성한다'],['나눔',15,'완성한 작품을 한 사람씩 소개하고 서로 잘한 점을 칭찬하며 사진으로 남긴다']],safe:['가위·글루건은 담당자가 곁에서 함께 사용','작은 재료를 입에 넣지 않도록 관찰'],eff:'소근육 사용과 끝까지 완성하는 경험으로 자신감이 높아지고, 작품을 매개로 자연스러운 대화가 늘어날 것이다'},
'요리·간식':{goal:'함께 음식을 만들고 나누며 일상생활 기술과 자신감을 기른다',items:['식재료','조리도구·위생장갑·앞치마','손 소독제','나눠 담을 그릇'],steps:[['도입',10,'손을 씻고 앞치마를 입은 뒤 오늘 만들 음식을 사진 카드로 소개한다'],['준비',10,'재료를 함께 살펴보고 씻기·자르기·섞기 역할을 참여자 선택으로 나눈다'],['활동',40,'단계별 그림 순서표를 보며 함께 조리하고, 불과 칼은 담당자가 곁에서 지원한다'],['나눔',20,'완성한 음식을 함께 먹으며 맛과 소감을 나누고 설거지와 정리까지 함께한다']],safe:['불·칼은 담당자가 곁에서 함께 사용','알레르기·식이 조절 필요 여부 사전 확인','뜨거운 음식은 식혀서 나누기'],eff:'스스로 음식을 만들어 보는 경험으로 생활 자립 기술이 늘고, 함께 먹는 시간을 통해 관계가 깊어질 것이다'},
'음악·노래':{goal:'좋아하는 음악을 함께 즐기며 감정을 표현하고 즐거운 소통의 시간을 나눈다',items:['스피커·노래 목록','탬버린·캐스터네츠 등 리듬 악기','큰 글씨 가사판'],steps:[['도입',10,'좋아하는 노래를 그림 카드로 고르며 오늘 부를 곡을 함께 정한다'],['활동',25,'가사판을 보며 따라 부르고 박자에 맞춰 몸을 움직인다'],['연주',20,'리듬 악기를 하나씩 골라 노래에 맞춰 함께 연주해 본다'],['나눔',10,'가장 즐거웠던 노래와 기분을 표정 카드로 나눈다']],safe:['큰 소리에 예민한 분은 자리 조정','바닥 정리로 넘어짐 예방'],eff:'음악을 통해 감정을 편안하게 표현하고, 함께 연주하는 경험으로 소속감이 높아질 것이다'},
'운동·산책':{goal:'몸을 함께 움직이며 체력을 기르고 활기찬 일상 리듬을 만든다',items:['편한 신발·모자','물','구급함','비상 연락 휴대폰'],steps:[['도입',10,'컨디션을 확인하고 음악에 맞춰 준비 운동을 한다'],['활동',30,'각자 속도에 맞춰 걷기와 가벼운 운동을 하며 중간중간 물을 마신다'],['휴식',10,'그늘에서 쉬며 오늘 본 것과 느낌을 이야기한다'],['마무리',10,'스트레칭으로 몸을 풀고 다음 활동을 안내한다']],safe:['날씨·미세먼지 확인','무리하지 않게 중간 휴식','보행 지원이 필요한 분 곁에 인력 배치'],eff:'규칙적인 신체 활동으로 체력이 유지되고, 함께 걷는 시간을 통해 정서적 안정감이 높아질 것이다'},
'원예·텃밭':{goal:'식물을 함께 가꾸며 책임감과 기다리는 즐거움을 경험한다',items:['모종·씨앗·흙','장갑·모종삽·물뿌리개','이름표'],steps:[['도입',10,'오늘 심을 식물을 실물과 사진으로 보여 주고 이름을 함께 알아본다'],['활동',30,'흙을 만져 보고 모종을 심은 뒤 물을 주며 식물을 돌본다'],['꾸미기',10,'자기 화분에 이름표를 붙이고 사진으로 남긴다'],['마무리',10,'손을 씻고 다음 주에 확인할 것을 함께 약속한다']],safe:['흙 만진 뒤 손 씻기','모종삽 사용 시 곁에서 지원'],eff:'식물을 돌보는 경험으로 책임감이 생기고, 자라는 모습을 보며 성취감과 정서 안정을 얻을 것이다'},
'지역사회 나들이':{goal:'지역사회 시설을 직접 이용하며 이동·이용 경험과 사회 참여 기회를 넓힌다',items:['이동 차량·교통카드','복지카드(할인 확인)','물·간식','구급함'],steps:[['준비',10,'출발 전 화장실과 준비물을 확인하고 오늘 갈 곳을 사진으로 안내한다'],['이동',20,'대중교통 또는 차량으로 이동하며 안전 수칙을 함께 지킨다'],['활동',60,'목적지에서 직접 고르고 이용해 보며 필요한 부분만 지원한다'],['나눔',15,'복귀 후 좋았던 점과 다시 가 보고 싶은 곳을 나눈다']],safe:['경사로·엘리베이터·화장실 위치 사전 확인','이동 중 인원 수시 확인','2인 1조 이동'],eff:'지역사회 시설을 스스로 이용해 보는 경험으로 자신감이 생기고, 지역 주민과 자연스럽게 만나는 기회가 늘어날 것이다'},
'일상생활 기술':{goal:'스스로 할 수 있는 생활 기술을 단계별로 연습해 자립 역량을 기른다',items:['연습 도구(옷·수건·생활용품)','단계별 그림 순서표','칭찬 스티커'],steps:[['도입',10,'오늘 연습할 생활 기술을 사진과 시범으로 보여 준다'],['연습',30,'그림 순서표를 보며 한 단계씩 직접 해 보고 필요할 때만 도움을 준다'],['확인',10,'스스로 해낸 단계를 함께 체크하고 칭찬 스티커를 붙인다'],['연계',10,'가정에서도 연습할 수 있도록 보호자 안내 내용을 정리한다']],safe:['참여자 속도 존중, 대신 해 주지 않기','미끄럼·뜨거운 물 주의'],eff:'반복 연습으로 스스로 할 수 있는 일이 늘어나 일상 자립도가 높아질 것이다'},
'그룹치료':{goal:'또래와 함께하는 구조화된 활동으로 의사소통·인지·사회성 목표를 향상한다',items:['회기별 교구','그림 카드·AAC 도구','관찰 기록지'],steps:[['도입',5,'인사 노래와 컨디션 확인으로 회기를 시작한다'],['활동',30,'개별 목표에 맞춘 구조화 활동을 차례 지키기·요청하기와 함께 진행한다'],['연습',10,'배운 표현이나 행동을 또래와 짝을 지어 다시 연습한다'],['마무리',5,'오늘 잘한 점을 칭찬하고 보호자에게 회기 내용을 공유한다']],safe:['감각 자극에 예민한 아동 자리·소리 조정','교구 삼킴 주의'],eff:'또래와의 상호작용 속에서 목표 행동이 일반화되고, 보호자 공유로 가정 연계가 강화될 것이다'},
'직업훈련·작업':{goal:'실제 직무와 비슷한 작업을 연습해 작업 태도와 직무 기술을 기른다',items:['작업 재료·도구','작업 순서표','작업 기록표'],steps:[['도입',10,'오늘 할 작업과 목표 수량을 순서표로 안내한다'],['시범',10,'작업 과정을 단계별로 시범 보이고 품질 기준을 함께 확인한다'],['작업',50,'각자 맡은 작업을 하며 정확성과 속도를 스스로 기록한다'],['평가',10,'작업 결과를 함께 점검하고 잘한 점과 다음 목표를 정한다']],safe:['도구 사용 안전 교육','적정 휴식 시간 보장'],eff:'작업 습관과 직무 기술이 향상되어 취업·현장 적응에 필요한 역량이 쌓일 것이다'},
'디지털·스마트기기':{goal:'스마트기기와 디지털 서비스를 직접 써 보며 정보 접근성과 생활 편리성을 높인다',items:['태블릿·스마트폰','큰 글씨 따라 하기 카드','와이파이 환경'],steps:[['도입',10,'오늘 배울 기능을 실제 생활 장면 사진으로 소개한다'],['따라 하기',25,'큰 글씨 카드를 보며 화면을 한 단계씩 함께 눌러 본다'],['혼자 해 보기',15,'배운 기능을 스스로 다시 해 보고 막히는 부분을 짝과 도와준다'],['마무리',10,'집에서 써 볼 과제를 정하고 따라 하기 카드를 나눠 준다']],safe:['개인정보 입력 금지 안내','화면 시간 중간 휴식'],eff:'디지털 기기 사용에 자신감이 생겨 정보·서비스 이용의 문턱이 낮아질 것이다'},
'장애인식개선 교육':{goal:'장애에 대한 올바른 이해를 높이고 함께 사는 지역사회 문화를 만든다',items:['교육 영상·교구(인형극 등)','활동지','홍보물'],steps:[['도입',10,'질문 퀴즈로 장애에 대해 알고 있는 것을 함께 나눈다'],['교육',20,'영상과 인형극으로 장애 유형별 특성과 배려 방법을 쉽게 설명한다'],['체험',15,'점자·수어·휠체어 체험 등 참여형 활동으로 직접 느껴 본다'],['다짐',5,'함께 지킬 약속을 정하고 활동지에 적는다']],safe:['체험 도구 사용 안전 안내','장애 비하 표현 사용 금지'],eff:'장애 이해도가 높아지고, 일상에서 배려와 존중을 실천하는 인식 변화가 나타날 것이다'},
'가족 교육·자조모임':{goal:'가족이 정보를 나누고 서로 지지하며 돌봄 부담을 줄이고 역량을 높인다',items:['교육 자료','다과','명찰'],steps:[['도입',15,'인사와 근황 나누기로 편안한 분위기를 만든다'],['교육',40,'주제별 전문 강의 또는 정보 공유로 필요한 지식을 안내한다'],['나눔',30,'경험과 고민을 나누고 서로의 방법을 배운다'],['마무리',5,'다음 모임 주제를 함께 정하고 만족도를 확인한다']],safe:['개인 사정은 동의한 범위만 공유','돌봄 공백 없는 시간 배치'],eff:'가족 간 지지망이 생기고 돌봄 정보와 역량이 높아져 정서적 부담이 줄어들 것이다'},

const RULES='- 내가 말하지 않은 사실은 지어내지 말고 [확인 필요]로 표시해.\n- 꼭 필요한 정보가 없으면 먼저 한두 가지만 물어봐.\n- 어려운 말 없이 쉬운 말로, 표로 한눈에 보이게.';
function pParts(){const P=S.p3,t=DTASKS[P.k],sv=pSel(P.k);return {role:'너는 '+t.role+'야.',ctx:t.g.map(g=>'- '+g.l.replace(/ \(.*\)$/,'').replace(/\?$/,'')+': '+pVal(g,sv[g.k],sv['x'+g.k])).join('\n'),task:t.task,mine:(P.text||'').trim(),ph:'['+t.ph+']',fmt:t.fmt,safe:t.safe||''}}
function pText(){const x=pParts();return '[역할]\n'+x.role+'\n\n[내가 고른 것]\n'+x.ctx+'\n\n[할 일]\n'+x.task+'\n\n[더 알려 줄 것]\n'+(x.mine||'(없음)')+'\n\n[답변 형식]\n'+x.fmt+'\n\n[지킬 것]\n'+RULES+(x.safe?'\n'+x.safe:'')}
function pHtml(){const x=pParts();return '<span class="k">[역할]</span>\n<span class="g">'+E(x.role)+'</span>\n\n<span class="k">[내가 고른 것]</span>\n<span class="g">'+E(x.ctx)+'</span>\n\n<span class="k">[할 일]</span>\n'+E(x.task)+'\n\n<span class="k">[더 알려 줄 것]</span>\n<span class="o">'+E(x.mine||x.ph)+'</span>\n\n<span class="k">[답변 형식]</span>\n'+E(x.fmt)+'\n\n<span class="k">[지킬 것]</span>\n'+E(RULES+(x.safe?'\n'+x.safe:''))}
function fHas(set,item,pantry){if(set.has(item))return true;if(pantry&&FRG.PANTRY.indexOf(item)>-1)return true;let ok=false;set.forEach(h=>{if(h.length>1&&(h.indexOf(item)>-1||item.indexOf(h)>-1))ok=true});return ok}
function fList(){const sv=pSel(S.p3.k),have=new Set(sv.b.map(i=>FRG.COMMON[i]));String(sv.xb||'').split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>have.add(FRG.norm(x)));const type=['meal','snack','all'][sv.a],pantry=sv.c!==1;
 if(!have.size)return {have,list:[]};
 const list=FRG.RECIPES.filter(r=>type==='all'||r.t===type).map(r=>{const nh=r.need.filter(i=>fHas(have,i,pantry)),oh=r.opt.filter(i=>fHas(have,i,pantry)),miss=r.need.filter(i=>!fHas(have,i,pantry)).concat(r.extra||[]);const used=nh.filter(i=>!(pantry&&FRG.PANTRY.indexOf(i)>-1)).length+oh.length;return {r,nh,oh,miss,score:miss.length*10-used-(r.sp?1.5:0)}}).filter(x=>x.nh.filter(i=>FRG.PANTRY.indexOf(i)<0).length>0||x.oh.length>0).sort((a,b)=>a.score-b.score);
 return {have,list}}
function fText(x){const r=x.r;return '['+r.n+'] 4~5인분 · 약 '+r.time+'\n재료: '+r.need.concat(r.opt,r.extra||[]).join(', ')+' (기본 양념 별도)\n'+(x.miss.length?'더 필요한 재료: '+x.miss.join(', ')+'\n':'')+'\n만드는 법\n'+r.s.map((t,i)=>(i+1)+'. '+t).join('\n')}
function fHtml(){const R=fList();if(!R.have.size)return '<p class="fr-empty">왼쪽에서 냉장고에 있는 재료를 눌러 주세요.<br>재료를 고르면 바로 추천 메뉴가 나와요.</p>';
 if(!R.list.length)return '<p class="fr-empty">고른 재료로 만들 메뉴를 찾지 못했어요.<br>재료를 더 고르거나 "식사·간식 모두"를 눌러 보세요.</p>';
 const ready=R.list.filter(x=>!x.miss.length).length;window._fl=R.list;
 return '<p class="fr-hint">'+R.list.length+'가지 메뉴'+(ready?' · 지금 바로 만들 수 있는 메뉴 <b>'+ready+'가지</b>':'')+'</p>'+R.list.slice(0,12).map((x,i)=>{const r=x.r,open=S.p3.fopen===r.n;
  return '<div class="fr-it'+(open?' open':'')+'"><button type="button" class="fr-h" onclick="S.p3.fopen=S.p3.fopen===\''+E(r.n)+'\'?null:\''+E(r.n)+'\';save();RIGHT()"><span class="fr-e">'+r.e+'</span><span class="fr-t"><b>'+E(r.n)+'</b><small>'+(r.t==='meal'?'식사':'간식')+' · 약 '+r.time+' · '+(x.miss.length?'<em class="fr-miss">'+x.miss.length+'가지 더 필요</em>':'<em class="fr-ok">바로 가능</em>')+'</small></span><span class="fr-plus">'+(open?'−':'+')+'</span></button>'+
  (open?'<div class="fr-b"><p><b>있는 재료</b> '+E(x.nh.concat(x.oh).filter(i=>FRG.PANTRY.indexOf(i)<0).join(', ')||'기본 양념')+'</p>'+(x.miss.length?'<p><b class="fr-miss">더 필요한 재료</b> '+E(x.miss.join(', '))+'</p>':'')+'<ol>'+r.s.map(t=>'<li>'+E(t)+'</li>').join('')+'</ol><button type="button" class="sm sp" onclick="copyTxt(fText(window._fl['+i+']))">레시피 복사</button></div>':'')+'</div>'}).join('')}
function pPick(k,i){const t=DTASKS[S.p3.k],sv=pSel(S.p3.k),g=t.g.find(z=>z.k===k);if(g.m){const a=sv[k],j=a.indexOf(i);j>-1?a.splice(j,1):a.push(i)}else sv[k]=i;save();render()}
function pX(k,v){pSel(S.p3.k)['x'+k]=v;save();RIGHT()}
VIEWS.room=()=>{const P=S.p3;if(!DTASKS[P.k])P.k=0;const t=DTASKS[P.k],sv=pSel(P.k),FR=!!t.fridge;
 return view('프롬프트 디자인실',
 `<div class="gl">무엇을 해 볼까요?</div><div class="rgrid">${DTASKS.map((x,i)=>`<button class="${P.k==i?'on':''}" onclick="S.p3.k=${i};save();render()"><b>${E(x.t)}</b><span>${E(x.s)}</span></button>`).join('')}</div>

 ()=>{if(FR)return `<div class="bar"><span class="t">추천 메뉴</span><span class="sub2">＋를 누르면 레시피가 나와요 · 기타 재료도 반영돼요</span></div><div class="out" style="white-space:normal"><div class="fr-list">${fHtml()}</div></div>`;
  const tx=pText();return aiBar(t.t+' 프롬프트',()=>tx)+`<div class="out jxpv">${pHtml().replace(/\n\n/g,'\n')}</div>`})};
