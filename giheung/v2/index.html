<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>용인시기흥장애인복지관 AI 업무도우미</title>
<script src="/js/room-gate.js?v=2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--g:#d9773a;--g2:#a4501c;--gl:#fdf1e6;--gm:#f5d5bb;--ink:#33281f;--sub:#7a6a5d;--line:#efe3d8;--bg:#fcf8f3;--red:#d93a2b;--or:#fff1e0;--orT:#a85a00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;letter-spacing:-.2px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1440px;width:100%;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:0 16px;overflow:hidden}
header{height:54px;display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header{gap:10px}.hbtn{flex:none;white-space:nowrap}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.brand small{font-weight:600;color:var(--sub);font-size:13px;margin-left:4px}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--g2)}
main{flex:1;min-height:0}
/* home */
.home{height:100%;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hero h1{font-size:22px;letter-spacing:-.8px}
.hero h1 em{font-style:normal;color:var(--g)}
.hero p{font-size:13px;color:var(--sub);letter-spacing:-.4px}
.hero .tip{flex:none;white-space:nowrap;font-size:13px;background:var(--gl);color:var(--g2);border-radius:10px;padding:8px 12px;font-weight:600}
.rows{flex:1;display:grid;grid-template-rows:repeat(5,1fr);gap:10px;min-height:0}
.row{background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:84px minmax(0,1fr);align-items:stretch;overflow:hidden;min-width:0}
.row .lab{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--g2);background:var(--gl);font-size:15px}
.row .tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;padding:8px;min-width:0}
.tile{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;font-size:clamp(14px,1.15vw,17px);letter-spacing:-.5px;color:var(--ink);transition:.15s;text-align:left}
.tile:hover{border-color:var(--g);background:var(--gl)}
.tile .ic{width:32px;height:32px;border-radius:10px;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.tile.app{font-size:15px;justify-content:center}
/* homepage-style home (그룹홈 비서함 틀) */
.hp{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 0 8px;min-height:0}
.hhero{flex:none;background:linear-gradient(90deg,#c9692f 0%,#df8a4f 55%,#ecac78 100%);border-radius:14px;display:grid;grid-template-columns:minmax(0,1fr) 34%;overflow:hidden;color:#fff;min-height:150px}
.hhero .tx{padding:18px 24px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.hhero .bdg{font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px}
.hhero .kick{font-size:13px;font-weight:700;color:#ffe3cc}
.hhero h1{font-size:clamp(20px,2vw,28px);letter-spacing:-1px;line-height:1.3;font-weight:800}
.hhero h1 em{font-style:normal;color:#fff3c4}
.hhero p.sub{font-size:13.5px;color:#fff1e4}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:0 12px;max-width:520px;margin-top:6px;color:#9a8a7e}
.srch input{border:0;outline:0;flex:1;padding:10px 0;font:inherit;font-size:14px;min-width:0;color:var(--ink)}
.hhero .ph{background:url(/img/giheung/hero-sprout.webp) center 45%/cover no-repeat}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.col h3{font-size:16px;font-weight:800;letter-spacing:-.5px;padding-bottom:7px;border-bottom:2px solid var(--g);display:flex;justify-content:space-between;align-items:center}
.col h3 small{font-size:12px;color:var(--sub);font-weight:700}
.ol{list-style:none;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column}
.ol li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1e8df;font-size:14.5px;font-weight:700;letter-spacing:-.4px}
.ol li .no{width:20px;color:var(--sub);font-weight:600;font-size:13px;text-align:center}
.ol li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ol li .nm:hover{color:var(--g2);text-decoration:underline}
.ol li .tg{font-size:11.5px;font-weight:800;color:var(--g2);background:var(--gl);border:1px solid var(--gm);border-radius:6px;padding:2px 7px}
.ob{border:0;background:var(--g);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px}
.qg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.q{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 4px;min-height:92px;color:var(--ink)}
.q svg{width:24px;height:24px;color:var(--g)}
.q b{font-size:14px;font-weight:800;letter-spacing:-.5px}
.q span{font-size:11.5px;color:var(--sub);letter-spacing:-.4px;white-space:nowrap}
.q:hover,.q.on{border-color:var(--g);background:var(--gl)}
.aig{margin-top:auto;border:1px solid var(--gm);background:var(--gl);border-radius:10px;padding:8px 10px}
.aig .t{font-size:13px;font-weight:800;color:var(--g2);margin-bottom:6px;display:flex;justify-content:space-between}
.aig .t small{font-weight:600;color:var(--sub)}
.aig .r{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.aig button{border:1px solid var(--gm);background:#fff;border-radius:8px;padding:7px 2px;font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aig button:hover{border-color:var(--g);color:var(--g2)}
.lk{list-style:none;overflow:auto;min-height:0;flex:1}
.lk .sec{font-size:12.5px;font-weight:800;color:var(--sub);margin:6px 0 2px}
.lk .sec:first-child{margin-top:0}
.lk a{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #f1e8df;text-decoration:none;color:var(--ink);font-size:14px;font-weight:800;letter-spacing:-.4px}
.lk a span{font-size:12px;color:var(--sub);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk a:hover{color:var(--g2)}
.ghelp{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--sub);letter-spacing:-.3px}
.ghelp b{color:var(--g2)}
.gfoot{flex:none;background:#3a2e27;color:#e9ddd2;margin:0 -16px;padding:9px 24px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;letter-spacing:-.3px}
.gfoot .r{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.gfoot b{color:#fff}.gfoot a{color:#ffd9b8;text-decoration:none;font-weight:700}
.gfoot .cp{border:1px solid #8a7666;background:none;color:#ffd9b8;border-radius:5px;padding:0 6px;font-size:11.5px}
/* 하나로 입력 */
.ibox{border:1px solid var(--line);border-radius:10px;background:#fffdfb;position:relative}
.ibox:focus-within{border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.ibox textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;font:inherit;font-size:14px;line-height:1.9;padding:8px 12px 4px;min-height:120px;color:var(--ink)}
.ibox .ft{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 12px;font-size:12px;color:#9a8a7e}
@media (max-width:900px){.hhero{grid-template-columns:1fr}.hhero .ph{display:none}.cols{grid-template-columns:1fr}.gfoot{margin:0}}
/* view */
.view{height:100%;display:grid;grid-template-columns:minmax(300px,32%) minmax(0,1fr);gap:12px;padding-bottom:6px}
.pane{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column}
.pane .hd{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex:none}
.pane .hd h2{font-size:18px;letter-spacing:-.6px}
.back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.pane .bd{padding:4px 16px 14px;overflow:auto;min-height:0;flex:1}
.pane .bd::-webkit-scrollbar{width:6px}.pane .bd::-webkit-scrollbar-thumb{background:#d6ddd9;border-radius:4px}
.gl{font-size:12.5px;font-weight:800;color:var(--sub);margin:8px 0 4px;letter-spacing:-.3px}
.gl:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.chip:hover{border-color:var(--g)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.big{font-size:14.5px;padding:7px 12px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-size:14.5px;font-weight:800;color:var(--sub)}
.tab.on{background:var(--gl);border-color:var(--g);color:var(--g2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 6px}
.fl{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff}
.fl label{font-size:13px;font-weight:700;color:var(--g2);padding:0 0 0 10px;white-space:nowrap}
.fl input,.fl textarea{border:0;outline:0;flex:1;padding:7px 8px;font:inherit;font-size:14px;background:transparent;min-width:0;resize:none}
.fl:focus-within{border-color:var(--g);box-shadow:0 0 0 2px var(--gl)}
.mic{border:0;background:var(--gl);color:var(--g2);border-radius:6px;margin:3px;padding:4px 8px;font-size:12px;font-weight:700}
.mic.rec{background:var(--red);color:#fff}
.ex{font-size:12px;color:#8a9590;margin:-2px 0 6px 2px;letter-spacing:-.3px}
.steps{display:flex;flex-direction:column;gap:5px}
.st{display:flex;gap:8px;align-items:flex-start;font-size:14px;letter-spacing:-.4px}
.st b.n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{font-size:12.5px;color:var(--orT);background:var(--or);border-radius:8px;padding:6px 10px;margin-top:8px;letter-spacing:-.3px}
.list{font-size:13px;color:var(--sub);padding-left:16px;letter-spacing:-.3px}
/* right */
.bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.bar .t{font-weight:800;font-size:16px;margin-right:auto;letter-spacing:-.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:800;color:var(--ink)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn:hover{border-color:var(--g)}
.out{padding:14px 18px;overflow:auto;flex:1;min-height:0;font-size:15px;line-height:1.75;white-space:pre-wrap;letter-spacing:-.3px}
.out mark,.hl{background:linear-gradient(transparent 55%,#ffe0a8 55%);color:var(--g2);font-weight:800;padding:0 1px}
.out .h{font-weight:800;color:var(--g2)}
.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;flex:1;min-height:0}
.box{border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.box .bh{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.box .bh .sp{margin-left:auto}
.box .bb{padding:8px 12px;overflow:auto;white-space:pre-wrap;font-size:13.5px;line-height:1.7;flex:1;min-height:0;letter-spacing:-.3px}
.sm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
table.form{width:100%;border-collapse:collapse;font-size:14px;white-space:normal}
table.form th{background:var(--gl);color:var(--g2);font-weight:800;width:120px;text-align:left;padding:7px 10px;border:1px solid var(--gm);vertical-align:top;letter-spacing:-.4px}
table.form td{padding:7px 10px;border:1px solid var(--gm);vertical-align:top;line-height:1.6}
.ftitle{text-align:center;font-weight:900;font-size:19px;letter-spacing:4px;margin:2px 0 10px}
.cards5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;white-space:normal}
.c5{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;line-height:1.6;letter-spacing:-.3px}
.c5 b{display:block;font-size:15px;color:var(--g2);margin-bottom:4px;letter-spacing:-.5px}
.c5 i{font-style:normal;font-weight:800;color:var(--sub);font-size:12px}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:5px}
.free{background:#e3f3e5;color:#2d6b36}.paid{background:var(--or);color:var(--orT)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;font-weight:800;font-size:14px;letter-spacing:-.4px}
.fc.on{border:2px solid var(--g);background:var(--gl);padding:7px 9px}
.subtabs{display:flex;gap:4px;padding:8px 14px 0;flex:none}
.stab{border:0;border-bottom:3px solid transparent;background:none;padding:6px 12px;font-weight:800;font-size:14.5px;color:var(--sub)}
.stab.on{color:var(--g2);border-color:var(--g)}
.red{color:var(--red);font-weight:900;font-size:19px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;white-space:normal;margin-bottom:12px}
.cmp>div{border:1px solid var(--line);border-radius:12px;padding:12px}
.cmp h4{font-size:16px;margin-bottom:6px}
.cmp ul{padding-left:18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1d2421;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:900px){
 .wrap{height:auto;min-height:100vh}
 .rows{grid-template-rows:none}.row{grid-template-columns:1fr}.row .lab{padding:6px}
 .row .tiles{grid-auto-flow:row;grid-template-columns:1fr 1fr}.tile{padding:14px}
 .view{grid-template-columns:1fr;height:auto}.pane .bd,.out{overflow:visible}
 .grid4{grid-template-columns:1fr;grid-template-rows:none}.box .bb{max-height:300px}
 .cards5{grid-template-columns:1fr 1fr}.hero{flex-direction:column;align-items:flex-start;gap:6px}
 body{font-size:16px}
}
</style>
</head>

 <div class="brand"><span class="dot">AI</span>용인시기흥장애인복지관 AI 업무도우미</div>

<script>
/* ================= 공통 데이터 ================= */
const ORG='용인시기흥장애인복지관';
const BIZ=[
{n:'치료서비스',p:['접수면접 및 사회진단','치료재활진단','운동치료','작업치료','로봇보행재활','순환재활','수중재활운동','언어치료','인지학습치료','음악치료','미술치료'],t:['장애 아동','장애 청소년','성인 장애인','보호자'],g:['신체 기능 향상','의사소통 향상','일상생활동작 향상','정서 안정']},
{n:'아동·청소년 그룹치료',p:['우리두리','두드림','위드고','뮤직TOUCH','P-Box','우리함께','토다김','아쿠아밸런스','스피치업','D-Box','아쿠아스윔','개별인지','개별언어','개별미술','개별체육'],t:['장애 아동(유·초)','장애 청소년(중·고)','부모'],g:['사회성 향상','주의집중력 향상','학교생활 적응','신체 발달']},

/* ================= ① 업무 프로젝트 ================= */
const DOCS=['사업계획서','결과보고서','홍보물'];
const SRC={0:['우리 복지관 사업계획서 서식(빈 양식)','올해 사업안내(지침) 해당 부분','전년도 사업계획서·결과보고서','수요조사·만족도 결과'],1:['우리 복지관 결과보고서 서식','올해 사업계획서(승인본)','월별 실적·운영일지','만족도 집계·사진 목록','예산 집행 내역'],2:['기관 로고·색상','지난 홍보물 중 마음에 든 것','행사 정보(일시·장소·대상)','활동 사진(촬영 동의 받은 것)']};
function instr(d){const b=BN(),p=P();
 if(d===0)return `[역할] 너는 장애인복지관 사업계획서를 심사하는 ${M('지자체 사업 검토 전문가')}다.
[목표] ${ORG} ${M(b)} · ${M(p)} 올해 사업계획서를 ${M('우리 서식 그대로')} 완성한다.
[진행 순서]
1. 첫 답변: 전년도 계획서·결과보고서 ↔ 올해 서식·지침 ${M('비교표 하나')}
   | 항목 | 잘된 점 | 문제점 | 올해 추가·보완 | 근거(자료명·쪽) |
2. 추가하면 좋은 자료 표 → "추가할 자료가 있나요?" 한 번만 묻기
3. 진행 중 확인이 필요한 예산·수치는 제안값과 함께 한 번에 확인 후 진행
4. 서식 항목·순서·표 그대로 초안 작성
5. ${M('심사위원 입장')} 검토 → 보완 → 최종본 → 한글(.hwpx) 파일
[필수] 근거 문장 끝 (자료명·쪽) · 예산 = 수량×단가×횟수 검산 · 개조식 공문체(~함)
[금지] 자료에 없는 숫자·실적 지어내기 → ${M('[확인 필요]')} · 서식에 없는 항목 추가 · 실명·연락처`;
 if(d===1)return `[역할] 너는 장애인복지관 결과보고서를 평가하는 ${M('사업평가 전문가')}다.
[목표] ${ORG} ${M(b)} · ${M(p)} 결과보고서를 ${M('우리 서식 그대로')} 완성한다.
[진행 순서]
1. 첫 답변: 올해 계획서 ↔ 운영 기록 ${M('계획 대비 실적표')}
   | 항목 | 목표 | 실적 | 달성률(계산식) | 근거 |
2. 부족한 자료 표 → "추가할 자료가 있나요?" 한 번만 묻기
3. 진행 중 확인이 필요한 수치는 한 번에 확인 후 진행
4. 서식 그대로 초안: 추진 실적 → 성과·변화 → 미달 사유·개선 방안
5. ${M('지자체 평가 담당자 입장')} 검토 → 보완 → 최종본 → 한글(.hwpx)
[필수] 숫자는 자료 근거만 · 만족도·변화는 근거 자료명 표시 · 개조식 공문체
[금지] 실적 부풀리기 · 자료에 없는 숫자 → ${M('[확인 필요]')} · 개인 식별 정보`;
 return `[역할] 너는 장애인복지관 ${M('홍보 디자인 전문가')}다.
[목표] ${ORG} ${M(b)} · ${M(p)} 홍보물(포스터·카드뉴스·인포그래픽)을 만든다.
[진행 순서]
1. 질문은 최대 2회: 홍보물 종류 · 꼭 넣을 정보만 확인
2. ${M('서로 다른 시안 2개')}(분위기·배치 다르게) 먼저 제안 → 고른 것으로 제작
3. 완성 후 오탈자·정보 누락 점검표 제시
[필수] 행사명·일시·장소·대상·신청 방법·문의 전화 ${M('크고 또렷하게')} · 큰 글씨·고대비·쉬운 말 · 장애인을 ${M('주인공')}으로 표현
[금지] 정보 지어내기 → [확인 필요] · 동정·시혜적 표현 · 실제 인물 얼굴 무단 사용`}
function first(d){const b=BN(),p=P();
 return d===2?`${M(b)} · ${M(p)} 홍보물을 만들 거야. 지침 순서대로 진행해 줘.
[정보] 행사명: ${F('name')} / 일시: ${F('date')} / 장소: ${F('place')} / 대상: ${F('people')} / 신청: ${F('apply')} / 문의: ${F('tel')}`
 :`${M(b)} · ${M(p)} ${DOCS[d]}를 작성할 거야. 지침 순서대로 진행해 줘.
첫 답변에는 ${d===0?'비교표':'계획 대비 실적표'}와 추가하면 좋은 자료 표만 보여 줘.`}
VIEWS.project=()=>{S.doc=S.doc??0;S.ps=S.ps??0;return view('업무 프로젝트',
 `<div class="gl">문서</div>${chips('doc',DOCS,1)}${bizPick()}
 <div class="gl">만드는 법</div>${steps(['ChatGPT 왼쪽 <b>프로젝트 → 새 프로젝트</b> (이름: '+esc(BN())+' '+DOCS[S.doc]+')','프로젝트 설정 → <b>지침</b>에 오른쪽 지침 붙여넣기','<b>소스</b>에 서식·자료 넣고 새 채팅 → 첫 프롬프트'])}
 <div class="gl">소스에 넣으면 좋은 자료</div><ul class="list">${SRC[S.doc].map(x=>`<li>${x}</li>`).join('')}</ul>
 <div class="note">실명·연락처·진단명은 넣지 마세요. 이용자는 가명(이용자A)</div>`,
 ()=>{const t=S.ps?first(S.doc):instr(S.doc);return `<div class="subtabs"><button class="stab${S.ps?'':' on'}" onclick="S.ps=0;save();RIGHT()">프로젝트 지침</button><button class="stab${S.ps?' on':''}" onclick="S.ps=1;save();RIGHT()">첫 프롬프트</button></div>`+outBox(S.ps?'첫 대화에 붙여넣기':'프로젝트 지침에 붙여넣기',t)})};

/* ================= ② 계획·일지 ================= */
function acts(p){const m={
'요리':['오늘의 요리 사진 카드로 소개','재료 손질·조리 단계별 역할 나누기','완성 음식 나눠 먹으며 소감 말하기'],
'ADL(일상생활)':['오늘 연습할 생활 기술 시범 보기','단계별로 직접 해 보기(필요 시 보조)','스스로 한 단계 체크하고 칭찬 나누기']};
 if(m[p])return m[p];
 if(/치료/.test(p))return ['인사·컨디션 확인','개별 목표에 맞춘 '+p+' 활동','보호자와 오늘 변화 공유'];
 if(/교육|대학|상담|알선|적응|고용|일자리/.test(p))return ['오늘 배울 내용 쉬운 말로 안내','실습·모의 활동('+p+')','배운 점 한 줄 정리·다음 계획'];
 if(/캠페인|포니|인식|권리|공모/.test(p))return ['장애 이해 영상·그림으로 열기','참여형 활동('+p+')','함께 다짐 나누기'];
 return ['인사·오늘 활동 그림 카드로 소개',p+' 본 활동(선택·참여 중심)','소감 나누기·다음 일정 안내']}
VIEWS.plan=()=>{S.pl=S.pl??0;S.gg=S.gg??0;S.ss=S.ss??0;const b=B();return view('계획·일지',
 `${bizPick()}<div class="gl">목표</div>${chips('gg',b.g)}<div class="gl">회기</div>${chips('ss',['1회','4회기','8회기','12회기','연중'])}
 <div class="gl">입력</div>${f2(field('date','일시'),field('place','장소'))}${f2(field('people','대상·인원'),field('staff','담당자'))}
 ${S.pl?field('react','참여 모습',1,'처음엔 망설였지만 직접 재료를 고르며 웃음'):''}
 <div class="note">빈칸은 [ ]로 남아요. 기관 서식이 있으면 프롬프트로 서식에 맞춰 받으세요</div>`,
 ()=>{const p=P(),bn=BN(),a=acts(p),g=b.g[S.gg]||'',ss=['1회','4회기','8회기','12회기','연중'][S.ss];
 const rows=S.pl?[['프로그램명',p],['일시',F('date')],['장소',F('place')],['참여자',F('people','참여 인원')],['담당자',F('staff')],['활동 목표',g+' — 오늘의 목표 [확인 필요]'],['진행 내용','도입: '+a[0]+'\n전개: '+a[1]+'\n마무리: '+a[2]],['참여 모습',V('react')||'[참여자 반응·관찰 내용]'],['특이사항','[건강·안전·정서 변화]'],['다음 회기','[다음 활동·보완점]'],['결재','담당 [   ]   팀장 [   ]   관장 [   ]']]
 :[['프로그램명',p],['사업명',bn],['목적',g+'을(를) 위해 '+p+' 활동으로 참여자의 선택과 참여를 넓힘'],['목표','① '+g+' 관련 목표 [확인 필요]\n② 참여자 만족도 [확인 필요]% 이상'],['대상',F('people')],['일시·장소',F('date')+' / '+F('place')],['운영 횟수',ss],['진행 내용','도입: '+a[0]+'\n전개: '+a[1]+'\n마무리: '+a[2]],['준비물','[재료·도구 목록]'],['인력',F('staff')+' 외 [보조 인력]'],['예산','[항목 × 단가 × 횟수 = 금액]'],['기대 효과',g+' · 자신감 향상 · 관계 형성'],['평가 방법','관찰 기록 · 만족도 조사(그림형 포함)'],['안전·접근성','이동 동선·감각 자극·의사소통 지원 확인']];
 const txt=(S.pl?'프로그램 일지':'프로그램 계획서')+'\n'+rows.map(r=>r[0]+': '+r[1]).join('\n');
 const pr=`첨부한 우리 복지관 ${S.pl?'프로그램 일지':'프로그램 계획서'} 서식의 칸 이름·순서는 그대로 두고 아래 내용으로 채워 줘.\n자료에 없는 숫자는 [확인 필요], 개조식 공문체, 이용자는 가명.\n\n`+txt;
 CUR=()=>pr;
 return `<div class="subtabs"><button class="stab${S.pl?'':' on'}" onclick="S.pl=0;save();render()">계획서</button><button class="stab${S.pl?' on':''}" onclick="S.pl=1;save();render()">일지</button></div>
 <div class="bar"><span class="t">${S.pl?'일지':'계획서'} 초안</span><button class="btn p" onclick="copyTxt(TXT)">표 복사</button><button class="btn" onclick="openAI('gpt',CUR())">ChatGPT로 서식 채우기</button><button class="btn" onclick="openAI('claude',CUR())">Claude</button></div>
 <div class="out" style="white-space:normal"><div class="ftitle">${S.pl?'프 로 그 램  일 지':'프 로 그 램  계 획 서'}</div><table class="form">${rows.map(r=>`<tr><th>${r[0]}</th><td>${fmtCell(r[1])}</td></tr>`).join('')}</table></div>${setTXT(txt)}`})};
function fmtCell(s){return esc(s).replace(/\n/g,'<br>').replace(/\[([^\]]*)\]/g,'<span style="color:#a85a00">[$1]</span>')}
let TXT='';function setTXT(t){TXT=t;return ''}

 <div class="note">한글 파일로 안 나오면 "칸 이름 | 내용" 표로 받아 원본 서식에 붙여넣기 (워드 변환은 서식이 깨져요)</div>`,
 ()=>{const f=MFORM[S.mf],i=MIN[S.mi];const t=`너는 ${ORG}의 ${M('문서 작성 실무 전문가')}야.
첨부한 ${M(i)}의 내용을, 함께 첨부한 우리 복지관 ${M(f)} 서식에 맞춰 채워 줘.

function itype(bn,p){const s=bn+' '+p;

 if(/활동지원|맞춤형|주간활동/.test(s))return 'care';if(/인식|권리|법률|공모|누니|바니|모니|귀니|놀이터/.test(s))return 'aware';if(/재가|이·미용|반찬|김장|명절지원|클린업|생일잔치|반려견|잔고장|주거|문화기행|쉼표|행복마을|행복신문/.test(s))return 'home';
 if(/가족잔치|명절 및|문화공연|문화데이트|길 따라|나들이|무료마켓/.test(s))return 'event';if(/가족|부모|P\.O\.P|마음ON/.test(s))return 'family';if(/직업|취업|고용|일자리|훈련대학|직업대학|직종/.test(s))return 'job';
 if(/주간이용/.test(s))return 'day';if(/치료|재활진단|접수면접|순환재활|수중재활/.test(s)&&!/그룹치료|아동/.test(bn))return 'therapy';if(/아동|청소년|I Be|전환기/.test(bn))return 'child';return 'adult'}
function ideas5(m,bn,p){const t=itype(bn,p),L=IDEAS[t],mi=MI[m];const sub=x=>x.replace(/\{s\}/g,mi.s).replace(/\{e\}/g,mi.e).replace(/\{f\}/g,mi.f).replace(/\{pl\}/g,mi.pl).replace(/\{p\}/g,p);
 const out=[];for(let i=0;i<5;i++)out.push(L[(m+i)%L.length].map(sub));return out}

function msgText(){const s=S.ms??0,p=P(),to=S.to??1,tone=S.tn??0;const who=['이용자님','보호자님','봉사자님','담당자님','후원자님'][to];
 const soft=tone===2;const end=tone===1?'감사합니다.':'늘 함께해 주셔서 고맙습니다.';const g=greet(to);
 const info=`일시: ${F('date')}\n장소: ${F('place')}${V('prep')?'\n준비물: '+V('prep'):''}\n문의: ${F('staff')} ${F('tel')}`;
 const add=V('madd')?'\n'+V('madd'):'';
 const T={
 0:[`${g}\n${who}, ${M(p)}에 함께해 주세요.${add}\n\n${info}\n\n${soft?'궁금한 것이 있으면 전화 주세요.':'참여가 어려우시면 미리 연락 부탁드립니다.'}\n${end}`,`[${p}] ${F('date')} ${F('place')} · 문의 ${F('tel')}`],
 1:[`${g}\n${who}, ${M(p)} 일정이 바뀌어 알려드립니다.\n\n변경 전: [기존 일시]\n변경 후: ${F('date')}\n장소: ${F('place')}${add}\n\n불편을 드려 죄송합니다. 문의: ${F('staff')} ${F('tel')}\n${end}`,`[${p} 일정 변경] ${F('date')}로 바뀌었습니다 · ${F('tel')}`],
 2:[`${g}\n${who}, 신청해 주신 ${M(p)} 접수 결과를 알려드립니다.\n\n결과: [선정 / 대기 ○번]\n시작: ${F('date')}${add}\n\n자세한 안내는 ${F('staff')}(${F('tel')})께서 다시 연락드리겠습니다.\n${end}`,`[${p}] 접수 결과: [선정/대기] · 문의 ${F('tel')}`],
 3:[`${g}\n보호자님, ${M(p)}에서 [이용자 호칭]님의 요즘 모습을 전해드려요.${add||'\n[최근 활동·좋아진 점 한두 줄]'}\n\n오늘도 웃는 얼굴로 함께해 주셨어요. 궁금하신 점은 언제든 연락 주세요.\n${F('staff')} 드림`,`[이용자]님 오늘 ${p}에서 즐겁게 참여하셨어요 :)`],
 4:[`${g}\n보호자님, ${M(p)} 관련 상담을 안내드립니다.\n\n${info}${add}\n\n편하신 시간이 다르면 알려 주세요. 맞춰 조정하겠습니다.\n${end}`,`[상담 안내] ${F('date')} ${F('place')} · ${F('tel')}`],
 5:[`${g}\n보호자님, 이번 달 ${M(p)} 진행 내용을 안내드립니다.\n\n- 이번 달 목표: [목표]\n- 잘하신 점: [변화]\n- 가정에서 함께해 주세요: [가정 연계 활동]${add}\n\n문의: ${F('staff')} ${F('tel')}`,`[${p}] 이번 달 결과 안내드렸어요. 가정에서도 [활동] 함께해 주세요.`],
 6:[`${g}\n${who}, 조심스럽게 말씀드릴 일이 있어 연락드립니다.\n${add||'[전해야 할 내용을 사실 위주로 한두 줄]'}\n\n저희도 같은 마음으로 방법을 찾고 있습니다. 편하실 때 통화 가능하실지 여쭙고 싶습니다.\n${F('staff')} 드림 (${F('tel')})`,`편하실 때 통화 가능하실까요? 말씀드릴 일이 있습니다. ${F('tel')}`],
 7:[`${g}\n봉사자님, ${M(p)} 봉사 활동을 안내드립니다.\n\n${info}\n복장: 편한 옷${add}\n\n귀한 시간 내주셔서 감사합니다.`,`[${p} 봉사] ${F('date')} ${F('place')} · ${F('tel')}`],
 8:[`안녕하십니까, ${ORG} ${F('staff')}입니다.\n${M(p)} 운영과 관련하여 협조를 요청드립니다.\n\n1. 내용: ${V('madd')||'[협조 요청 내용]'}\n2. 일시: ${F('date')}\n3. 장소: ${F('place')}\n\n검토 부탁드리며, 문의는 ${F('tel')}로 연락 주십시오.\n감사합니다.`,`[협조 요청] ${p} 관련 · ${F('date')} · ${F('tel')}`],
 9:[`${g}\n${who}, 따뜻한 [명절/절기] 맞이하세요.\n올 한 해 ${M(p)}에 보내주신 관심 덕분에 이용자분들이 더 많이 웃을 수 있었습니다.${add}\n\n가족과 함께 행복한 시간 보내시길 바랍니다.\n${ORG} 드림`,`즐거운 [명절] 보내세요! 늘 고맙습니다 - ${ORG}`],
 10:[`${g}\n${who}, ${V('madd')||'[전하고 싶은 내용]'}\n\n문의: ${F('staff')} ${F('tel')}\n${end}`,`${V('madd')||'[짧은 안내]'} · ${F('tel')}`]};
 return T[s]}
VIEWS.msg=()=>{S.ms=S.ms??0;S.to=S.to??1;S.tn=S.tn??0;return view('문자·소통',
 `<div class="gl">상황</div>${chips('ms',MSGS)}${bizPick()}<div class="gl">받는 분</div>${chips('to',['이용자','보호자','자원봉사자','협력기관','후원자'])}<div class="gl">말투</div>${chips('tn',TONE)}
 <div class="gl">입력</div>${f2(field('date','일시'),field('place','장소'))}${f2(field('prep','준비물'),field('staff','담당자'))}${field('tel','전화번호')}${field('madd','덧붙일 말',1)}`,
 ()=>{const [a,b]=msgText();const pr=`너는 ${ORG} 사회복지사야. 아래 문자를 ${M(TONE[S.tn])} 다듬어 줘. 받는 분: ${['이용자','보호자','자원봉사자','협력기관','후원자'][S.to]}. 90자 짧은 버전도 함께.\n\n${a}`;
 return aiBar(MSGS[S.ms]+' 문자',()=>a)+`<div class="grid4" style="grid-template-rows:1.4fr 1fr"><div class="box" style="grid-column:1/3"><div class="bh">바로 보낼 문자<button class="sm sp" onclick="copyTxt(CA)">복사</button></div><div class="bb">${fmt(a)}</div></div><div class="box"><div class="bh">짧은 버전<button class="sm sp" onclick="copyTxt(CB)">복사</button></div><div class="bb">${fmt(b)}</div></div><div class="box"><div class="bh">AI로 더 다듬기<button class="sm sp" onclick="openAI('gpt',CP)">ChatGPT</button><button class="sm" onclick="openAI('gemini',CP)">제미나이</button></div><div class="bb">${fmt(pr)}</div></div></div>${setC(a,b,pr)}`})};
let CA='',CB='',CP='';function setC(a,b,p){CA=a;CB=b;CP=p;return ''}

/* ================= ⑤ 홍보·안내 ================= */
const PROMOS=['이달의 소식','활동 SNS·블로그','홈페이지 게시글','보도자료','안내문·가정통신문','쉬운 글 안내문','모집 공고','포스터·홍보 그림','인포그래픽','카드뉴스','핀터레스트 레퍼런스','기타'];
const MOOD=['따뜻하게','밝고 경쾌하게','차분하게'];const LEN=['짧게','보통','길게'];
const WITH=['이용자','보호자·가족','자원봉사자','지역 주민','후원자','협력기관'];
function tags(){const p=P().replace(/[^가-힣A-Za-z0-9]/g,'');const a=(V('act')||'').replace(/[^가-힣0-9 ]/g,'').split(' ').filter(w=>w.length>1).slice(0,2).join('');return `#${ORG} #${BN().replace(/[^가-힣A-Za-z]/g,'')} #${p}${a?' #'+a:''} #함께하는기흥 #장애인복지관`}
function withTxt(){const a=(S.wi||[0]).map(i=>WITH[i]);return a.join('·')}
function blog(){const p=P(),act=V('act')||`${p} 활동을 함께했어요`,more=V('more'),w=withTxt(),L=S.ln??1,mood=S.md??0;
 const open=['따스한 마음을 담아 오늘의 이야기를 전해드려요.','신나는 소식 하나 들고 왔어요!','오늘 있었던 활동을 차분히 정리해 전해드립니다.'][mood];
 let t=`[제목] ${p} | ${act.slice(0,24)} — ${ORG} 이야기\n\n안녕하세요, ${ORG}입니다.\n${open}\n\n■ 오늘의 활동\n${M(act)}\n[사진: 활동 모습 1]\n\n■ 함께한 사람들\n${w} 모두 함께 ${p} 시간을 보냈어요.${more?'\n'+more:''}\n\n■ 이렇게 진행했어요\n먼저 오늘 할 일을 함께 확인하고, 각자 하고 싶은 역할을 골랐어요. 서두르지 않고 한 분 한 분의 속도에 맞추니 모두가 끝까지 즐겁게 참여했어요.\n[사진: 진행하는 모습]`;
 if(L>0)t+=`\n\n■ 기억에 남는 순간\n[이용자분의 반응이나 기억에 남는 장면 한두 줄]\n[사진: 활동 모습 2]\n\n■ 이용자분의 한마디\n"[이용자분이 한 말]"\n짧은 한마디에 오늘의 즐거움이 담겨 있었어요.`;
 if(L>1)t+=`\n\n■ ${BN()}은(는)\n${BN()}은(는) 장애인이 지역 안에서 스스로 선택하고 참여하는 삶을 응원하는 사업이에요. 이런 활동 하나하나가 자신감이 되고, 이웃에게는 서로를 알아가는 계기가 됩니다.\n\n■ 고마운 분들\n늘 마음을 보태 주시는 후원자님과 자원봉사자님, 지역 이웃분들께 감사드립니다.`;
 t+=`\n\n앞으로도 ${ORG}의 따뜻한 일상을 나누겠습니다.\n\n${tags()}`;return t}
function insta(){const p=P(),act=V('act')||`${p} 활동`;const e=['🌿','✨','🙂'][S.md??0];return `${e} ${p} 이야기 ${e}\n\n${act}\n${withTxt()} 모두 함께여서 더 즐거웠던 시간!${V('more')?'\n'+V('more'):''}\n\n오늘도 한 걸음 함께 자랐어요.\n\n📍 ${ORG}\n${tags()}`}
function kakao(){const p=P(),act=V('act')||`${p} 활동`;return `[${ORG} 소식]\n\n${p} 활동을 전해드려요.\n· ${act}\n· 함께한 분: ${withTxt()}${V('date')?'\n· 일시: '+V('date'):''}\n\n자세한 이야기와 사진은 블로그에서 확인해 주세요.\n[블로그 링크]\n\n문의 ${F('tel')}`}
function home(){const p=P(),act=V('act')||`${p} 활동`;return `[제목] ${BN()} ${p} 운영 소식\n\n${ORG}은(는) ${V('date')||'[일시]'} ${V('place')||'[장소]'}에서 ${M(p)}을(를) 진행하였습니다.\n\n1. 대상: ${withTxt()}\n2. 내용: ${act}${V('more')?'\n3. 주요 활동: '+V('more'):''}\n\n이번 활동을 통해 참여자분들이 [기대 효과]를 경험하는 시간이 되었습니다.\n앞으로도 지역사회와 함께하는 프로그램을 운영하겠습니다.\n\n[사진 설명: 사진 속 활동을 한 줄로 설명]\n문의: ${F('staff')} ${F('tel')}`}
function promoText(){const s=S.pr??0,p=P(),bn=BN();
 const info=`행사명: ${F('name')}\n일시: ${F('date')}\n장소: ${F('place')}\n대상·인원: ${F('people')}\n모집 기간: ${F('recruit')}\n신청 방법: ${F('apply')}\n문의: ${F('staff')} ${F('tel')}`;
 const img=(kind,extra)=>`너는 장애인복지관 ${M('홍보 디자인 전문가')}야.\n${M(bn)} · ${M(p)} ${M(kind)}을(를) 만들어 줘.\n${info}\n[필수]\n- 위 정보는 ${M('크고 또렷하게')}, 모르는 칸은 [확인 필요]\n- 큰 글씨·고대비·쉬운 말, 색은 2~3가지\n- 장애인을 도움받는 대상이 아니라 ${M('주인공')}으로\n- ${M('서로 다른 시안 2개')} 먼저 보여 주고 고른 것으로 완성${extra?'\n'+extra:''}`;
 const M2={2:home(),3:`[보도자료] ${ORG}, ${M(p)} 운영\n\n${ORG}(관장 [관장명])은 ${V('date')||'[일시]'} ${V('place')||'[장소]'}에서 ${withTxt()} 등이 참여한 가운데 ${p}을(를) 진행했다고 밝혔다.\n\n이번 프로그램은 ${V('act')||'[활동 내용]'}으로 구성됐으며, 참여자들은 [참여 소감]을 전했다.\n\n복지관 관계자는 "[관계자 한마디]"라며 "앞으로도 지역사회와 함께하겠다"고 말했다.\n\n문의: ${F('staff')} ${F('tel')}\n※ 사진: 촬영 동의 받은 사진만 첨부`,
 4:`[${bn} 안내문]\n\n${greet(1)}\n${M(p)}을(를) 아래와 같이 안내드립니다.\n\n${info}\n\n${V('more')||'[참고 사항]'}\n\n${ORG}장`,
 5:`[쉬운 글 안내문]\n\n${p}에 와요.\n\n📅 언제: ${F('date')}\n📍 어디서: ${F('place')}\n🎒 가져와요: ${F('prep')}\n☎ 궁금하면: ${F('tel')}\n\n같이 해요!\n\n※ AI로 그림과 함께 만들기: "한 문장에 한 내용, 쉬운 낱말, 그림 함께, 큰 글씨"로 요청하세요`,
 6:`[모집] ${M(bn)} ${M(p)} 참여자를 모집합니다\n\n${info}\n\n${V('more')||'[프로그램 소개 한두 줄]'}\n\n많은 관심과 참여 부탁드립니다.\n${ORG}`};

 if(s===7)return img('모집 포스터');
 if(s===8)return img('인포그래픽 1장','- 숫자·성과는 내가 준 것만, 아이콘과 짧은 문장으로');
 if(s===9)return img('카드뉴스 4장','- 1장 표지 → 2~3장 내용 → 4장 신청 방법, 장마다 한 문장');
 if(s===10)return `[따라 하기] ① 핀터레스트에서 "모집 공고 포스터" 검색 ② 마음에 드는 이미지 저장 ③ 이 이미지를 ChatGPT·제미나이에 첨부하고 아래 붙여넣기\n\n첨부한 이미지는 ${M('분위기·색감·배치만')} 참고해서 ${M(bn)} ${M(p)} 모집 포스터를 새로 만들어 줘.\n그림·글자·로고를 ${M('그대로 베끼는 것은 금지')}.\n${info}\n큰 글씨·고대비, 시안 2개 먼저.`;
 if(s===11)return `${ORG} ${bn} ${p} 관련 ${V('more')||'[만들고 싶은 글·홍보물]'}을(를) 만들어 줘.\n${info}`;

VIEWS.apps=()=>{S.app=S.app??0;S.fc=S.fc??0;S.sub=S.sub??0;S.ao=S.ao??0;S.ab=S.ab??0;const A=APPS[S.app];
 const appTabs=`<div class="tabs" style="margin-bottom:8px">${APPS.map((a,i)=>`<button class="tab${S.app==i?' on':''}" onclick="S.app=${i};S.fc=0;S.ao=0;S.sub=0;save();render()">${a.n}</button>`).join('')}</div>`;
 if(!A.cards.length)return view('AI 앱 활용법',appTabs+`<div class="gl">데스크톱 앱이 좋은 이유</div>${steps(['<b>단축키</b>로 어디서든 바로 열기 (작업 중 창 전환 없이)','내 컴퓨터 <b>폴더·파일</b>을 바로 연결해 작업','<b>화면 공유</b>로 지금 보는 창을 보여 주고 질문'])}<div class="gl">설치</div>${steps(['ChatGPT: <b>chatgpt.com/download</b>','Claude: <b>claude.ai/download</b>','설치 후 같은 계정으로 로그인 → 대화·프로젝트 그대로'])}<div class="note">기관 PC는 설치 권한이 필요할 수 있어요 (전산 담당자 확인)</div>`,
 ()=>`<div class="bar"><span class="t">웹 vs 데스크톱 앱</span></div><div class="out" style="white-space:normal"><div class="cmp"><div><h4>🌐 웹 (브라우저)</h4><ul><li>설치 없이 바로</li><li>탭 사이를 오가며 찾아야 함</li><li>파일은 매번 올리기</li><li>어느 PC에서나 접속</li></ul></div><div style="border-color:var(--g);background:var(--gl)"><h4>💻 데스크톱 앱</h4><ul><li><mark>단축키 한 번</mark>으로 열기</li><li>작업 창 위에 바로 띄우기</li><li><mark>내 폴더·파일</mark> 바로 연결</li><li><mark>화면 보여 주고</mark> 질문</li></ul></div></div><div class="cmp"><div><h4>이럴 땐 웹</h4><ul><li>공용 PC·잠깐 쓸 때</li><li>설치 권한이 없을 때</li></ul></div><div><h4>이럴 땐 데스크톱 앱</h4><ul><li>매일 서류 작업할 때</li><li>엑셀·한글 보면서 질문할 때</li></ul></div></div></div>`);
 const C=A.cards[S.fc]||A.cards[0];
 return view('AI 앱 활용법',appTabs+`<div class="gl">기능</div><div class="fcards">${A.cards.map((c,i)=>`<button class="fc${S.fc==i?' on':''}" onclick="S.fc=${i};S.ao=0;S.sub=0;save();render()">${c.n}<span class="badge ${c.f?'free':'paid'}">${c.f?'무료':'유료'}</span></button>`).join('')}</div>
 <div class="gl">${C.ol}</div>${chips('ao',C.o)}<div class="gl">사업</div>${chips('ab',AB)}
 <div class="note">무료·유료는 2026.11.26 확인 기준이며 바뀔 수 있어요</div>`,
 ()=>{const pr=C.p.replace(/\{b\}/g,M(AB[S.ab])).replace(/\{o\}/g,M(C.o[S.ao]||''));const sub=S.sub;CUR=()=>pr;
 const head=`<div class="subtabs">${['사용법','활용 예시','프롬프트'].map((n,i)=>`<button class="stab${sub==i?' on':''}" onclick="S.sub=${i};save();RIGHT()">${n}</button>`).join('')}</div>`;
 const bar=`<div class="bar"><span class="t">${A.n} · ${C.n}<span class="badge ${C.f?'free':'paid'}">${C.f?'무료':'유료'}</span></span><button class="btn p" onclick="copyTxt(CUR())">프롬프트 복사</button>${A.url&&A.url!=='canva'?`<button class="btn" onclick="openAI('${A.url}',CUR())">${A.n} 열기</button>`:A.url==='canva'?`<button class="btn" onclick="window.open('https://www.canva.com','_blank')">Canva 열기</button>`:''}</div>`;
 let body;if(sub===0)body=`<div class="out" style="white-space:normal">${steps(C.how)}</div>`;
 else if(sub===1)body=`<div class="out" style="white-space:normal"><div class="cards5" style="grid-template-columns:repeat(2,1fr);padding:0">${C.use.map(u=>`<div class="c5"><b>${esc(u)}</b>${esc(AB[S.ab])}에서 "${esc(C.o[S.ao]||'')}"로 바로 만들어 보세요</div>`).join('')}</div></div>`;
 else body=`<div class="out">${fmt(pr)}</div>`;
 return head+bar+body})};
