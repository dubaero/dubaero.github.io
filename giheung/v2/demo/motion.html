<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모집 안내</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.s{position:absolute;inset:0;background:linear-gradient(135deg,#1F5A47,#2F7A5F 60%,#3E8F70);display:grid;place-items:center;color:#fff}
.c{width:86%;display:grid;gap:3.2vh;text-align:center}
.k{justify-self:center;background:#E07A2E;border-radius:999px;padding:.6vh 2.4vw;font-weight:800;font-size:3.4vh;opacity:0;animation:in 15s infinite}
h1{margin:0;font-size:9vh;line-height:1.15;letter-spacing:-.04em;opacity:0;animation:up 15s infinite .6s}
.r{display:flex;justify-content:center;gap:2vw;flex-wrap:wrap}
.r div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:2vh;padding:1.6vh 2.4vw;font-size:4.4vh;font-weight:700;opacity:0}
.r div:nth-child(1){animation:up 15s infinite 2.2s}.r div:nth-child(2){animation:up 15s infinite 3.6s}
.t{font-size:4.6vh;font-weight:800;color:#FFE3C7;opacity:0;animation:pop 15s infinite 5s}
.bar{position:absolute;left:0;bottom:0;height:1vh;background:#E07A2E;animation:bar 15s infinite linear}
.dots i{position:absolute;width:2.2vh;height:2.2vh;border-radius:50%;background:rgba(255,255,255,.18);animation:fl 6s infinite ease-in-out}
@keyframes in{0%,2%{opacity:0;transform:scale(.6)}6%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes up{0%{opacity:0;transform:translateY(4vh)}5%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}4%{opacity:1;transform:scale(1.08)}7%,86%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes bar{from{width:0}to{width:100%}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3vh)}}
</style></head><body><div class="s"><div class="dots"><i style="left:8%;top:18%"></i><i style="left:88%;top:26%;animation-delay:1s"></i><i style="left:14%;top:78%;animation-delay:2s"></i><i style="left:80%;top:80%;animation-delay:3s"></i></div>
<div class="c"><span class="k">참여자 모집</span><h1>함께 걷는 봄 소풍</h1><div class="r"><div>4월 18일(토) 10:00</div><div>용인 기흥호수공원</div></div><div class="t">문의 031-000-0000</div></div><div class="bar"></div></div></body></html>
