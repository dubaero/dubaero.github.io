<style>
:root{--bg:#F7F3E8;--card:#fff;--ink:#1E4A34;--ink2:#2F6B4A;--text:#111;--muted:#2B3A31;--point:#D9603F;--soft:#FBF4E6;--pale:#EEF2EC;--line:#D9D2C2;--fs:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{overflow-x:hidden;overflow-wrap:anywhere;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
body.big{--fs:17px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 헤더 */
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.top a,.top button{background:none;border:0;color:#fff;font-weight:700;font-size:.9rem;text-decoration:none}
.top .home{border:1.5px solid rgba(255,255,255,.6);border-radius:20px;padding:3px 12px}
.top .sp{flex:1}
.badge{background:#fff;color:var(--ink);border-radius:20px;padding:3px 12px;font-size:.82rem;font-weight:700}
.bigbtn{border:1.5px solid rgba(255,255,255,.6)!important;border-radius:20px;padding:3px 12px}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;margin:22px 0 16px}
.org{font-weight:700;color:var(--ink2);font-size:.95rem}
h1{font-size:2.35rem;line-height:1.25;font-weight:900;color:var(--ink);margin:6px 0 4px;letter-spacing:-.5px}

.search input{border:0;outline:0;font:inherit;font-size:1rem;flex:1;background:none}
.hero-art{border-radius:22px;overflow:hidden;border:2px solid var(--line);aspect-ratio:892/726}

.vars{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}

/* 큰 메뉴 */
.main{display:grid;grid-template-columns:repeat(8,1fr) minmax(0,1.3fr);gap:10px;margin-bottom:16px}
.m{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s}
.m:hover,.m:focus-visible{border-color:var(--ink)}

.m b{font-size:1rem;line-height:1.25}
.m.red{border-color:var(--point);background:var(--soft)}
.m.red .ic{background:var(--point);color:#fff}
/* 대시보드 */
.dash{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:14px;margin-bottom:22px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.9rem;font-weight:700}
.chip:hover{border-color:var(--ink);background:var(--pale)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tiles.t3{grid-template-columns:repeat(3,1fr)}.tiles.t3 .tile{flex-direction:column;align-items:flex-start;min-height:84px;font-size:.98rem}
.tile{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem}
.tile:hover{border-color:var(--ink)}
.tile .i{color:var(--point)}
.links{display:flex;flex-direction:column;gap:7px}
.links a{display:block;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;text-decoration:none;font-size:.92rem}
.links a:hover{border-color:var(--ink)}
.walk{margin-top:10px;border-radius:12px;overflow:hidden;aspect-ratio:16/9}

.foot{font-size:.85rem;color:var(--muted);text-align:center;padding:10px 0 28px}
/* 도구 화면 */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.vback{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:700;color:var(--ink)}

.vbar .when{color:var(--muted);font-size:.95rem}
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:14px;align-items:start;margin-bottom:24px}
.col{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.col h3{font-size:1.02rem;color:var(--ink);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.col h3:first-child{margin-top:0}
.col ul,.col ol{padding-left:1.2em}
.col li{margin:2px 0}
.chk li{list-style:none;position:relative;padding-left:4px}
.chk li:before{content:'✓';position:absolute;left:-1.1em;color:var(--ink2);font-weight:900}
.warn{background:var(--soft);border:2px solid var(--point);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.93rem}

.types button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbox{border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:12px}

.pbar{background:var(--ink);color:#fff;padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pbar .t{font-weight:900;margin-right:auto;font-size:.98rem}
.pbar button{background:#fff;color:var(--ink);border:0;border-radius:9px;padding:5px 11px;font-weight:700;font-size:.86rem}
.pbar button.cp{background:#F2C46B;color:#14301F}
.pbody{padding:12px 14px;background:#fff}
.row{display:grid;grid-template-columns:1fr 190px;gap:12px;padding:3px 0;border-bottom:1px dashed #E6E0D2}
.row:last-child{border-bottom:0}.row.one{grid-template-columns:1fr}
.row .tx{font-size:.98rem}
.row .nt{font-size:.82rem;color:var(--point);font-weight:700;line-height:1.4}
mark{background:none;color:var(--point);font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
u.v{text-decoration:none;background:#FFF1C9;border-radius:4px;padding:0 3px;font-weight:700}
.tip{font-size:.85rem;color:var(--muted);margin-top:8px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

.steps4 b{display:block;color:var(--ink);font-size:.95rem}
/* 개인정보 */
.quiz div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #E6E0D2}
.quiz span{flex:1}
.quiz button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 12px;font-weight:900}
.quiz .ok{background:var(--pale);border-color:var(--ink2)}
.quiz .no{background:var(--soft);border-color:var(--point)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.appimg{width:100%;border-radius:12px;border:2px solid var(--line);display:block}
.gbanner{width:100%;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 20px;margin-bottom:16px;text-align:left}
.gbrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.gbrow .gbanner{margin-bottom:0}.gbanner.alt{background:var(--point)}

.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.gt{width:100%;border-collapse:collapse;font-size:.93rem;background:#fff}

.gt td.c{text-align:center}
.news li{margin:4px 0}
.hw{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hw .col{padding:14px}
.hw h4{font-size:1.05rem;color:var(--ink)}
.hw .w{font-size:.88rem;color:var(--muted);margin-bottom:6px}

.gnote{font-size:.85rem;color:var(--muted);margin:8px 0 24px}

.subt{display:flex;gap:6px;background:var(--pale);padding:5px;border-radius:14px}.subt button{font:inherit;font-weight:800;font-size:1.05rem;padding:8px 18px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer}.subt button.on{background:var(--ink);color:#fff}.projrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pj{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:center}.pj:hover{background:var(--pale)}.pj .ic{width:54px;height:54px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.pj b{font-size:1.2rem;color:var(--ink);display:block}.pj span{font-size:.9rem;color:var(--muted)}
.main{grid-template-columns:repeat(9,minmax(0,1fr))!important}.m b{white-space:nowrap;font-size:1.02rem}.m{padding:14px 4px 12px}

 return '<div class="split"><div class="col"><h3>프로젝트 = 업무 보관함</h3><table class="gt"><tbody><tr><th>지침</th><td>이 프로젝트에서 AI가 지킬 규칙 (누구로서 · 무엇을 · 어떻게)</td></tr><tr><th>소스(파일)</th><td>넣어 두는 자료 — 서식·지침·전년도 문서. 매번 다시 첨부하지 않아도 돼요</td></tr><tr><th>채팅</th><td>프로젝트 안에서 하는 대화. 같은 프로젝트끼리 기억해요</td></tr></tbody></table>'+
 '<h3>만드는 순서 (ChatGPT 기준)</h3><ol><li>왼쪽 메뉴 <b>프로젝트 → 새 프로젝트</b>, 이름 짓기</li><li><b>지침</b> 칸에 업무별 지침 붙여넣기</li><li><b>파일 추가</b>로 서식·자료 올리기</li><li>프로젝트 안 새 채팅에 <b>첫 요청</b> 붙여넣기</li></ol><p class="tip">Claude는 왼쪽 <b>프로젝트</b>, 제미나이는 <b>노트북</b>이 비슷한 역할이에요.</p>'+
 '<h3>알아 두면 좋은 점</h3><ul class="chk"><li>무료는 프로젝트당 파일 5개 (2026년 11월 기준)</li><li>업무마다 프로젝트를 따로 — 계획서·결과보고·홍보물을 섞지 않기</li><li>잘 나온 답은 프로젝트 소스에 추가하면 다음에도 참고해요</li><li>실명·연락처·상담 원본은 소스에도 넣지 않기</li></ul><img class="appimg" style="margin-top:12px" src="/img/giheung/walk.webp" alt="휠체어를 사용하는 사람과 동행인이 웃으며 걷는 모습"></div>'+
 '<div class="col"><h3>사업별 프로젝트 고르기</h3><p class="tip" style="margin-bottom:8px">진행 순서: '+FLOW+'</p><div class="ph3">'+P.map(function(c){return '<button type="button" class="pcard" data-go="'+c.id+'"><b>'+c.pn+'</b><span>'+esc(c.when)+'</span><em>지침 · 첫 요청 보기 ›</em></button>'}).join('')+'</div><p class="tip">회의록·일지·보도자료처럼 반복되는 일은 프로젝트 없이 첫 화면 <b>딸깍 자동화</b>에서 프롬프트 하나로 해요.</p></div></div>'}
/* ===== 칸 고르기 도구 (프롬프트 디자인실·마음 쉼터·작곡실·빡침 번역기) ===== */
var BVS={};
function buildView(c){var v=BVS[c.id]=BVS[c.id]||{};var L=(c.fdyn?c.fdyn(v):c.f).map(function(f){var h='<div class="bf"><b>'+f.lab+'</b>';
  if(f.ch)h+='<div class="types">'+f.ch.map(function(x){return '<button type="button" data-bf="'+f.k+'" data-bv="'+esc(x)+'"'+(v[f.k]===x?' class="on"':'')+'>'+esc(x)+'</button>'}).join('')+'</div>';
  if(f.ta&&v[f.k]==null&&f.val)v[f.k]=f.val;
  if(f.ta)h+='<textarea id="bf-'+f.k+'" data-bk="'+f.k+'"'+(f.rows?' rows="'+f.rows+'" style="min-height:'+(f.rows*1.7)+'em"':'')+'>'+esc(v[f.k]||'')+'</textarea>'+(f.ph?'<p class="bex">'+esc(f.ph)+'</p>':'')+(f.mic?'<button type="button" class="mic" data-mic="bf-'+f.k+'">눌러서 말하기</button>':'');
  return h+'</div>'}).join('');
 if(c.att&&c.att.length)L+='<h3>함께 첨부하면 좋아요</h3><p>입력창 <b>[+]</b>로 '+c.att.map(esc).join(' · ')+'</p>';
 if(c.chk)L+='<h3>결과에서 사람이 확인할 3가지</h3><ul class="chk">'+c.chk.filter(Boolean).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 if(c.warn)L+='<div class="warn"><b>잠깐!</b> '+esc(c.warn)+'</div>';
 return '<div class="split bld"><div class="col">'+L+'</div><div class="col">'+pbox(c.id+'_b','완성된 지시문',c.tpl(v))+'<p class="tip">칸을 고르거나 쓰면 오른쪽 지시문이 바로 바뀌어요 · 주황 밑줄 = 바꾸는 곳</p></div></div>'}
function rebuild(c){var id=c.id+'_b';PT[id]=c.tpl(BVS[c.id]);var box=document.querySelector('[data-cp="'+id+'"]');if(box)box.closest('.pbox').querySelector('.pbody').innerHTML=PT[id].map(lineHTML).join('')}
var REC=null;
function micStart(b){var SR=window.SpeechRecognition||window.webkitSpeechRecognition,ta=document.getElementById(b.dataset.mic);if(!SR){toast('이 브라우저는 받아쓰기가 안 돼요. 휴대폰 키보드의 마이크를 써 주세요.');ta.focus();return}
 if(REC){REC.stop();return}REC=new SR();REC.lang='ko-KR';REC.interimResults=true;REC.continuous=true;var base=ta.value?ta.value+' ':'';b.classList.add('rec');b.textContent='듣는 중… 다 말하면 누르기';
 REC.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=base+t;ta.dispatchEvent(new Event('input'))};
 REC.onend=function(){b.classList.remove('rec');b.textContent='눌러서 말하기';REC=null};try{REC.start()}catch(e){}}
function modView(c){return '<div class="col" style="margin-bottom:24px" id="mod-host"></div>'}

var GTAB='cmp';
function tbl(h,rows){return '<table class="gt"><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+r.slice(1).map(function(x){return '<td'+(x.length<8?' class="c"':'')+'>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
function guideView(){var G=window.GUIDE;if(!G)return '<p>가이드를 불러오지 못했어요. 새로고침해 주세요.</p>';
 var T=[['cmp','한눈에 비교'],['gpt','ChatGPT'],['gem','제미나이'],['cla','Claude'],['custom','맞춤설정 가이드'],['inst','앱 설치']];
 var h='<div class="gtabs">'+T.map(function(t){return '<button type="button" data-gtab="'+t[0]+'"'+(GTAB===t[0]?' class="on"':'')+'>'+t[1]+'</button>'}).join('')+'</div>';
 if(GTAB==='cmp'){h+='<div class="col" style="margin-bottom:12px">'+tbl(G.cmp.head,G.cmp.rows)+'<h3 style="margin-top:14px">그래서 우리는 이렇게 써요</h3><ol>'+G.cmp.rule.map(function(r){return '<li>'+r+'</li>'}).join('')+'</ol></div><div class="col"><h3>ChatGPT 기능 5단계 — 어디까지 맡길까?</h3><img class="appimg" src="/img/giheung/gpt5.webp" alt="ChatGPT Chat, Project, Work, Codex, Dot 5단계 기능과 무료·유료 비교"></div>';}
 else if(GTAB==='custom'){var c=find('custom');h+='<div class="split"><div class="col"><h3>어디에 넣나요?</h3><table class="gt"><tbody>'+G.custom.where.map(function(w){return '<tr><th>'+w[0]+'</th><td>'+w[1]+'</td></tr>'}).join('')+'</tbody></table><h3>알아 두면 좋은 점</h3><ul class="chk">'+G.custom.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div><div class="col">'+pbox('custom_g','맞춤설정에 붙여넣을 지침',c.p)+'<p class="tip">팀명만 바꿔서 세 앱 모두에 똑같이 넣어 두면, 어느 앱을 써도 우리 기관 규칙대로 답해요.</p></div></div>';}
 else if(GTAB==='inst'){h+=appsView();}
 else{var A=G.apps[GTAB];h+='<div class="split"><div class="col"><h3>최근에 바뀐 것</h3><ul class="news">'+A.news.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul></div><div class="col"><h3>무료와 유료, 이렇게 달라요</h3>'+tbl(A.plan.head,A.plan.rows)+'<p class="tip">가격과 한도는 자주 바뀌어요. 결제 전 공식 요금 페이지에서 확인하세요.</p></div></div>';
  h+='<h3 style="color:var(--ink);font-size:1.15rem;margin:4px 0 10px">기능 따라 하기</h3><div class="hw">'+A.how.map(function(w,i){return '<div class="col"><h4>'+w.t+'</h4><p class="w">'+w.when+'</p><ol>'+w.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol>'+pbox(GTAB+'_h'+i,'바로 써 보기',w.p.split('\n'))+'</div>'}).join('')+'</div>';}
 return h+'<p class="gnote">2026년 11월 확인 · 메뉴 이름과 요금제는 업데이트에 따라 바뀔 수 있어요</p>'}
function appsView(){return '<div class="col" style="margin-bottom:24px"><img class="appimg" src="/img/giheung/apps.webp" alt="ChatGPT, 제미나이, Claude 데스크톱 앱의 장점과 다운로드 방법"><div class="chips" style="margin-top:12px"><a class="chip" href="https://chatgpt.com/download" target="_blank" rel="noopener">ChatGPT 다운로드</a><a class="chip" href="https://gemini.google/kr/desktop/" target="_blank" rel="noopener">제미나이 다운로드</a><a class="chip" href="https://claude.com/download" target="_blank" rel="noopener">Claude 다운로드</a></div><p class="tip">ChatGPT와 제미나이는 Windows 단축키(Alt + Space)가 같아요. 둘 다 깔면 한쪽 설정에서 바꿔 두세요.</p></div>'}
function bindTool(c){var v=$('#v-tool');
 v.querySelectorAll('[data-bk]').forEach(function(el){el.oninput=function(){BVS[c.id][el.dataset.bk]=el.value;rebuild(c)}});
 v.querySelectorAll('input[data-v]').forEach(function(el){el.oninput=function(){ls('gh_'+el.dataset.v,el.value);var o=document.getElementById(VK[el.dataset.v]);if(o)o.value=el.value;rerender(c)}});
 v.querySelectorAll('[data-type]').forEach(function(b){b.onclick=function(){TYPE=b.dataset.type;show(c.id)}})}
function rerender(c){var v=$('#v-tool');v.querySelectorAll('.pbox').forEach(function(box){var id=box.querySelector('[data-cp]').dataset.cp;box.querySelector('.pbody').innerHTML=PT[id].map(lineHTML).join('')})}

/* ===== 이벤트 ===== */
document.addEventListener('change',function(e){if(e.target.id==='saup'){ls('gh_사업',e.target.value);show(CUR)}});
document.addEventListener('keydown',function(e){if(e.target.id==='saup2'&&e.key==='Enter'&&e.target.value.trim()){ls('gh_사업',e.target.value.trim());show(CUR)}});
document.addEventListener('focusout',function(e){if(e.target.id==='saup2'&&e.target.value.trim()){ls('gh_사업',e.target.value.trim());show(CUR)}});
document.addEventListener('click',function(e){var t=e.target.closest('button,a');if(!t)return;
 if(t.hasAttribute('data-home')){goHome();return}
 if(t.dataset.pre){BVS[t.dataset.pre]={saup:t.dataset.saup2};show(t.dataset.pre);return}
 if(t.dataset.fb){FB=+t.dataset.fb;show('flow');return}
 if(t.dataset.fs){FS=+t.dataset.fs;show('flow');return}
 if(t.dataset.stab){STAB=t.dataset.stab;t.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===t)});blist();return}
 if(t.dataset.saup){ls('gh_사업',t.dataset.saup);var bi=BZ.map(function(x){return x.n}).indexOf(t.dataset.saup);if(bi>-1&&t.dataset.fs2){FB=bi;FS=+t.dataset.fs2;show('flow');return}show(t.dataset.to);return}
 if(t.dataset.go){show(t.dataset.go);return}
 if(t.dataset.biz){var b=BIZ[+t.dataset.biz];ls('gh_사업',b[0]);$('#v-biz').value=b[0];show(b[1]);return}
 if(t.dataset.bf==='saup'){var o0=BVS[CUR]||{};BVS[CUR]={saup:o0.saup===t.dataset.bv?'':t.dataset.bv,info:o0.info,memo:o0.memo};show(CUR);return}
 if(t.dataset.bf){var c0=find(CUR);var same=t.classList.contains('on');BVS[CUR][t.dataset.bf]=same?'':t.dataset.bv;t.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===t&&!same)});rebuild(c0);return}
 if(t.dataset.mic){micStart(t);return}
 if(t.dataset.gtab){GTAB=t.dataset.gtab;show('guide');return}
 if(t.dataset.cp){copy(plain(PT[t.dataset.cp]));return}
 if(t.dataset.ai){openAI(t.dataset.ai,plain(PT[t.dataset.p]));return}
 if(t.dataset.q){var q=QUIZ[+t.dataset.q],ok=t.dataset.a===q[1];t.parentNode.querySelectorAll('button').forEach(function(x){x.className=''});t.className=ok?'ok':'no';$('#qres').textContent=ok?'맞아요! 정답은 '+q[1]+'.':'아쉬워요. 정답은 '+q[1]+'.';return}
 if(t.id==='bigbtn'){var on=document.body.classList.toggle('big');t.setAttribute('aria-pressed',on);ls('gh_big',on?'1':'');return}
});
$('#q').addEventListener('keydown',function(e){if(e.key!=='Enter')return;var w=this.value.trim();if(!w)return;var hit=ALL.filter(function(c){return (c.t+' '+(c.key||'')+' '+(c.when||'')).indexOf(w)>-1});if(hit.length)show(hit[0].id);else toast('딱 맞는 메뉴가 없어요. 큰 메뉴에서 골라 주세요.')});
if(ls('gh_big')){document.body.classList.add('big');$('#bigbtn').setAttribute('aria-pressed','true')}
window.showToast=toast;window.go=function(k){show(k==='heart'?'rest':k)};
home();
var HS=location.hash.slice(1);if(HS.indexOf('guide-')===0){GTAB=HS.slice(6);show('guide')}else if(HS&&find(HS))show(HS);
})();
</script>
