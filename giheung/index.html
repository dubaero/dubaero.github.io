<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{--bg:#F7F3E8;--card:#fff;--ink:#1E4A34;--ink2:#2F6B4A;--text:#111;--muted:#2B3A31;--point:#D9603F;--soft:#FBF4E6;--pale:#EEF2EC;--line:#D9D2C2;--fs:17px}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{overflow-x:hidden;overflow-wrap:anywhere;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
body.big{--fs:20px}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 헤더 */
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.top a,.top button{background:none;border:0;color:#fff;font-weight:700;font-size:.9rem;text-decoration:none}
.top .home{border:1.5px solid rgba(255,255,255,.6);border-radius:20px;padding:3px 12px}
.top .sp{flex:1}
.badge{background:#fff;color:var(--ink);border-radius:20px;padding:3px 12px;font-size:.82rem;font-weight:700}
.bigbtn{border:1.5px solid rgba(255,255,255,.6)!important;border-radius:20px;padding:3px 12px}
/* 히어로 */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;margin:22px 0 16px}
.org{font-weight:700;color:var(--ink2);font-size:.95rem}
h1{font-size:2.35rem;line-height:1.25;font-weight:900;color:var(--ink);margin:6px 0 4px;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--point)}
.lead{font-size:1.05rem;color:var(--muted);margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:0 14px;height:54px}
.search input{border:0;outline:0;font:inherit;font-size:1rem;flex:1;background:none}
.hero-art{border-radius:22px;overflow:hidden;border:2px solid var(--line);aspect-ratio:892/726}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
/* 내 사업 넣기 */
.vars{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.vars b{color:var(--ink);font-size:1rem}
.vars label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem}
.vars input{font:inherit;font-size:.95rem;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;width:210px;background:var(--bg)}
.vars small{color:var(--muted);font-size:.85rem}
/* 큰 메뉴 */
.main{display:grid;grid-template-columns:repeat(8,1fr) minmax(0,1.3fr);gap:10px;margin-bottom:16px}
.m{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s}
.m:hover,.m:focus-visible{border-color:var(--ink)}
.m .ic{width:46px;height:46px;border-radius:14px;background:var(--pale);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.m b{font-size:1rem;line-height:1.25}
.m.red{border-color:var(--point);background:var(--soft)}
.m.red .ic{background:var(--point);color:#fff}
/* 대시보드 */
.dash{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:14px;margin-bottom:22px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ph h2{font-size:1.15rem;color:var(--ink)}
.ph small{color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.9rem;font-weight:700}
.chip:hover{border-color:var(--ink);background:var(--pale)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tiles.t3{grid-template-columns:repeat(3,1fr)}.tiles.t3 .tile{flex-direction:column;align-items:flex-start;min-height:84px;font-size:.98rem}
.tile{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem}
.tile:hover{border-color:var(--ink)}
.tile .i{color:var(--point)}
.links{display:flex;flex-direction:column;gap:7px}
.links a{display:block;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;text-decoration:none;font-size:.92rem}
.links a:hover{border-color:var(--ink)}
.walk{margin-top:10px;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.walk img{width:100%;height:100%;object-fit:cover;object-position:72% 55%;display:block}
.foot{font-size:.85rem;color:var(--muted);text-align:center;padding:10px 0 28px}
/* 도구 화면 */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.vback{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:700;color:var(--ink)}
.vbar h2{font-size:1.6rem;color:var(--ink);font-weight:900}
.vbar .when{color:var(--muted);font-size:.95rem}
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:14px;align-items:start;margin-bottom:24px}
.col{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.col h3{font-size:1.02rem;color:var(--ink);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.col h3:first-child{margin-top:0}
.col ul,.col ol{padding-left:1.2em}
.col li{margin:2px 0}
.chk li{list-style:none;position:relative;padding-left:4px}
.chk li:before{content:'✓';position:absolute;left:-1.1em;color:var(--ink2);font-weight:900}
.warn{background:var(--soft);border:2px solid var(--point);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.93rem}
.warn b{color:var(--point)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:4px 12px;font-weight:700;font-size:.9rem}
.types button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbox{border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:12px}
.pbox:last-child{margin-bottom:0}
.pbar{background:var(--ink);color:#fff;padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pbar .t{font-weight:900;margin-right:auto;font-size:.98rem}
.pbar button{background:#fff;color:var(--ink);border:0;border-radius:9px;padding:5px 11px;font-weight:700;font-size:.86rem}
.pbar button.cp{background:#F2C46B;color:#14301F}
.pbody{padding:12px 14px;background:#fff}
.row{display:grid;grid-template-columns:1fr 190px;gap:12px;padding:3px 0;border-bottom:1px dashed #E6E0D2}
.row:last-child{border-bottom:0}.row.one{grid-template-columns:1fr}
.row .tx{font-size:.98rem}
.row .nt{font-size:.82rem;color:var(--point);font-weight:700;line-height:1.4}
mark{background:none;color:var(--point);font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
u.v{text-decoration:none;background:#FFF1C9;border-radius:4px;padding:0 3px;font-weight:700}
.tip{font-size:.85rem;color:var(--muted);margin-top:8px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.steps4 div{background:var(--pale);border-radius:12px;padding:10px;font-size:.9rem}
.steps4 b{display:block;color:var(--ink);font-size:.95rem}
/* 개인정보 */
.quiz div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #E6E0D2}
.quiz span{flex:1}
.quiz button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 12px;font-weight:900}
.quiz .ok{background:var(--pale);border-color:var(--ink2)}
.quiz .no{background:var(--soft);border-color:var(--point)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.appimg{width:100%;border-radius:12px;border:2px solid var(--line);display:block}
.gbanner{width:100%;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 20px;margin-bottom:16px;text-align:left}
.gbrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.gbrow .gbanner{margin-bottom:0}.gbanner.alt{background:var(--point)}
.gbanner b{font-size:1.12rem}.gbanner span{opacity:.9;font-size:.93rem}.gbanner em{margin-left:auto;font-style:normal;background:#F2C46B;color:#14301F;border-radius:20px;padding:5px 14px;font-weight:900;white-space:nowrap}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.gtabs button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 16px;font-weight:900;font-size:.98rem}
.gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gt{width:100%;border-collapse:collapse;font-size:.93rem;background:#fff}
.gt th,.gt td{border:1.5px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.gt thead th{background:var(--ink);color:#fff;text-align:center}
.gt tbody th{background:var(--pale);color:var(--ink);white-space:nowrap}
.gt td.c{text-align:center}
.news li{margin:4px 0}
.hw{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hw .col{padding:14px}
.hw h4{font-size:1.05rem;color:var(--ink)}
.hw .w{font-size:.88rem;color:var(--muted);margin-bottom:6px}
.hw ol{padding-left:1.2em;margin-bottom:10px}
.gnote{font-size:.85rem;color:var(--muted);margin:8px 0 24px}
@media(max-width:980px){.gbrow{grid-template-columns:1fr}.hw{grid-template-columns:1fr}.gt{font-size:.85rem}.gbanner{flex-wrap:wrap}.gbanner em{margin-left:0}}
.bf{margin-bottom:12px}.split.bld>.col:last-child{position:sticky;top:12px}.bf b{display:block;color:var(--ink);font-size:.98rem;margin-bottom:5px}
.bf .types{margin-bottom:6px}.bf input,.bf textarea{width:100%;font:inherit;font-size:.95rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.bf textarea{min-height:84px;resize:vertical}.mic{margin-top:5px;background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:3px 12px;font-weight:700;font-size:.85rem;color:var(--ink)}.mic.rec{background:var(--point);color:#fff;border-color:var(--point)}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}.pcard:hover{border-color:var(--ink)}.pcard b{font-size:1.05rem;color:var(--ink)}.pcard span{font-size:.88rem;color:var(--muted)}.pcard em{font-style:normal;font-size:.85rem;color:var(--point);font-weight:700;margin-top:4px}
@media(max-width:980px){.ph3{grid-template-columns:1fr 1fr}}@media(max-width:560px){.ph3{grid-template-columns:1fr}.tiles.t3{grid-template-columns:1fr 1fr}}
.sec{margin-bottom:14px}.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.sh b{font-size:1.2rem;color:var(--ink);font-weight:900}.sh span{color:var(--muted);font-size:.93rem}
.subt{display:flex;gap:6px;background:var(--pale);padding:5px;border-radius:14px}.subt button{font:inherit;font-weight:800;font-size:1.05rem;padding:8px 18px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer}.subt button.on{background:var(--ink);color:#fff}.projrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pj{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:center}.pj:hover{background:var(--pale)}.pj .ic{width:54px;height:54px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.pj b{font-size:1.2rem;color:var(--ink);display:block}.pj span{font-size:.9rem;color:var(--muted)}
.main{grid-template-columns:repeat(9,minmax(0,1fr))!important}.m b{white-space:nowrap;font-size:1.02rem}.m{padding:14px 4px 12px}
@media(max-width:980px){.main{grid-template-columns:repeat(3,1fr)!important}.m b{white-space:normal}.projrow{grid-template-columns:1fr}.main{grid-template-columns:repeat(3,1fr)}.m.red{grid-column:span 3;flex-direction:row;justify-content:center}.dash{grid-template-columns:1fr}.split{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-art{aspect-ratio:892/726}}
@media(max-width:560px){:root{--fs:16px}h1{font-size:1.45rem}.hero{margin-top:14px}.col{overflow-x:auto}.gt{min-width:520px}.vars input{width:100%}.vars label{width:100%}.row{grid-template-columns:1fr}.row .nt{padding-bottom:4px}.steps4{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr}.badge{display:none}}

/* ===== 가족센터 방식 첫 화면 ===== */
.top{background:#fff!important;color:var(--ink)!important;border-bottom:1px solid var(--line)}
.top a,.top button{color:var(--ink)!important}.top .home{background:var(--ink);color:#fff!important;border:0}

.hero{grid-template-columns:1fr auto!important;gap:20px;align-items:center;margin:16px 0 12px;padding:22px 26px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(120deg,#E4F4DC 0%,#FBF7EE 55%,#FFE6D2 100%)}
.hero h1{font-size:2rem;margin:0 0 6px;white-space:nowrap}.hero h1 em{font-style:normal;color:var(--point)}
.hero .lead{margin:0 0 14px}.hero .search{max-width:560px}
.hero-art{aspect-ratio:auto!important;height:210px;border:0;border-radius:14px}.hero-art img{width:auto;height:210px;object-fit:contain}
.menu{display:grid;grid-template-columns:repeat(8,1fr) 1.35fr;gap:8px;margin-bottom:14px}
.mt{background:#fff;border:1.5px solid #C96A2B;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--ink)}
.mt .i{width:20px;height:20px}.mt span{font-weight:900;font-size:1.02rem;white-space:nowrap}
.mt:hover{background:#FFF6EC}.mt.red{background:#FFF0EC;border-color:var(--point);color:var(--point)}

.stab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.stab button{font:inherit;font-weight:700;padding:7px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer}
.stab button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.blist{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
.blist li{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #E6DFD2}
.blist .n{width:22px;color:var(--muted);font-size:.9rem;text-align:center}.blist b{flex:1;font-size:1rem}

.guidebox{display:block;width:100%;margin-top:10px;background:#F6F1E6;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.guidebox b{display:block;color:var(--ink);font-size:1.08rem}.guidebox span{font-size:.9rem}

.reccard div{flex:1}.reccard b{display:block;color:var(--ink)}.reccard span{font-size:.88rem;color:var(--muted)}
.reccard em{font-style:normal;background:var(--ink);color:#fff;border-radius:16px;padding:4px 12px;font-weight:700}
.golist button,.golist a{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #E6DFD2;padding:12px 4px;font:inherit;font-weight:700;color:var(--text,#111);text-decoration:none;cursor:pointer}

.ft{background:#12482C;color:#fff;font-size:.9rem;padding:16px 0;line-height:1.7}.ft a{color:#fff}
.sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F1EBE1;border-radius:12px;padding:10px 14px;margin:-4px 0 12px}

.bzrow{display:flex;flex-wrap:wrap;gap:6px;background:#F1EBE1;border-radius:12px;padding:10px;margin-bottom:10px}

function promoG(saup){var s=saup?saup+' ':'';return ['# 용인시기흥장애인복지관 '+s+'홍보물 통합 제작 지침','## 역할','너는 [[장애인복지관 전문 홍보 기획자이자 홍보디자인 전문가|역할]]다. 복지관 사업을 이용자·보호자·지역주민이 쉽게 이해하고 실제로 참여하도록 돕는 홍보물을, 사업 의도와 대상에 맞는 분위기로 기획하고 만든다.','## 제작 순서 (반드시 지킴)','① 홍보물 선택 → ② 기본정보 입력 → ③ 기획안 제안 → ④ 디자인 스타일 선택(=승인) → ⑤ 제작 및 검수','이미 받은 정보는 다시 묻지 않는다. 기획안과 스타일 선택 전에는 이미지를 만들지 않는다.','## ① 홍보물 선택','제작물을 아직 정하지 않았으면 번호 목록으로 묻는다: "어떤 홍보물을 만들까요? 잘 모르겠다면 목적에 맞게 추천해 드려요."','1. 카드뉴스  2. 포스터  3. 인포그래픽  4. 웹툰  5. 월간 「N월의 기록」  6. 사진 홍보 이미지  7. 쉬운 안내문(그림+쉬운 말)  8. 잘 모르겠어요','"잘 모르겠어요"를 고르면 무엇을 홍보하는지 한 줄만 묻고, 맞는 제작물 3가지를 이유와 함께 추천한다.','## ② 기본정보 입력','한 번에, 알고 있는 것만 한 줄로 쓰게 한다: "사업 / 목적 / 프로그램명 / 핵심 내용(일정·대상·장소·인원·신청 방법·주요 활동) / 보는 사람"','예시: "'+(saup||'개관기념행사·가족잔치')+' / 참여자 모집 / 2026 연말 가족잔치 / 12월 19일 14시 4층 강당, 이용자 가족 80명, 담당 팀 전화 신청 / 이용자와 보호자"','소스에 안내문·공문이 있으면 거기서 채우고, 받은 정보는 "프로그램 기본정보" 요약 상자로 보여 준다.','## ③ 기획안 제안','이미지를 만들지 말고 방향이 서로 다른 기획안 3가지(1안·2안·3안)를 보여 준다.','- 기본 설정: 제작물, 목적, 프로그램명, 대상, 추천 장수, 계절(행사 날짜 기준), 전체 분위기','- 이미지별 구성: [역할 / 화면 구성(배경·인물·행동·소품·글자 배치) / 들어갈 문구 / 포인트]','  · 카드뉴스: 표지 → 프로그램 소개 → 핵심 정보 → 신청 방법 → 참여 독려','  · 포스터: 제목 → 대표 이미지 → 행사 정보 → 신청 안내 → 기관 정보 자리','  · 인포그래픽: 주제 → 핵심 정보 → 그림 설명 → 요약·행동 안내','  · 웹툰: 상황 → 문제 → 과정 → 해결 → 마무리','  · 「N월의 기록」: 표지(월·대표 사진) → 사업별 한 장씩(사진 + 두 줄) → 감사 인사','- 확인 필요 정보: 빠진 장소·시간·연락처·신청 방법만 [확인 필요]로','- 기획안 끝에 ④ 디자인 스타일 선택을 바로 이어서 보여 준다.','## ④ 디자인 스타일 선택 (= 승인)','아래 8가지를 보여 주고 목적·대상에 맞는 3가지에 "추천"을 표시한다. 마지막에 "고른 스타일로 바로 제작할게요. 기획안에서 바꿀 것이 있으면 함께 말씀해 주세요."라고 쓴다.'].concat(STYLE8,['## ⑤ 제작 및 검수','- 스타일을 고르면 승인으로 보고, 기획안의 모든 이미지를 한 장씩 따로 만든다. 합본은 만들지 않는다.','- 모든 이미지의 색감·캐릭터 외형·글자 분위기를 통일한다.','- 다 만들면 프로그램명·일정·대상·장소·신청 방법·연락처가 기획안과 같은지, 오탈자·글자 잘림이 없는지 짧게 검수한다. 확인 못 한 부분은 "검수 완료"라고 하지 않는다.','## 지킬 것','- 날짜·장소·인원·연락처·신청 방법·선착순 여부는 지어내지 말고 [확인 필요]로 둔다.','- 장애를 동정·영웅으로 그리지 않는다. 휠체어·보조기구는 자연스럽게, 당사자가 활동의 주인공이 되게 그린다.','- 글자는 크고 짧게, 쉬운 말로 쓴다. 날짜·전화번호처럼 정확해야 하는 글자는 캔바에서 넣도록 자리를 비워 둔다.','- 기관 로고·포니 캐릭터는 그리지 않고 자리만 비워 둔다(캔바에서 넣기). 실제 인물·다른 회사 캐릭터는 그리지 않는다.','- 이용자 얼굴
