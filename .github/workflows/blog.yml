name: 블로그 후기 자동 가져오기

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다
  workflow_dispatch: {}        # Actions 화면에서 바로 실행 가능
  push:
    branches: [main]
    paths: ["scripts/fetch_blog.py", "data/blog-config.json"]

permissions:
  contents: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 블로그 후기 가져오기
        run: |
          pip install --quiet pillow
          python scripts/fetch_blog.py
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "dubaero-bot"
          git config user.email "dubaero-bot@users.noreply.github.com"
          git add data/blog.json img/blog
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "자동: 블로그 강의 후기 갱신"
          git push
